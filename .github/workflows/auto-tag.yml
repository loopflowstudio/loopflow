name: Auto Tag Release

on:
  push:
    branches: [main]
    paths: [RELEASE_NOTES.md]

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract version and create tag
        run: |
          version=$(head -1 RELEASE_NOTES.md | sed -n 's/^# v\(.*\)/v\1/p')
          if [ -z "$version" ]; then
            echo "No version found in RELEASE_NOTES.md header"
            exit 0
          fi
          if git ls-remote --tags origin "$version" | grep -q .; then
            echo "Tag $version already exists"
            exit 0
          fi

          # Verify Cargo.toml version matches before tagging
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          expected="${version#v}"
          if [ "$cargo_version" != "$expected" ]; then
            echo "::error::Version mismatch: RELEASE_NOTES.md says $version but Cargo.toml has $cargo_version"
            exit 1
          fi

          git tag "$version"
          git push origin "$version"
