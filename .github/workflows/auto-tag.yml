name: Auto Tag Release

on:
  push:
    branches: [main]
    paths: [RELEASE_NOTES.md]

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract version and create tag
        run: |
          version=$(head -1 RELEASE_NOTES.md | sed -n 's/^# v\(.*\)/\1/p')
          if [ -z "$version" ]; then
            echo "No version found in RELEASE_NOTES.md header"
            exit 0
          fi
          cargo_version=$(grep -A5 '\[workspace.package\]' Cargo.toml | grep '^version' | sed 's/version = "\(.*\)"/\1/')
          if [ "$cargo_version" != "$version" ]; then
            echo "Cargo.toml version ($cargo_version) != RELEASE_NOTES.md version ($version), skipping"
            exit 0
          fi
          if git ls-remote --tags origin "v$version" | grep -q .; then
            echo "Tag v$version already exists"
            exit 0
          fi
          git tag "v$version"
          git push origin "v$version"
