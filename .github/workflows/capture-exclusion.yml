name: Capture exclusion experiment

on:
  pull_request:
    paths:
      - .github/workflows/capture-exclusion.yml
      - scripts/test_capture_exclusion.py
      - tests/e2e/capture_exclusion.py
      - tests/e2e/capture_exclusion.Dockerfile

permissions:
  contents: read

jobs:
  released-writer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Probe released writes during exclusion and after worker death
        run: uv run --no-project python scripts/test_capture_exclusion.py
