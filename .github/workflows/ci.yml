name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# A new PR head supersedes its old proof. Main and merge-group runs each keep
# their own identity so independent integration proofs do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  merge-proof:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.proof.outputs.reuse }}
      proof_url: ${{ steps.proof.outputs.proof_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Find the merge queue's proof for this exact commit
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/check_ci_proof.py

  architecture-check:
    needs: [merge-proof, scratch-clear]
    if: ${{ !cancelled() && needs.scratch-clear.outputs.candidate == 'true' && needs.merge-proof.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Verify the architecture map
        run: uv run python scripts/check_architecture.py

  # Scratch belongs to work in progress. Delivery clears it before publishing
  # a landing candidate; queue/main runs must never accept that exemption.
  scratch-clear:
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.scratch.outputs.candidate }}
    steps:
      - uses: actions/checkout@v7
      - name: Select landing candidates and enforce queue scratch cleanup
        id: scratch
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ ! -d scratch ]; then
            echo "scratch/ is missing"
            exit 1
          fi

          EXTRA=$(find scratch -mindepth 1 ! -path 'scratch/.gitkeep' -print)
          if [ -n "$EXTRA" ]; then
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "Checkpoint: hosted proof is deferred until scratch/ is clear." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "candidate=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "scratch/ must be clear before landing"
            echo "$EXTRA"
            exit 1
          fi
          echo "candidate=true" >> "$GITHUB_OUTPUT"

  # Lint and test are split so the clippy compile and the test compile run on
  # separate runners in parallel instead of back-to-back on one critical path.
  # Distinct cache keys keep the clippy-artifact and rustc-artifact caches apart.
  rust-lint:
    needs: [merge-proof, scratch-clear]
    if: ${{ !cancelled() && needs.scratch-clear.outputs.candidate == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: astral-sh/setup-uv@v7
      - name: Fingerprint workspace build profiles
        id: rust-profiles
        run: uv run python scripts/rust_profile_cache_key.py >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          key: lint-${{ steps.rust-profiles.outputs.key }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run cargo fmt check
        if: needs.merge-proof.outputs.reuse != 'true' || steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo fmt --all -- --check
      - name: Run cargo clippy
        if: needs.merge-proof.outputs.reuse != 'true' || steps.rust-cache.outputs.cache-hit != 'true'
        run: /usr/bin/time -v cargo clippy --all-targets -- -D warnings

  rust-test:
    needs: [merge-proof, scratch-clear]
    if: ${{ !cancelled() && needs.scratch-clear.outputs.candidate == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - name: Materialize draft migrations for tests
        run: |
          VERSION=$(uv run python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          uv run python scripts/canonicalize_migrations.py "$VERSION" --materialize-for-tests
      - name: Fingerprint workspace build profiles
        id: rust-profiles
        run: uv run python scripts/rust_profile_cache_key.py >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          key: test-${{ steps.rust-profiles.outputs.key }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
        if: needs.merge-proof.outputs.reuse != 'true' || steps.rust-cache.outputs.cache-hit != 'true'
      - name: Run Rust tests
        if: needs.merge-proof.outputs.reuse != 'true' || steps.rust-cache.outputs.cache-hit != 'true'
        run: /usr/bin/time -v cargo nextest run --all --no-fail-fast
      - name: Prove checkout refresh through the CLI
        if: needs.merge-proof.outputs.reuse != 'true' || steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          # Integration tests above already build this executable.
          test -x "$PWD/target/debug/lf"
          LOOPFLOW_TEST_LF="$PWD/target/debug/lf" /usr/bin/time -v uv run pytest python/tests/test_checkout_refresh.py

  task-installation:
    needs: [merge-proof, scratch-clear]
    if: ${{ !cancelled() && needs.scratch-clear.outputs.candidate == 'true' && needs.merge-proof.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Prove managed Tasks in a disposable installation
        run: uv run python scripts/test_task_installation.py

  # Needs the full history: the check compares every migration against the last
  # release tag, which is how an edited shipped migration is caught before publish.
  migration-check:
    needs: [merge-proof, scratch-clear]
    if: ${{ !cancelled() && needs.scratch-clear.outputs.candidate == 'true' && needs.merge-proof.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Fetch canonical migration history
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Verify migration namespaces
        env:
          LOOPFLOW_REQUIRE_ORIGIN_MAIN: "1"
        run: uv run python scripts/check_migrations.py

  python-test:
    needs: [merge-proof, scratch-clear]
    if: ${{ !cancelled() && needs.scratch-clear.outputs.candidate == 'true' && needs.merge-proof.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Run Python tests
        run: uv run pytest python/tests/

  website-test:
    needs: [merge-proof, scratch-clear]
    if: ${{ !cancelled() && needs.scratch-clear.outputs.candidate == 'true' && needs.merge-proof.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Run website tests
        run: uv run python dev.py test
        working-directory: website

  e2e-smoke:
    needs: [merge-proof, scratch-clear]
    if: ${{ !cancelled() && needs.scratch-clear.outputs.candidate == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - name: Fingerprint workspace build profiles
        id: rust-profiles
        run: uv run python scripts/rust_profile_cache_key.py >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          key: ${{ steps.rust-profiles.outputs.key }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run E2E smoke test
        if: needs.merge-proof.outputs.reuse != 'true' || steps.rust-cache.outputs.cache-hit != 'true'
        run: /usr/bin/time -v tests/e2e/test_smoke.sh

  swift-test:
    needs: [merge-proof, scratch-clear]
    if: ${{ !cancelled() && needs.scratch-clear.outputs.candidate == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Fingerprint workspace build profiles
        id: rust-profiles
        run: uv run python scripts/rust_profile_cache_key.py >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          key: swift-cli-${{ steps.rust-profiles.outputs.key }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fingerprint Swift build inputs
        id: swift-inputs
        run: uv run python scripts/swift_cache.py key >> "$GITHUB_OUTPUT"
      - name: Restore SwiftPM build
        id: swift-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            swift/.build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.swift-inputs.outputs.key }}
          restore-keys: ${{ steps.swift-inputs.outputs.restore-prefix }}
      - name: Restore unchanged Swift source timestamps
        run: uv run python scripts/swift_cache.py restore
      - name: Build CLI for Swift transport tests
        if: needs.merge-proof.outputs.reuse != 'true' || steps.rust-cache.outputs.cache-hit != 'true' || steps.swift-cache.outputs.cache-hit != 'true'
        run: /usr/bin/time -l cargo build -p loopflow --bin lf
      - name: Build Desktop and run headless model and view tests
        if: needs.merge-proof.outputs.reuse != 'true' || steps.rust-cache.outputs.cache-hit != 'true' || steps.swift-cache.outputs.cache-hit != 'true'
        shell: bash
        # Failure locations come from #file/#line, so debug info is unnecessary.
        # swift test builds LoopflowMac. Display-session diagnostics are opt-in;
        # production view inspection and control actions need no app launch.
        run: |
          mkdir -p "$RUNNER_TEMP/swift-tests"
          swift --version > "$RUNNER_TEMP/swift-tests/toolchain.txt"
          /usr/bin/time -l scripts/test_desktop.sh -Xswiftc -gnone \
            --event-stream-output-path "$RUNNER_TEMP/swift-tests/events.jsonl" \
            --event-stream-version 0 \
            2>&1 | tee "$RUNNER_TEMP/swift-tests/output.log"
        # Bound native test execution, including subprocess cleanup, rather
        # than holding the PR for GitHub's six-hour default on a hang.
        timeout-minutes: 20
      - name: Preserve Swift failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: swift-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swift-tests
          if-no-files-found: ignore
          retention-days: 7
      - name: Check Swift multiplatform boundaries
        if: needs.merge-proof.outputs.reuse != 'true' || steps.rust-cache.outputs.cache-hit != 'true' || steps.swift-cache.outputs.cache-hit != 'true'
        run: uv run python scripts/check_swift_multiplatform_boundaries.py
      - name: Record Swift source timestamps
        if: github.ref == 'refs/heads/main' && steps.swift-cache.outputs.cache-hit != 'true'
        run: uv run python scripts/swift_cache.py save
      - name: Save SwiftPM build
        if: github.ref == 'refs/heads/main' && steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            swift/.build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.swift-inputs.outputs.key }}

  loopflow-ui-test:
    needs: [merge-proof, scratch-clear]
    if: ${{ !cancelled() && needs.scratch-clear.outputs.candidate == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - name: Fingerprint workspace build profiles
        id: rust-profiles
        run: uv run python scripts/rust_profile_cache_key.py >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          key: loopflow-ui-test-${{ steps.rust-profiles.outputs.key }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: . -> target/dev-app-control
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Fingerprint Xcode build inputs
        id: xcode-inputs
        run: uv run python scripts/swift_cache.py key --build-system xcode >> "$GITHUB_OUTPUT"
      - name: Restore Xcode build
        id: xcode-cache
        uses: actions/cache/restore@v6
        with:
          path: swift/.build/xcode-derived-data
          # Only identical source and toolchain inputs may reuse signed build
          # state. In particular, changed entitlements need fresh DerivedData.
          key: ${{ steps.xcode-inputs.outputs.key }}
      - name: Restore unchanged Xcode source timestamps
        run: uv run python scripts/swift_cache.py restore --build-system xcode
      - name: Generate Xcode project
        if: needs.merge-proof.outputs.reuse != 'true' || steps.rust-cache.outputs.cache-hit != 'true' || steps.xcode-cache.outputs.cache-hit != 'true'
        run: xcodegen generate
        working-directory: swift
      - name: Build Loopflow for testing (compile check)
        if: needs.merge-proof.outputs.reuse != 'true' || steps.rust-cache.outputs.cache-hit != 'true' || steps.xcode-cache.outputs.cache-hit != 'true'
        # Compile the app and signed test runners with the terminal fallback;
        # SwiftPM exercises the suites with GhosttyKit. build-for-testing keeps
        # that separate configuration's compile proof without launching a host.
        # The real hosted UI run is the separately named required gate
        # `scripts/test.py --ui-host`; see release/UI_HOST_GATE.md.
        run: |
          /usr/bin/time -l xcodebuild build-for-testing \
            -project LoopflowSwift.xcodeproj \
            -scheme LoopflowMac \
            -destination platform=macOS \
            -derivedDataPath .build/xcode-derived-data \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=
        timeout-minutes: 12
        working-directory: swift
      - name: Record Xcode source timestamps
        if: github.ref == 'refs/heads/main' && steps.xcode-cache.outputs.cache-hit != 'true'
        run: uv run python scripts/swift_cache.py save --build-system xcode
      - name: Save Xcode build
        if: github.ref == 'refs/heads/main' && steps.xcode-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: swift/.build/xcode-derived-data
          key: ${{ steps.xcode-inputs.outputs.key }}

  tests-result:
    # A skipped checkpoint is not proof. Only PR checkpoints may skip the
    # aggregate; a failed classifier must still produce a failing required check.
    if: ${{ always() && (github.event_name != 'pull_request' || needs.scratch-clear.result != 'success' || needs.scratch-clear.outputs.candidate != 'false') }}
    runs-on: ubuntu-latest
    needs:
      - merge-proof
      - architecture-check
      - scratch-clear
      - rust-lint
      - rust-test
      - migration-check
      - python-test
      - website-test
      - e2e-smoke
      - task-installation
      - swift-test
      - loopflow-ui-test
    steps:
      - name: Aggregate test results
        env:
          REUSED_PROOF: ${{ needs.merge-proof.outputs.proof_url }}
          ARCHITECTURE_CHECK: ${{ needs.architecture-check.result }}
          SCRATCH_CLEAR: ${{ needs.scratch-clear.result }}
          RUST_LINT: ${{ needs.rust-lint.result }}
          RUST_TEST: ${{ needs.rust-test.result }}
          MIGRATION_CHECK: ${{ needs.migration-check.result }}
          PYTHON_TEST: ${{ needs.python-test.result }}
          WEBSITE_TEST: ${{ needs.website-test.result }}
          E2E_SMOKE: ${{ needs.e2e-smoke.result }}
          TASK_INSTALLATION: ${{ needs.task-installation.result }}
          SWIFT_TEST: ${{ needs.swift-test.result }}
          LOOPFLOW_UI_TEST: ${{ needs.loopflow-ui-test.result }}
        run: |
          failures=0
          if [ -n "$REUSED_PROOF" ]; then
            echo "Reused exact merge-group proof: $REUSED_PROOF"
          fi

          check_result() {
            local name="$1"
            local result="$2"
            case "$result" in
              success)
                echo "PASS  $name"
                ;;
              skipped)
                if [ -n "$REUSED_PROOF" ]; then
                  echo "PROVED  $name ($REUSED_PROOF)"
                else
                  echo "FAIL  $name (skipped without proof)"
                  failures=1
                fi
                ;;
              *)
                echo "FAIL  $name ($result)"
                failures=1
                ;;
            esac
          }

          check_result "architecture-check" "$ARCHITECTURE_CHECK"
          check_result "scratch-clear" "$SCRATCH_CLEAR"
          check_result "rust-lint" "$RUST_LINT"
          check_result "rust-test" "$RUST_TEST"
          check_result "migration-check" "$MIGRATION_CHECK"
          check_result "python-test" "$PYTHON_TEST"
          check_result "website-test" "$WEBSITE_TEST"
          check_result "e2e-smoke" "$E2E_SMOKE"
          check_result "task-installation" "$TASK_INSTALLATION"
          check_result "swift-test" "$SWIFT_TEST"
          check_result "loopflow-ui-test" "$LOOPFLOW_UI_TEST"

          exit "$failures"
