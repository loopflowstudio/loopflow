name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  scratch-clear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify scratch/ is clear
        run: |
          if [ ! -d scratch ]; then
            echo "scratch/ is missing"
            exit 1
          fi

          EXTRA=$(find scratch -mindepth 1 ! -path 'scratch/.gitkeep' -print)
          if [ -n "$EXTRA" ]; then
            echo "scratch/ must be clear before landing"
            echo "$EXTRA"
            exit 1
          fi

  # Lint and test are split so the clippy compile and the test compile run on
  # separate runners in parallel instead of back-to-back on one critical path.
  # Distinct cache keys keep the clippy-artifact and rustc-artifact caches apart.
  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - name: Run cargo fmt check
        run: cargo fmt --all -- --check
      - name: Run cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - name: Materialize draft migrations for tests
        run: |
          VERSION=$(uv run python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          uv run python scripts/canonicalize_migrations.py "$VERSION" --materialize-for-tests
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - uses: taiki-e/install-action@nextest
      - name: Run Rust tests
        run: cargo nextest run --all

  # Needs the full history: the check compares every migration against the last
  # release tag, which is how an edited shipped migration is caught before publish.
  migration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Fetch canonical migration history
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Verify migration namespaces
        env:
          LOOPFLOW_REQUIRE_ORIGIN_MAIN: "1"
        run: uv run python scripts/check_migrations.py

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Run Python tests
        run: uv run pytest python/tests/

  website-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Run website tests
        run: uv run python dev.py test
        working-directory: website

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - name: Run E2E smoke test
        run: tests/e2e/test_smoke.sh

  swift-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: |
            swift/.build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('swift/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-
      - name: Run Swift tests
        # -gnone skips debug-info generation; `swift test` here is ~95% compile,
        # and CI never symbolicates. Failure locations come from #file/#line
        # macros, not debug info, so they're preserved.
        run: swift test --package-path swift -Xswiftc -gnone
      - name: Check Swift multiplatform boundaries
        run: uv run python scripts/check_swift_multiplatform_boundaries.py
      - name: Prove the control room renders its four states distinctly
        # Unlike the hosted XCUITest (which needs Automation permission and so
        # lives behind the `--ui-host` gate), this launches the built app
        # directly and renders each state's window through SnapshotService
        # (cacheDisplay, no Screen Recording or Automation permission needed),
        # then asserts the four states at two widths are pairwise distinct. It
        # is the CI-runnable half of the control-room state proof — fixture
        # lookup and state-forwarding regressions fail this step.
        run: |
          swift build --package-path swift --product LoopflowMac
          scripts/prove_wave_surface_states.sh
        timeout-minutes: 15

  loopflow-ui-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: swift
      - name: Build Loopflow for testing (compile check)
        # The hosted test *run* is redundant: swift-test runs these same suites
        # un-hosted. This job's only unique signal is that the Loopflow app
        # target compiles. build-for-testing gives that without launching the
        # app, so there is no test-host run loop to hang on — deterministically
        # no hang, unlike relying on the app to terminate itself.
        # The real hosted UI run is the separately named required gate
        # `scripts/test.py --ui-host`; see release/UI_HOST_GATE.md.
        run: |
          xcodebuild build-for-testing \
            -project LoopflowSwift.xcodeproj \
            -scheme LoopflowMac \
            -destination platform=macOS \
            -derivedDataPath DerivedData \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=
        timeout-minutes: 12
        working-directory: swift

  tests-result:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - scratch-clear
      - rust-lint
      - rust-test
      - migration-check
      - python-test
      - website-test
      - e2e-smoke
      - swift-test
      - loopflow-ui-test
    steps:
      - name: Aggregate test results
        env:
          SCRATCH_CLEAR: ${{ needs.scratch-clear.result }}
          RUST_LINT: ${{ needs.rust-lint.result }}
          RUST_TEST: ${{ needs.rust-test.result }}
          MIGRATION_CHECK: ${{ needs.migration-check.result }}
          PYTHON_TEST: ${{ needs.python-test.result }}
          WEBSITE_TEST: ${{ needs.website-test.result }}
          E2E_SMOKE: ${{ needs.e2e-smoke.result }}
          SWIFT_TEST: ${{ needs.swift-test.result }}
          LOOPFLOW_UI_TEST: ${{ needs.loopflow-ui-test.result }}
        run: |
          failures=0

          check_result() {
            local name="$1"
            local result="$2"
            case "$result" in
              success)
                echo "PASS  $name"
                ;;
              skipped)
                echo "SKIP  $name"
                ;;
              *)
                echo "FAIL  $name ($result)"
                failures=1
                ;;
            esac
          }

          check_result "scratch-clear" "$SCRATCH_CLEAR"
          check_result "rust-lint" "$RUST_LINT"
          check_result "rust-test" "$RUST_TEST"
          check_result "migration-check" "$MIGRATION_CHECK"
          check_result "python-test" "$PYTHON_TEST"
          check_result "website-test" "$WEBSITE_TEST"
          check_result "e2e-smoke" "$E2E_SMOKE"
          check_result "swift-test" "$SWIFT_TEST"
          check_result "loopflow-ui-test" "$LOOPFLOW_UI_TEST"

          exit "$failures"
