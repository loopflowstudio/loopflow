name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  scratch-clear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify scratch/ is clear
        run: |
          if [ ! -d scratch ]; then
            echo "scratch/ is missing"
            exit 1
          fi

          EXTRA=$(find scratch -mindepth 1 ! -path 'scratch/.gitkeep' -print)
          if [ -n "$EXTRA" ]; then
            echo "scratch/ must be clear before landing"
            echo "$EXTRA"
            exit 1
          fi

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run cargo fmt check
        run: cargo fmt --all -- --check
      - name: Run cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --all

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Run Python tests
        run: uv run pytest python/tests/

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v4
      - name: Run E2E smoke test
        run: tests/e2e/test_smoke.sh
      - name: Run API smoke test
        run: uv run pytest tests/e2e/test_api_smoke.py tests/e2e/test_concurrent_clients.py -v

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify Docker is available
        run: docker version
      - name: Run Docker executor smoke tests
        run: cargo test -p loopflow docker_ -- --nocapture

  swift-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - name: Run Swift tests
        run: swift test --package-path swift
      - name: Check Swift multiplatform boundaries
        run: uv run python scripts/check_swift_multiplatform_boundaries.py

  concerto-ui-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: swift
      - name: Run Concerto UI tests
        run: |
          python3 -u - <<'PY'
          import json
          import os
          import queue
          import re
          import subprocess
          import sys
          import threading
          import time

          cmd = [
              "xcodebuild",
              "test",
              "-project",
              "LoopflowSwift.xcodeproj",
              "-scheme",
              "Concerto",
              "-destination",
              "platform=macOS",
              "-skip-testing:ConcertoUITests",
              "-resultBundlePath",
              "ConcertoTests.xcresult",
              "CODE_SIGNING_ALLOWED=NO",
              "CODE_SIGNING_REQUIRED=NO",
          ]
          timeout_seconds = 540
          result_bundle_path = "ConcertoTests.xcresult"
          success_summary_pattern = re.compile(
              r"^✔ Test run with \d+ tests in \d+ suites passed after "
          )

          def xcresult_indicates_success(path):
              if not os.path.exists(path):
                  return False, f"missing result bundle at {path}"

              try:
                  raw = subprocess.check_output(
                      [
                          "xcrun",
                          "xcresulttool",
                          "get",
                          "object",
                          "--legacy",
                          "--path",
                          path,
                          "--format",
                          "json",
                      ],
                      text=True,
                  )
              except subprocess.CalledProcessError as exc:
                  return False, f"xcresulttool failed with exit code {exc.returncode}"

              try:
                  payload = json.loads(raw)
              except json.JSONDecodeError as exc:
                  return False, f"xcresult JSON parse failed: {exc}"

              actions = payload.get("actions", {}).get("_values", [])
              if not actions:
                  return False, "xcresult had no actions"

              action_result = actions[0].get("actionResult", {})
              status = action_result.get("status", {}).get("_value")
              tests_count = action_result.get("metrics", {}).get("testsCount", {}).get("_value")

              if status != "succeeded":
                  return False, f"xcresult action status was {status!r}"

              if tests_count in (None, "0", 0):
                  return False, f"xcresult testsCount was {tests_count!r}"

              return True, f"xcresult status={status} testsCount={tests_count}"

          print("Running:", " ".join(cmd), flush=True)
          if os.path.exists(result_bundle_path):
              subprocess.run(["/bin/rm", "-rf", result_bundle_path], check=False)
          process = subprocess.Popen(
              cmd,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              bufsize=1,
          )

          lines = queue.Queue()

          def pump_output() -> None:
              assert process.stdout is not None
              for line in process.stdout:
                  lines.put(line)
              lines.put(None)

          reader = threading.Thread(target=pump_output, daemon=True)
          reader.start()

          deadline = time.monotonic() + timeout_seconds
          saw_eof = False
          saw_success_summary = False

          while True:
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  # Kill xcodebuild first so it releases the result bundle lock,
                  # then check xcresulttool for the authoritative verdict.
                  subprocess.run(
                      ["/bin/ps", "-axo", "pid,ppid,etime,stat,command"],
                      check=False,
                  )
                  process.terminate()
                  try:
                      process.wait(timeout=15)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait()
                  success, reason = xcresult_indicates_success(result_bundle_path)
                  if success:
                      print(
                          f"::warning::xcodebuild exceeded {timeout_seconds}s ({reason})",
                          flush=True,
                      )
                  elif saw_success_summary:
                      reason = "stdout showed final Swift test success summary before hang"
                      print(
                          f"::warning::xcodebuild exceeded {timeout_seconds}s ({reason})",
                          flush=True,
                      )
                  else:
                      print(
                          f"::error::xcodebuild exceeded {timeout_seconds}s ({reason})",
                          flush=True,
                      )
                  if success or saw_success_summary:
                      print(
                          "Timed out after tests completed; accepting successful test output.",
                          flush=True,
                      )
                      sys.exit(0)
                  sys.exit(124)

              try:
                  line = lines.get(timeout=min(1, remaining))
              except queue.Empty:
                  if process.poll() is not None and saw_eof:
                      break
                  continue

              if line is None:
                  saw_eof = True
                  if process.poll() is not None:
                      break
                  continue

              sys.stdout.write(line)
              sys.stdout.flush()
              if success_summary_pattern.match(line):
                  saw_success_summary = True

          sys.exit(process.wait())
          PY
        timeout-minutes: 12
        working-directory: swift

  tests-result:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - scratch-clear
      - rust-test
      - python-test
      - e2e-smoke
      - docker-smoke
      - swift-test
      - concerto-ui-test
    steps:
      - name: Aggregate test results
        env:
          SCRATCH_CLEAR: ${{ needs.scratch-clear.result }}
          RUST_TEST: ${{ needs.rust-test.result }}
          PYTHON_TEST: ${{ needs.python-test.result }}
          E2E_SMOKE: ${{ needs.e2e-smoke.result }}
          DOCKER_SMOKE: ${{ needs.docker-smoke.result }}
          SWIFT_TEST: ${{ needs.swift-test.result }}
          CONCERTO_UI_TEST: ${{ needs.concerto-ui-test.result }}
        run: |
          failures=0

          check_result() {
            local name="$1"
            local result="$2"
            case "$result" in
              success)
                echo "PASS  $name"
                ;;
              skipped)
                echo "SKIP  $name"
                ;;
              *)
                echo "FAIL  $name ($result)"
                failures=1
                ;;
            esac
          }

          check_result "scratch-clear" "$SCRATCH_CLEAR"
          check_result "rust-test" "$RUST_TEST"
          check_result "python-test" "$PYTHON_TEST"
          check_result "e2e-smoke" "$E2E_SMOKE"
          check_result "docker-smoke" "$DOCKER_SMOKE"
          check_result "swift-test" "$SWIFT_TEST"
          check_result "concerto-ui-test" "$CONCERTO_UI_TEST"

          exit "$failures"
