name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run cargo fmt check
        run: cargo fmt --all -- --check
      - name: Run cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --all

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Run Python tests
        run: uv run pytest python/tests/

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v4
      - name: Run E2E smoke test
        run: tests/e2e/test_smoke.sh
      - name: Run API smoke test
        run: uv run pytest tests/e2e/test_api_smoke.py -v

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Docker is available
        run: docker version
      - name: Run Docker executor smoke tests
        run: cargo test -p loopflow docker_ -- --nocapture

  swift-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - name: Run Swift tests
        run: swift test --package-path swift
      - name: Check Swift multiplatform boundaries
        run: uv run python scripts/check_swift_multiplatform_boundaries.py

  concerto-ui-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: swift
      - name: Run Concerto UI tests
        run: xcodebuild test -project LoopflowSwift.xcodeproj -scheme Concerto -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
        working-directory: swift
