name: Clear Scratch

on:
  merge_group:
    branches: [main]

permissions:
  contents: write

jobs:
  clear-scratch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clear scratch if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=$(find scratch -type f ! -name '.gitkeep' 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "scratch/ is already clean"
            exit 0
          fi

          echo "Clearing scratch/..."
          echo "$FILES"

          # Get the PR branch from merge group ref (format: gh-readonly-queue/main/pr-NUM-SHA)
          PR_NUM=$(echo "${{ github.ref }}" | sed -n 's/.*pr-\([0-9]*\).*/\1/p')
          PR_BRANCH=$(gh pr view "$PR_NUM" --json headRefName -q .headRefName)

          echo "Pushing cleanup to PR branch: $PR_BRANCH"

          # Checkout and clean the actual PR branch
          git fetch origin "$PR_BRANCH"
          git checkout "$PR_BRANCH"

          find scratch -type f ! -name '.gitkeep' -delete
          find scratch -type d -empty -delete 2>/dev/null || true
          mkdir -p scratch
          touch scratch/.gitkeep

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scratch/
          git commit -m "chore: clear scratch"
          git push origin "$PR_BRANCH"

          echo "Cleanup pushed - merge queue will restart with clean branch"
