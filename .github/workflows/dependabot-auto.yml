name: Dependabot zero-touch

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_run:
    workflows: ["CI"] # Keep in sync with .github/workflows/ci.yml.
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
          # GITHUB_TOKEN can enable auto-merge but cannot enter a merge queue.
          GH_TOKEN: ${{ secrets.DEPENDABOT_MERGE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Configure DEPENDABOT_MERGE_TOKEN with repository Contents and Pull requests write access."
            exit 1
          fi
          if [ -n "$HEAD_SHA" ]; then
            PR_URL=$(gh pr list --repo "$REPO" --state open --author "app/dependabot" \
              --limit 1000 --json url,headRefOid \
              --jq ".[] | select(.headRefOid == \"$HEAD_SHA\") | .url")
          fi
          if [ -z "$PR_URL" ]; then
            echo "No open Dependabot PR for this CI run."
            exit 0
          fi
          gh pr merge --repo "$REPO" --auto --squash --match-head-commit "$EXPECTED_HEAD" "$PR_URL"
          if [ -n "$HEAD_SHA" ]; then
            PR_ID=$(gh pr view "$PR_URL" --repo "$REPO" --json id --jq .id)
            QUEUED=$(gh api graphql \
              -f query='query($id:ID!){node(id:$id){... on PullRequest{mergeQueueEntry{id}}}}' \
              -f id="$PR_ID" --jq '.data.node.mergeQueueEntry != null')
            if [ "$QUEUED" = false ]; then
              gh api graphql \
                -f query='mutation($id:ID!,$head:GitObjectID!){enqueuePullRequest(input:{pullRequestId:$id,expectedHeadOid:$head}){mergeQueueEntry{position}}}' \
                -f id="$PR_ID" -f head="$EXPECTED_HEAD"
            fi
          fi

  close-on-red:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Close the dependabot PR
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Keep in sync with branch protection required_status_checks on main.
          REQUIRED_CHECKS: "swift-test rust-test e2e-smoke python-test"
        run: |
          set -euo pipefail
          # workflow_run doesn't give us the PR number; match the open PR by head SHA.
          PR=$(gh pr list --repo "$REPO" --state open --author "app/dependabot" \
            --json number,headRefOid \
            --jq ".[] | select(.headRefOid == \"$HEAD_SHA\") | .number")
          if [ -z "$PR" ]; then
            echo "No open dependabot PR at $HEAD_SHA."
            exit 0
          fi

          # Only close when a required check failed. Flakes in non-required
          # jobs (e.g. loopflow-ui-test) must not kill otherwise-good PRs.
          FAILED=$(gh pr view "$PR" --repo "$REPO" --json statusCheckRollup \
            --jq '[.statusCheckRollup[] | select(.conclusion == "FAILURE") | .name] | join(" ")')
          HARD_FAIL=""
          for check in $REQUIRED_CHECKS; do
            case " $FAILED " in
              *" $check "*) HARD_FAIL="$check"; break ;;
            esac
          done
          if [ -z "$HARD_FAIL" ]; then
            echo "No required check failed on PR #$PR (failed: $FAILED). Leaving open."
            exit 0
          fi

          gh pr comment "$PR" --repo "$REPO" \
            --body "Required check \`$HARD_FAIL\` red — abandoning. Dependabot will open a new PR on the next version bump."
          gh pr close "$PR" --repo "$REPO"
