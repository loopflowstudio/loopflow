name: macOS on main

# The queue proves the Linux suite; this proves macOS after merge. One run
# tests main while one waits, and a newer push replaces the waiting run, so
# each run covers every commit since `last-green`. Green advances the tag;
# red leaves it, fails the run and names both commits in the run summary.
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      last-green: ${{ steps.select.outputs.last-green }}
      any: ${{ steps.select.outputs.any }}
      swift-test: ${{ steps.select.outputs.swift-test }}
      macos-process-test: ${{ steps.select.outputs.macos-process-test }}
      loopflow-ui-test: ${{ steps.select.outputs.loopflow-ui-test }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Select the batch since last-green
        id: select
        env:
          SHA: ${{ github.sha }}
        run: |
          last_green=$(git ls-remote origin refs/tags/last-green | cut -f1)
          echo "last-green=$last_green" >> "$GITHUB_OUTPUT"
          uv run python scripts/macos_inputs.py "$last_green" "$SHA"

  macos:
    needs: select
    if: needs.select.outputs.any == 'true'
    uses: ./.github/workflows/macos.yml
    with:
      ref: ${{ github.sha }}
      swift-test: ${{ needs.select.outputs.swift-test == 'true' }}
      macos-process-test: ${{ needs.select.outputs.macos-process-test == 'true' }}
      loopflow-ui-test: ${{ needs.select.outputs.loopflow-ui-test == 'true' }}

  settle:
    needs: [select, macos]
    if: ${{ !cancelled() && needs.select.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Advance last-green, or report the failure
        env:
          RESULT: ${{ needs.macos.result }}
          SHA: ${{ github.sha }}
          LAST_GREEN: ${{ needs.select.outputs.last-green }}
        run: |
          case "$RESULT" in
            success | skipped)
              git push --force origin "$SHA:refs/tags/last-green"
              echo "last-green → ${SHA:0:10}" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "macOS failure on ${SHA:0:10}; last-green stays at ${LAST_GREEN:0:10}." >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
