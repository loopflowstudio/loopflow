name: Packages (nightly)

on:
  schedule:
    # 09:00 UTC daily — before US work hours.
    - cron: "0 9 * * *"
  workflow_dispatch:
  workflow_call:

env:
  LOOPFLOW_BUILD_PROVENANCE: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'development' }}
  LOOPFLOW_MIGRATION_AUTHORITY: ${{ startsWith(github.ref, 'refs/tags/v') && 'published' || 'validation_only' }}

jobs:
  release-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Exercise revoked-token recovery
        run: >-
          cargo test -p loopflow --test agent_tests
          release_acceptance_recovers_from_a_revoked_selected_account -- --exact

  native-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-packages-${{ matrix.target }}
      - name: Build package binaries
        run: >-
          cargo build --release --target ${{ matrix.target }} -p loopflow
          --bin lf --bin lfd
      - name: Package binaries
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          tar czf ../../../lf-${{ matrix.target }}.tar.gz lf lfd
      - name: Smoke test package
        run: |
          set -euo pipefail
          mkdir package-smoke
          tar -xzf lf-${{ matrix.target }}.tar.gz -C package-smoke
          package-smoke/lf --version
          package-smoke/lf --help > /dev/null
          package-smoke/lf --list > /dev/null
          package-smoke/lfd --version
          package-smoke/lfd --help > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.target }}
          path: lf-${{ matrix.target }}.tar.gz
          retention-days: 14
