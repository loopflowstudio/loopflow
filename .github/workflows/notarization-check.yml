name: Notarization check

# Asks Apple for notarization history with the package build's credentials, so
# an expired agreement or a bad key shows up the morning it breaks instead of in
# failed package builds. A red run opens or updates one "Notarization is
# failing" issue; the next green run closes it. Fixes: .github/CI.md,
# "Notarization".
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  notarytool:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Ask Apple for notarization history
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          title="Notarization is failing"
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_KEY" > "$key"
          status=0
          xcrun notarytool history --key "$key" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER" --output-format json \
            > /dev/null 2> "$RUNNER_TEMP/notarytool.err" || status=$?
          rm -f "$key"
          cat "$RUNNER_TEMP/notarytool.err"

          issue=$(gh issue list --state open --limit 200 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)

          if [ "$status" -eq 0 ]; then
            echo "notarytool history succeeded"
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "Notarization works again: $RUN_URL"
            fi
            exit 0
          fi

          {
            echo "\`xcrun notarytool history\` exited $status in $RUN_URL:"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/notarytool.err"
            echo '```'
            echo
            echo "Fixes are in \`.github/CI.md\`, \"Notarization\"."
          } > "$RUNNER_TEMP/body.md"

          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
          exit "$status"
