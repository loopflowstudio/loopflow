name: Package build

on:
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
      # The main commit to package; empty packages the triggering ref.
      revision:
        required: false
        type: string

env:
  LOOPFLOW_BUILD_PROVENANCE: ${{ inputs.release_tag != '' && 'release' || 'development' }}
  LOOPFLOW_RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  release-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Exercise revoked-token recovery
        run: >-
          cargo test -p loopflow --test agent_tests
          release_acceptance_recovers_from_a_revoked_selected_account -- --exact

  native-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      # build.rs orders migrations by origin/main's first-parent history.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: packages-${{ matrix.target }}
      - name: Build package binaries
        run: >-
          cargo build --release --target ${{ matrix.target }} -p loopflow
          --bin lf
      - name: Package binaries
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          tar czf ../../../lf-${{ matrix.target }}.tar.gz lf
          # The reader floors this build knows, so an updater can tell
          # whether it opens a store before downloading it.
          ./lf self install reader-catalog > ../../../reader-catalog.txt
      - name: Smoke test package
        run: |
          set -euo pipefail
          mkdir package-smoke
          tar -xzf lf-${{ matrix.target }}.tar.gz -C package-smoke
          package-smoke/lf --version
          package-smoke/lf --help > /dev/null
          # A fresh runner has no ~/.lf; a temporary home keeps the store disposable.
          LF_HOME="$RUNNER_TEMP/package-smoke-home" package-smoke/lf list > /dev/null
          if [ -n "${LOOPFLOW_RELEASE_TAG}" ]; then
            expected="${LOOPFLOW_RELEASE_TAG##*/}"
            expected="${expected#v}"
            test "$(package-smoke/lf --version)" = "lf ${expected}"
            LF_HOME="$RUNNER_TEMP/release-preflight-${{ matrix.target }}" \
              package-smoke/lf install preflight --json
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: lf-${{ matrix.target }}
          path: |
            lf-${{ matrix.target }}.tar.gz
            reader-catalog.txt
          retention-days: 14
