name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # Verify tag version matches Cargo.toml and pyproject.toml
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract tag version
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Check VERSION
        run: |
          file_version=$(cat VERSION | tr -d '\n')
          if [ "$file_version" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::Tag ${{ steps.tag.outputs.version }} != VERSION $file_version"
            exit 1
          fi
      - name: Check Cargo.toml
        run: |
          cargo_version=$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$cargo_version" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::Tag ${{ steps.tag.outputs.version }} != Cargo.toml $cargo_version"
            exit 1
          fi
      - name: Check pyproject.toml
        run: |
          pyproject_version=$(grep -m1 '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$pyproject_version" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::Tag ${{ steps.tag.outputs.version }} != pyproject.toml $pyproject_version"
            exit 1
          fi

  # Build Python wheels with maturin (packages Rust binary into a wheel)
  build-wheels:
    needs: check-version
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-large
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: auto
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path rust/loopflow-py/Cargo.toml
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  # Publish wheels to PyPI
  publish-pypi:
    needs: build-wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # Build native binaries for cargo-dist (GitHub Releases, shell installer, Homebrew)
  build-native:
    needs: check-version
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-large
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p lf -p lfd
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../lf-${{ matrix.target }}.tar.gz lf lfd
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: lf-*.tar.gz

  # Create GitHub Release with native binaries and wheels
  release:
    needs: [build-wheels, build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/wheels
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: dist/native
      - name: Generate shell installer
        run: |
          cat > dist/install.sh << 'INSTALLER'
          #!/bin/sh
          set -eu

          REPO="loopflowstudio/loopflow"
          INSTALL_DIR="${LF_INSTALL_DIR:-$HOME/.local/bin}"

          detect_target() {
            os=$(uname -s)
            arch=$(uname -m)
            case "$os" in
              Darwin)
                case "$arch" in
                  arm64|aarch64) echo "aarch64-apple-darwin" ;;
                  x86_64) echo "x86_64-apple-darwin" ;;
                  *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
                esac ;;
              Linux)
                case "$arch" in
                  aarch64) echo "aarch64-unknown-linux-gnu" ;;
                  x86_64) echo "x86_64-unknown-linux-gnu" ;;
                  *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
                esac ;;
              *) echo "Unsupported OS: $os" >&2; exit 1 ;;
            esac
          }

          main() {
            target=$(detect_target)
            version="${1:-latest}"

            if [ "$version" = "latest" ]; then
              url="https://github.com/$REPO/releases/latest/download/lf-$target.tar.gz"
            else
              url="https://github.com/$REPO/releases/download/v$version/lf-$target.tar.gz"
            fi

            echo "Installing lf ($target)..."
            mkdir -p "$INSTALL_DIR"
            curl -fsSL "$url" | tar xz -C "$INSTALL_DIR"
            chmod +x "$INSTALL_DIR/lf" "$INSTALL_DIR/lfd"
            echo "Installed to $INSTALL_DIR/lf"

            case ":$PATH:" in
              *":$INSTALL_DIR:"*) ;;
              *) echo "Add to PATH: export PATH=\"$INSTALL_DIR:\$PATH\"" ;;
            esac
          }

          main "$@"
          INSTALLER
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/wheels/*.whl
            dist/native/*.tar.gz
            dist/install.sh
