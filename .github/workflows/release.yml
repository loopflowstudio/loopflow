name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # Build Python wheels with maturin (packages Rust binary into a wheel)
  build-wheels:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: auto
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        run: sed -i.bak 's/^version = "0.0.0"/version = "'"${GITHUB_REF_NAME#v}"'"/' Cargo.toml && rm Cargo.toml.bak
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path rust/loopflow-py/Cargo.toml
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  # Publish wheels to PyPI
  publish-pypi:
    needs: build-wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # Build native binaries (GitHub Releases, shell installer)
  build-native:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        run: sed -i.bak 's/^version = "0.0.0"/version = "'"${GITHUB_REF_NAME#v}"'"/' Cargo.toml && rm Cargo.toml.bak
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p loopflow
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../lf-${{ matrix.target }}.tar.gz lf lfd
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: lf-*.tar.gz

  # Publish to crates.io
  publish-crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        run: sed -i.bak 's/^version = "0.0.0"/version = "'"${GITHUB_REF_NAME#v}"'"/' Cargo.toml && rm Cargo.toml.bak
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        run: cargo publish -p loopflow
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Create GitHub Release with native binaries and wheels
  release:
    needs: [build-wheels, build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/wheels
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: dist/native
      - name: Generate shell installer
        run: |
          cat > dist/install.sh << 'INSTALLER'
          #!/bin/sh
          set -eu

          REPO="loopflowstudio/loopflow"
          INSTALL_DIR="${LF_INSTALL_DIR:-$HOME/.local/bin}"

          detect_target() {
            os=$(uname -s)
            arch=$(uname -m)
            case "$os" in
              Darwin)
                case "$arch" in
                  arm64|aarch64) echo "aarch64-apple-darwin" ;;
                  x86_64) echo "x86_64-apple-darwin" ;;
                  *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
                esac ;;
              Linux)
                case "$arch" in
                  aarch64) echo "aarch64-unknown-linux-gnu" ;;
                  x86_64) echo "x86_64-unknown-linux-gnu" ;;
                  *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
                esac ;;
              *) echo "Unsupported OS: $os" >&2; exit 1 ;;
            esac
          }

          main() {
            target=$(detect_target)
            version="${1:-latest}"

            if [ "$version" = "latest" ]; then
              url="https://github.com/$REPO/releases/latest/download/lf-$target.tar.gz"
            else
              url="https://github.com/$REPO/releases/download/v$version/lf-$target.tar.gz"
            fi

            echo "Installing lf ($target)..."
            mkdir -p "$INSTALL_DIR"
            curl -fsSL "$url" | tar xz -C "$INSTALL_DIR"
            chmod +x "$INSTALL_DIR/lf" "$INSTALL_DIR/lfd"
            echo "Installed to $INSTALL_DIR/lf"

            case ":$PATH:" in
              *":$INSTALL_DIR:"*) ;;
              *) echo "Add to PATH: export PATH=\"$INSTALL_DIR:\$PATH\"" ;;
            esac
          }

          main "$@"
          INSTALLER
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/wheels/*.whl
            dist/native/*.tar.gz
            dist/install.sh
