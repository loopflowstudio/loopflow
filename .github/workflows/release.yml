name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # --- Stage 1: Build (failable work) ---

  build-native:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p loopflow
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../lf-${{ matrix.target }}.tar.gz lf lfd
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: lf-*.tar.gz

  build-dmg:
    needs: [build-native]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Build DMG
        run: python3 scripts/concerto-dev.py release
        working-directory: ${{ github.workspace }}
      - name: Upload DMG to R2
        run: |
          uv run --with boto3 python3 - <<'SCRIPT'
          import boto3, os
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          client = boto3.client(
              "s3",
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
          )
          bucket = "loopflow-downloads"
          dmg = "swift/dist/LoopflowConcerto.dmg"
          for key, cache in [
              (f"LoopflowConcerto-{version}.dmg", "public, max-age=31536000, immutable"),
              ("LoopflowConcerto-latest.dmg", "public, max-age=60"),
          ]:
              client.upload_file(dmg, bucket, key, ExtraArgs={
                  "ContentType": "application/x-apple-diskimage",
                  "CacheControl": cache,
              })
              print(f"Uploaded {key}")
          SCRIPT
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: swift/dist/LoopflowConcerto.dmg

  # --- Stage 2: Publish (all gated on builds) ---

  release:
    needs: [build-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: dist/native
      - uses: actions/download-artifact@v4
        with:
          name: dmg
          path: dist/dmg
      - name: Generate shell installer
        run: |
          cat > dist/install.sh << 'INSTALLER'
          #!/bin/sh
          set -eu

          REPO="loopflowstudio/loopflow"
          DEFAULT_INSTALL_DIR="$HOME/.local/bin"

          resolve_install_dir() {
            if [ -n "${LF_INSTALL_DIR:-}" ]; then
              echo "$LF_INSTALL_DIR"
              return
            fi

            if command -v lf >/dev/null 2>&1; then
              lf_path="$(command -v lf)"
              lf_dir="$(dirname "$lf_path")"
              case "$lf_dir" in
                "$HOME/.lf/bin"|"$HOME/.local/bin")
                  echo "$lf_dir"
                  return
                  ;;
              esac
            fi

            echo "$DEFAULT_INSTALL_DIR"
          }

          detect_target() {
            os=$(uname -s)
            arch=$(uname -m)
            case "$os" in
              Darwin)
                case "$arch" in
                  arm64|aarch64) echo "aarch64-apple-darwin" ;;
                  x86_64) echo "x86_64-apple-darwin" ;;
                  *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
                esac ;;
              Linux)
                case "$arch" in
                  aarch64) echo "aarch64-unknown-linux-gnu" ;;
                  x86_64) echo "x86_64-unknown-linux-gnu" ;;
                  *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
                esac ;;
              *) echo "Unsupported OS: $os" >&2; exit 1 ;;
            esac
          }

          main() {
            target=$(detect_target)
            version="${1:-latest}"
            install_dir="$(resolve_install_dir)"

            if [ "$version" = "latest" ]; then
              url="https://github.com/$REPO/releases/latest/download/lf-$target.tar.gz"
            else
              url="https://github.com/$REPO/releases/download/v$version/lf-$target.tar.gz"
            fi

            echo "Installing lf ($target)..."
            mkdir -p "$install_dir"

            tmpdir="$(mktemp -d)"
            cleanup() {
              rm -rf "$tmpdir"
            }
            trap cleanup EXIT INT TERM

            curl -fsSL "$url" | tar xz -C "$tmpdir"

            for bin in lf lfd; do
              src="$tmpdir/$bin"
              dst="$install_dir/$bin"
              tmp="$install_dir/.${bin}.tmp.$$"
              cp "$src" "$tmp"
              chmod +x "$tmp"
              mv -f "$tmp" "$dst"
            done

            echo "Installed to $install_dir/lf"

            case ":$PATH:" in
              *":$install_dir:"*) ;;
              *) echo "Add to PATH: export PATH=\"$install_dir:\$PATH\"" ;;
            esac
          }

          main "$@"
          INSTALLER
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/native/*.tar.gz
            dist/dmg/*.dmg
            dist/install.sh

  publish-crates:
    needs: [build-dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        run: cargo publish -p loopflow --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-pypi:
    needs: [build-dmg]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
