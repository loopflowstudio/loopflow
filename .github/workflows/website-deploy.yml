name: Website Deploy

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - ".github/workflows/website-deploy.yml"

concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Reject stale or unproven product captures
        working-directory: ${{ github.workspace }}
        run: uv run python scripts/check_website_screens.py

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Fetch secrets
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN_PRD }}
          inject-env-vars: true
          doppler-project: loopflow
          doppler-config: prd

      - name: Materialize docs
        run: |
          rm -rf docs
          mkdir -p docs
          cp ../docs/*.md docs/

      - name: Save current release image
        id: pre-deploy
        run: echo "image=$(flyctl releases --json -a loopflow-website | jq -r '.[0].ImageRef')" >> "$GITHUB_OUTPUT"

      - name: Stage runtime secrets
        run: |
          flyctl secrets set --stage \
            WEBSITE_DB_URL="$WEBSITE_DB_URL" \
            RESEND_API_KEY="$RESEND_API_KEY" \
            FIGMA_TOKEN="$FIGMA_TOKEN" \
            -a loopflow-website

      - name: Deploy
        run: flyctl deploy --config fly.toml --wait-timeout 120

      - name: Smoke test production
        id: smoke
        run: |
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://loopflow.studio/ || true)
            if [ "$status" = "200" ]; then
              echo "Production is healthy"
              exit 0
            fi
            echo "Attempt $i: got status $status, retrying in 5s..."
            sleep 5
          done
          echo "Production failed health check after 10 attempts"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.smoke.outcome == 'failure' && steps.pre-deploy.outputs.image != ''
        run: |
          echo "Rolling back to ${{ steps.pre-deploy.outputs.image }}"
          flyctl deploy --image "${{ steps.pre-deploy.outputs.image }}" -a loopflow-website --wait-timeout 120
