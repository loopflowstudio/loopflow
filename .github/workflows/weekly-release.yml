name: Regression (weekly auto-release)

on:
  schedule:
    # Sundays 12:00 UTC — if new commits landed since the last tag, run the
    # same package verification as the nightly job, then bump, tag, and dispatch
    # the publishing release workflow.
    - cron: "0 12 * * 0"
  workflow_dispatch:

jobs:
  tag-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.tag_check.outputs.skip }}
      last_tag: ${{ steps.tag_check.outputs.last_tag }}
      commit_count: ${{ steps.tag_check.outputs.commit_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Skip if no commits since last tag
        id: tag_check
        run: |
          set -euo pipefail
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$last_tag" ]; then
            echo "no previous tag — proceeding with first auto-release"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "last_tag=" >> "$GITHUB_OUTPUT"
            echo "commit_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          commit_count=$(git rev-list "$last_tag..HEAD" --count)
          echo "last_tag=$last_tag commit_count=$commit_count"
          if [ "$commit_count" -eq 0 ]; then
            echo "no new commits since $last_tag — skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "last_tag=$last_tag" >> "$GITHUB_OUTPUT"
            echo "commit_count=$commit_count" >> "$GITHUB_OUTPUT"
          fi

  package-test:
    needs: tag-check
    if: needs.tag-check.outputs.skip != 'true'
    uses: ./.github/workflows/nightly-packages.yml

  release:
    needs: [tag-check, package-test]
    if: needs.tag-check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - name: Fetch release secrets
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN_PRD }}
          inject-env-vars: true
          doppler-project: loopflow
          doppler-config: prd
      - name: Install lf
        run: |
          set -euo pipefail
          cargo build --release -p loopflow --bin lf
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: Run canonical release flow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: lf op release run patch
