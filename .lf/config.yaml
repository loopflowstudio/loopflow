agent_model: codex
yolo: true
chrome: true

skill_sources:
  - name: superpowers
    prefix: sp
    path: ~/.superpowers
context:
  - docs
  - .design
exclude: "uv.lock"
push: true

summary_tokens: 25000

summaries:
  - path: src/loopflow
    model: claude

pipelines:
  ship:
    tasks:
      - implement
      - rebase
      - polish
      - draft_commit
    pr: true
  submit:
    tasks:
      - polish
      - draft_commit
    pr: true
  ux:
    tasks:
      - ux-research
      - ux-gaps
      - ux-fix
