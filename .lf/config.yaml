# Definitions do not activate jobs. Explicit cron sync installs on the placed Machine.
crons:
- name: telemetry-daily
  command: [--wave, infrastructure, --batch, flow, telemetry-daily]
  schedule: 0 0 9 * * *
- name: release-run
  command: [--wave, infrastructure, --batch, flow, release-run]
  schedule: 0 0 10 * * *
- name: telemetry-daily
  command: [--wave, intelligence, --batch, flow, telemetry-daily]
  schedule: 0 0 8 * * * *
- name: wave/operate
  command: [--wave, product, --batch, flow, wave/operate]
  schedule: 0 0 8 * * * *
exclude:
- uv.lock
planning:
  provider: linear
linear:
  team: 3871bed0-8c95-4077-ab72-728327d615b3
release:
  targets:
    default:
      workflow: .github/workflows/release.yml
      verify:
      - LOOPFLOW_REQUIRE_ORIGIN_MAIN=1 uv run python scripts/check_migrations.py
      prepare:
      # Release cuts belong here; local migration proof uses an isolated source
      # snapshot. See TESTING.md for shared-checkout and Git-fixture limits.
      - uv run python scripts/canonicalize_migrations.py {version} --release-cut
      completion: github-release
      publisher:
      - loopflow-release-publisher
      - uv
      - run
      - python
      - '{repo}/scripts/publish_release.py'
