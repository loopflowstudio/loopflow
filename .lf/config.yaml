agent_model: claude:opus
yolo: true
context:
  - docs
  - .design
exclude: "uv.lock"
push: true

summaries:
  - path: src/loopflow
    tokens: 16000
    model: gemini

pipelines:
  ship:
    tasks:
      - implement
      - rebase
      - polish
      - draft_commit
    pr: true
  submit:
    tasks:
      - polish
      - draft_commit
    pr: true
