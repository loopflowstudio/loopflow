agent_model: claude:opus
yolo: true
context: "docs"
exclude: "uv.lock"
include_tests_for:
  - polish
  - implement
  - publish
push: true

pipelines:
  ship:
    tasks:
      - implement
      - rebase
      - polish
      - draft_commit
    pr: true
  submit:
    tasks:
      - polish
      - draft_commit
    pr: true
