agent_model: claude:opus
yolo: true
context:
  - docs
  - .design
exclude: "uv.lock"
push: true

summaries:
  - path: src/loopflow
    tokens: 30000
    model: claude:sonnet

pipelines:
  ship:
    tasks:
      - implement
      - rebase
      - polish
      - draft_commit
    pr: true
  submit:
    tasks:
      - polish
      - draft_commit
    pr: true
  ux:
    tasks:
      - ux-research
      - ux-gaps
      - ux-fix
