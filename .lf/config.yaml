agent_model: claude:opus 
yolo: true 
chrome: true

skill_sources:
  - name: superpowers
    prefix: sp
    path: ~/.superpowers
context:
  - docs
  - .design
ignore: "uv.lock"
push: true

summary_tokens: 25000

summaries:
  - path: src/loopflow
    model: claude

flows:
  ship:
    steps:
      - implement
      - rebase
      - polish
      - draft_commit
    pr: true
  submit:
    steps:
      - polish
      - draft_commit
    pr: true
  ux:
    steps:
      - ux-research
      - ux-gaps
      - ux-fix
