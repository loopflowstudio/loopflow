exclude:
- uv.lock
planning:
  provider: linear
linear:
  team: 3871bed0-8c95-4077-ab72-728327d615b3
release:
  targets:
    default:
      workflow: .github/workflows/release.yml
      verify:
      - LOOPFLOW_REQUIRE_ORIGIN_MAIN=1 uv run python scripts/check_migrations.py
      prepare:
      - uv run python scripts/check_migrations.py --write-package-order
      - uv run python scripts/third_party.py refresh
      completion: github-release
      publisher:
      - loopflow-release-publisher
      - uv
      - run
      - python
      - '{repo}/scripts/publish_release.py'
diff_groups:
- title: Docs
  paths: ['*.md', '*.mdx', '*.rst', '*.txt', '*.adoc', /docs/]
- title: Data model
  paths: [rust/loopflow-model/, rust/loopflow-storage/, tests/fixtures/dto/, /migrations/, '*.sql', schema, /models/, '*.proto', dto]
- rest: Everything else
- title: Tests
  paths: [/test/, tests/, /__tests__/, /spec/, /fixtures/, /test_, _test., .test., .spec., tests.]
- title: Generated and lock files
  paths: ['*.lock', '*.snap', '*.pbxproj', -lock.json, .lock.json, .min., /generated/, /__generated__/, /__snapshots__/, /vendor/, tests/goldens/]
