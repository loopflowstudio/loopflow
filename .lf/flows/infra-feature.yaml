# Infrastructure delivery review explains behavior through the PR's source.
- flow: task-design
- step:
    id: implement
    name: implement
- compress
- flow: refresh
- step:
    id: decide
    name: loop-decide
    repeat:
      from: implement
- pr-publish
- step:
    id: review_delivery
    name: pr-review
    human: true
- step:
    id: decide_delivery
    name: loop-decide
    repeat:
      from: implement
- flow: queue
- cmd: task pr land -c
