# Concerto UX research loop. Each run = one iteration that keeps *learning* how
# Concerto's UI should work by simulating personas using the app.
#
#   propose  → pick ONE target behavior + the questions to answer about it
#   generate → prototype ≥3 genuinely-distinct design candidates for it
#   evaluate → simulate each persona × each candidate, record concrete verdicts
#   learn    → fold results into the accumulating questions / guidelines / backlog
#
# Run:  lf ux-research
# Outputs accumulate under scratch/ux-research/ (personas + questions +
# design-guidelines are durable; each pass drops a loop-NN/ folder).
- ux-research/propose
- ux-research/generate
- ux-research/evaluate
- ux-research/learn
