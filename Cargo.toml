[workspace]
resolver = "2"
members = [
  "rust/loopflow",
  "rust/loopflow-test-support",
]

[workspace.package]
version = "0.12.16"
edition = "2021"
license = "MIT"

# Agent worktrees are short-lived and usually build once. Full debug metadata
# plus incremental state was costing 11–17 GiB per checkout while the binaries
# themselves stayed below 200 MiB.
[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false

# Install selection authenticates copied binaries by digest. Keep that startup
# check fast in local debug and test builds too.
[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3

[workspace.metadata.dist]
cargo-dist-version = "0.27.0"
ci = "github"
installers = ["shell", "homebrew"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
install-path = "~/.local/bin"
