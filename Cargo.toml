[workspace]
resolver = "2"
members = [
  "rust/loopflow-engine",
  "rust/loopflow-ops",
  "rust/lf",
  "rust/lfd",
]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "MIT"

[workspace.metadata.dist]
cargo-dist-version = "0.27.0"
ci = "github"
installers = ["shell", "homebrew"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
install-path = "~/.loopflow/bin"
