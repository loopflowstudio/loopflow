[workspace]
resolver = "2"
members = [
  "rust/loopflow",
  "rust/loopflow-test-support",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"

[workspace.metadata.dist]
cargo-dist-version = "0.27.0"
ci = "github"
installers = ["shell", "homebrew"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
install-path = "~/.local/bin"
