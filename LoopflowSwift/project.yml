name: Maestro
options:
  bundleIdPrefix: com.loopflow
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector.git
    from: 0.10.0

targets:
  Maestro:
    type: application
    platform: macOS
    sources:
      - path: Maestro
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: Maestro/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.loopflow.maestro
        CODE_SIGN_STYLE: Automatic

  MaestroTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MaestroTests
    dependencies:
      - target: Maestro
      - package: ViewInspector
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Maestro.app/Contents/MacOS/Maestro

  MaestroUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: MaestroUITests
    dependencies:
      - target: Maestro
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Maestro
