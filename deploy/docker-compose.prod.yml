# Legacy production override for remote deployment.
# Usage: docker compose -f docker/docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
#
# Adds Caddy for TLS termination on top of the self-hosted container stack.
# Container mode and postgres-backed hosting are staging debt scheduled for the
# M2 substrate cut; prefer native lfd plus SSH-first operations.

services:
  caddy:
    image: caddy:2-alpine
    environment:
      LF_DOMAIN: "${LF_DOMAIN:-localhost}"
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ${CADDYFILE:-../deploy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      lfd:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy-data:
