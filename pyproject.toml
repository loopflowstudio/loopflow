[project]
name = "loopflow"
version = "0.12.10"
description = "Run LLM coding agents from reusable prompt files"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Jack" }]
keywords = [
    "llm", "claude", "codex", "gemini", "ai", "coding", "cli",
    "agents", "automation", "workflow", "prompts"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Software Development",
]
dependencies = ["typer>=0.9", "pyyaml>=6.0"]

[dependency-groups]
dev = ["boto3", "pytest>=8.0", "ruff>=0.8"]

[project.urls]
Homepage = "https://loopflow.studio/"
Repository = "https://github.com/loopflowstudio/loopflow"
Documentation = "https://loopflow.studio/docs"
Issues = "https://github.com/loopflowstudio/loopflow/issues"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["docker: tests requiring Docker and Claude credentials"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
