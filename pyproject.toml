[project]
name = "loopflow"
version = "0.9.4"
description = "Run LLM coding agents from reusable prompt files"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Jack" }]
keywords = [
    "llm", "claude", "codex", "gemini", "ai", "coding", "cli",
    "agents", "automation", "workflow", "prompts"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Software Development",
]
dependencies = ["httpx>=0.27", "pydantic>=2.0", "typer>=0.9", "rich>=14.0"]

[dependency-groups]
dev = ["boto3", "pyyaml>=6.0", "hatchling", "pytest>=8.0", "websockets>=13.0"]

[project.urls]
Homepage = "https://loopflowstudio.github.io/loopflow/"
Repository = "https://github.com/loopflowstudio/loopflow"
Documentation = "https://loopflowstudio.github.io/loopflow/"
Issues = "https://github.com/loopflowstudio/loopflow/issues"

[project.scripts]
lfq = "loopflow.cli:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["python/loopflow"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "e2e: end-to-end tests requiring lfd",
    "docker: tests requiring Docker and Claude credentials",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
