[project]
name = "loopflow"
version = "0.8.0"
description = "Run LLM coding agents from reusable prompt files"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Jack" }]
keywords = [
    "llm", "claude", "codex", "gemini", "ai", "coding", "cli",
    "agents", "automation", "workflow", "prompts"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Software Development",
]
dependencies = []

[dependency-groups]
dev = ["boto3", "maturin>=1.4,<2.0", "pyyaml>=6.0", "typer>=0.9"]

[project.urls]
Homepage = "https://loopflowstudio.github.io/loopflow/"
Repository = "https://github.com/loopflowstudio/loopflow"
Documentation = "https://loopflowstudio.github.io/loopflow/"
Issues = "https://github.com/loopflowstudio/loopflow/issues"

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
manifest-path = "rust/loopflow-py/Cargo.toml"
strip = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
