services:
  postgres:
    image: postgres:16
    ports:
      - "${LFD_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_USER: postgres
      POSTGRES_DB: lfd
    volumes:
      - lfd-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
  lfd:
    build:
      context: ../..
      dockerfile: rust/lfd/Dockerfile
    environment:
      LFD_STORAGE: postgres
      LFD_DATABASE_URL: postgres://postgres:test@postgres:5432/lfd
      LFD_GRPC_ADDR: 0.0.0.0:50051
      LFD_HTTP_ADDR: 0.0.0.0:8080
    ports:
      - "${LFD_GRPC_PORT:-50051}:50051"
      - "${LFD_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  lfd-postgres-data:
