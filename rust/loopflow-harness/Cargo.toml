[package]
name = "loopflow-harness"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Lets execution's fixtures replay the recorded streams under `src/testdata/`
# and read the saved conversations under `src/transcript/testdata/`.
test-support = []

[dependencies]
loopflow-model = { path = "../loopflow-model" }
anyhow = "1"
dirs = "7"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27"
