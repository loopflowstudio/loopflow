[package]
name = "loopflow-storage"
links = "loopflow_storage"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-support = []

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
loopflow-model = { path = "../loopflow-model" }
dirs = "7"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
schemars = "1.2"
tracing = "0.1"
thiserror = "2.0"
uuid = { version = "1", features = ["v4", "v5"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
aes-gcm = "0.10"
base64 = "0.23"
libc = "0.2"
rusqlite = { version = "0.40", features = ["backup", "bundled", "hooks", "trace"] }
fs2 = "0.4"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tempfile = "3.27"

[dev-dependencies]
ctor = "1.0.13"
loopflow-test-support = { path = "../loopflow-test-support" }

[build-dependencies]
sha2 = "0.10"
rusqlite = { version = "0.40", features = ["backup", "bundled", "hooks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
