[package]
name = "loopflow"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Run steps and flows with coding agents"
repository = "https://github.com/loopflowstudio/loopflow"
keywords = ["ai", "llm", "agent", "workflow", "automation"]
categories = ["development-tools", "command-line-utilities"]

[lib]
crate-type = ["rlib"]

[[bin]]
name = "lf"
path = "src/bin/lf.rs"

[[bin]]
name = "lfd"
path = "src/bin/lfd.rs"

[[bin]]
name = "lf-prompt"
path = "src/bin/lf-prompt.rs"

[[bin]]
name = "lf-agent"
path = "src/bin/lf-agent.rs"

# --- Dependencies from loopflow-engine ---
[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5"
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
thiserror = "1.0"
tiktoken-rs = "0.6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rand = "0.8"
once_cell = "1"

# --- Dependencies from loopflow-ops ---
sha2 = "0.10"
hex = "0.4"

# --- Dependencies from lf ---
anyhow = "1"
atty = "0.2"
ctrlc = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- Dependencies from lfd ---
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
bytes = "1"
bollard = "0.17"
cron = "0.12"
deadpool-postgres = "0.12"
futures-util = "0.3"
gethostname = "0.4"
git2 = "0.18"
portable-pty = "0.8"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.5", features = ["trace"] }

[dev-dependencies]
tempfile = "3.9"
loopflow-test-support = { path = "../loopflow-test-support" }
