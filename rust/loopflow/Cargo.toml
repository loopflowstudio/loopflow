[package]
name = "loopflow"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Run steps and graphs with coding agents"
repository = "https://github.com/loopflowstudio/loopflow"
keywords = ["ai", "llm", "agent", "workflow", "automation"]
categories = ["development-tools", "command-line-utilities"]

[lib]
crate-type = ["rlib"]

[[bin]]
name = "lf"
path = "src/bin/lf.rs"

[[bin]]
name = "lf-prompt"
path = "src/bin/lf-prompt.rs"

[[bin]]
name = "lf-world"
path = "src/bin/lf-world.rs"

# Keep dedicated proof entrypoints and process-global environment fixtures separate.
[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "agent_tests"
path = "tests/agent_tests.rs"

[[test]]
name = "codex_live_smoke"
path = "tests/codex_live_smoke.rs"

[[test]]
name = "global_commands"
path = "tests/global_commands.rs"

[[test]]
name = "one_machine_tests"
path = "tests/one_machine_tests.rs"

[[test]]
name = "planning_reconnect_tests"
path = "tests/planning_reconnect_tests.rs"

[[test]]
name = "process_ownership_tests"
path = "tests/process_ownership_tests.rs"

[[test]]
name = "session_lifecycle_tests"
path = "tests/session_lifecycle_tests.rs"

[[test]]
name = "discovery_tests"
path = "tests/discovery_tests.rs"

[[test]]
name = "two_people"
path = "tests/two_people.rs"

[[test]]
name = "golden_prompt"
path = "tests/golden_prompt.rs"

[[test]]
name = "release_tests"
path = "tests/release_tests.rs"

[[test]]
name = "task_pr_authority_tests"
path = "tests/task_pr_authority_tests.rs"

[[test]]
name = "task_pr_range_tests"
path = "tests/task_pr_range_tests.rs"

[[test]]
name = "task_remote_tests"
path = "tests/task_remote_tests.rs"

[[test]]
name = "test_environment_tests"
path = "tests/test_environment_tests.rs"

[[test]]
name = "session_launch_contract"
path = "tests/session_launch_contract.rs"

# --- Core dependencies ---
[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "7"
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2"
shlex = "2.0"
serde_urlencoded = "0.7"
serde_yaml_ng = "0.10"
tracing = "0.1"
thiserror = "2.0"
tiktoken-rs = "0.12"
fancy-regex = "0.20"
uuid = { version = "1", features = ["v4", "v5"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
rand = "0.10"
once_cell = "1"
regex = "1"
rpassword = "7"

# --- Dependencies from loopflow-ops ---
sha2 = "0.10"
hex = "0.4"
secrecy = { version = "0.8", features = ["serde"] }
subtle = "2"

# --- Dependencies from lf ---
anyhow = "1"
# `termination` extends the handler to SIGTERM and SIGHUP: `tmux kill-session`
# delivers SIGHUP, which must run the same cleanups as Ctrl-C (endpoint removal,
# registry deregistration, child kills) instead of orphaning them.
ctrlc = { version = "3", features = ["termination"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- Runtime dependencies ---
async-trait = "0.1"
aes-gcm = "0.10"
base64 = "0.23"
bytes = "1"
futures-util = "0.3"
gethostname = "1.1"
ipnet = "2"
libc = "0.2"
reqwest = { version = "0.13", features = ["blocking", "json", "stream"] }
rusqlite = { version = "0.40", features = ["backup", "bundled", "hooks", "trace"] }
fs2 = "0.4"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = "0.30"
tempfile = "3.27"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
vt100 = "0.16"
vte = "0.15"

# ARM file-selection latency includes hashing the executable for install authority.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
axum = "0.8"
ctor = "1.0.13"
loopflow-test-support = { path = "../loopflow-test-support" }
tokio = { version = "1", features = ["test-util"] }

[build-dependencies]
cc = "1"
rusqlite = { version = "0.40", features = ["backup", "bundled", "hooks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[test]]
name = "transport_tests"
path = "tests/transport_tests.rs"
