# Move one number: measure, plan, change, keep or revert, until no clear way
# forward remains. Leaves the result on the branch for the caller to deliver.
- step: {name: measure, id: baseline}
- step: {name: optimize-plan, id: first-plan}
- step: {name: implement, id: climb}
- step: {name: measure, id: compare}
- loop: climb
  step: optimize-plan
- compress
- graph: refresh
- step: {name: measure, id: final}
