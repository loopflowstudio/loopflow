<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOO-627 New Task prototypes</title>
<style>
:root {
  --bg: #f4f3f0; --win: #ffffff; --side: #f0efeb; --line: #dedcd6; --ink: #1d1c1a;
  --mute: #75726b; --faint: #a9a59c; --accent: #3b5bdb; --accent-ink: #fff;
  --run: #2f9e44; --you: #d9480f; --chip: #ebe9e4; --code: #1d1c1a; --code-ink: #e9e6df;
  --shadow: 0 20px 60px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#161615; --win:#1f1f1d; --side:#1a1a19; --line:#33322f; --ink:#ecebe7;
    --mute:#9b978e; --faint:#666359; --accent:#6d8cff; --accent-ink:#0d0d0c; --run:#51cf66;
    --you:#ff8a4c; --chip:#2a2a27; --code:#0f0f0e; --code-ink:#e9e6df;
    --shadow: 0 20px 60px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.4); }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
code, .mono { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 12.5px; }
header.page { max-width: 1180px; margin: 0 auto; padding: 28px 20px 8px; }
header.page h1 { margin: 0 0 4px; font-size: 20px; }
header.page p { margin: 0; color: var(--mute); max-width: 760px; }
nav.tabs { max-width: 1180px; margin: 16px auto 0; padding: 0 20px; display: flex; gap: 8px; flex-wrap: wrap; }
nav.tabs button { border: 1px solid var(--line); background: var(--win); color: var(--ink);
  padding: 8px 14px; border-radius: 8px; cursor: pointer; font: inherit; text-align: left; }
nav.tabs button b { display: block; }
nav.tabs button span { color: var(--mute); font-size: 12px; }
nav.tabs button[aria-selected=true] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
main { max-width: 1180px; margin: 0 auto; padding: 16px 20px 60px; }
.pitch { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 14px; }
.pitch div { color: var(--mute); }
.pitch b { color: var(--ink); }
@media (max-width: 760px) { .pitch { grid-template-columns: 1fr; } }

/* window */
.win { background: var(--win); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  overflow: hidden; position: relative; height: 620px; display: grid; grid-template-columns: 240px 1fr; }
.win .titlebar { position: absolute; top: 0; left: 0; right: 0; height: 38px; display: flex; align-items: center;
  gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--side); z-index: 2; }
.dots i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; background: var(--line); }
.titlebar .hint { margin-left: auto; color: var(--faint); font-size: 12px; }
aside.side { background: var(--side); border-right: 1px solid var(--line); padding: 50px 10px 10px; overflow: auto; }
.side h4 { margin: 14px 8px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
.side .item { padding: 6px 8px; border-radius: 6px; display: flex; gap: 8px; align-items: center; cursor: default; }
.side .item small { color: var(--faint); margin-left: auto; font-size: 11px; }
.side .item.sel { background: var(--chip); }
.side .new { color: var(--accent); cursor: pointer; font-weight: 500; }
.side .new:hover { background: var(--chip); }
.side .new kbd { margin-left: auto; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.run { background: var(--run); animation: pulse 1.4s infinite; }
.dot.you { background: var(--you); }
@keyframes pulse { 50% { opacity: .35; } }
kbd { font: 11px/1 -apple-system, sans-serif; color: var(--mute); border: 1px solid var(--line);
  border-radius: 4px; padding: 2px 5px; background: var(--win); }
section.pane { padding: 38px 0 0; display: flex; flex-direction: column; min-width: 0; position: relative; }
.empty { margin: auto; text-align: center; color: var(--mute); }
.empty .big { font-size: 15px; color: var(--ink); margin-bottom: 6px; }

/* conversation */
.taskhead { padding: 12px 20px 10px; border-bottom: 1px solid var(--line); }
.taskhead .t { font-weight: 600; }
.taskhead .t small { color: var(--faint); font-weight: 400; margin-left: 6px; }
.rail { display: flex; align-items: center; gap: 0; margin-top: 10px; flex-wrap: wrap; row-gap: 6px; }
.stage { display: flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px;
  border: 1px solid var(--line); color: var(--mute); white-space: nowrap; }
.stage.you { border-color: var(--you); color: var(--you); }
.stage.now { border-color: var(--run); color: var(--run); }
.stage.done { color: var(--faint); text-decoration: line-through; }
.edge { width: 18px; height: 1px; background: var(--line); }
.msgs { flex: 1; overflow: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 640px; }
.msg .who { font-size: 11px; color: var(--faint); margin-bottom: 3px; }
.msg.me .body { background: var(--chip); padding: 9px 12px; border-radius: 10px; }
.msg.agent .body p { margin: 0 0 6px; }
.bg { border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; color: var(--mute);
  display: flex; gap: 8px; align-items: center; }
.composer { border-top: 1px solid var(--line); padding: 10px 14px; }
.composer textarea { width: 100%; resize: none; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px;
  font: inherit; background: var(--win); color: var(--ink); min-height: 40px; }
.composer textarea:focus, .sheet textarea:focus, .palette input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

/* controls */
.btn { border: 0; background: var(--accent); color: var(--accent-ink); padding: 7px 14px; border-radius: 7px;
  font: inherit; font-weight: 500; cursor: pointer; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.ghost { background: transparent; color: var(--mute); border: 1px solid var(--line); }
select { font: inherit; color: var(--ink); background: var(--win); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--chip); border-radius: 999px; padding: 2px 9px;
  font-size: 12px; color: var(--ink); border: 0; font-family: inherit; cursor: pointer; }
.chip.sel { background: var(--accent); color: var(--accent-ink); }
.muted { color: var(--mute); }
.stops { font-size: 12.5px; color: var(--mute); }
.stops b { color: var(--you); font-weight: 500; }

/* A: sheet */
.scrim { position: absolute; inset: 38px 0 0 0; background: rgba(0,0,0,.25); display: none; z-index: 3; }
.sheet { position: absolute; top: 38px; left: 50%; transform: translateX(-50%); width: min(520px, 92%); z-index: 4;
  background: var(--win); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 12px 12px; box-shadow: var(--shadow);
  padding: 18px; display: none; }
.sheet h3 { margin: 0 0 10px; font-size: 15px; }
.sheet textarea { width: 100%; min-height: 90px; resize: vertical; border: 1px solid var(--line); border-radius: 8px;
  padding: 10px; font: inherit; background: var(--win); color: var(--ink); }
.sheet .row { display: grid; grid-template-columns: 80px 1fr; gap: 8px; align-items: center; margin-top: 10px; }
.sheet .row label { color: var(--mute); font-size: 13px; }
.sheet .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; align-items: center; }
.sheet .foot .muted { margin-right: auto; font-size: 12px; }

/* B: talk-first */
.draftbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--mute); margin-bottom: 8px; }
.draftbar .sep { color: var(--faint); }
.welcome { margin: auto; max-width: 460px; text-align: center; padding: 20px; }
.welcome h2 { font-size: 20px; margin: 0 0 6px; font-weight: 600; }
.welcome p { color: var(--mute); margin: 0; }
.wfcards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; text-align: left; }
.wfcard { border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; cursor: pointer; background: var(--win); color: var(--ink); font: inherit; text-align: left; }
.wfcard b { display: block; font-size: 13px; }
.wfcard span { font-size: 11.5px; color: var(--mute); }
.wfcard.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

/* C: palette */
.palette { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); width: min(640px, 94%); z-index: 4;
  background: var(--win); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); display: none; overflow: hidden; }
.palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; font: inherit; font-size: 16px;
  background: var(--win); color: var(--ink); }
.palette .body { padding: 12px 16px; }
.palette .path { display: flex; align-items: center; flex-wrap: wrap; row-gap: 6px; margin: 4px 0 12px; }
.palette .cmd { background: var(--code); color: var(--code-ink); border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: pre; }
.palette .keys { display: flex; gap: 14px; color: var(--mute); font-size: 12px; margin-top: 10px; flex-wrap: wrap; }
.term { background: var(--code); color: var(--code-ink); border-radius: 10px; padding: 14px 16px; margin-top: 16px; white-space: pre-wrap; }
.term .p { color: #8ce99a; }
.term .d { color: #a9a59c; }

.notes { margin-top: 18px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.notes div { background: var(--win); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.notes h5 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); }
.notes ul { margin: 0; padding-left: 18px; }
@media (max-width: 760px) {
  .win { grid-template-columns: 1fr; height: 680px; }
  aside.side { display: none; }
  .notes, .wfcards { grid-template-columns: 1fr; }
}
.reset { margin-top: 10px; }
</style>
</head>
<body>
<header class="page">
  <h1>LOO-627 · New Task: three prototypes</h1>
  <p>Each one is clickable. Type a request, start it, and see where you end up: the Task's conversation with your words as the first turn and its workflow already running. The terminal line underneath each one does the same thing.</p>
</header>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="a" aria-selected="true"><b>A · The sheet</b><span>⌘N, fill in a form, Create</span></button>
  <button role="tab" data-tab="b" aria-selected="false"><b>B · Just start talking</b><span>a new conversation is the form</span></button>
  <button role="tab" data-tab="c" aria-selected="false"><b>C · One line</b><span>palette that mirrors the command</span></button>
</nav>
<main id="stage"></main>

<script>
const WF = {
  code: { blurb: "build, then you try it", stages: [["pursue"], ["demo","you"], ["deliver"], ["verify","you"]], first: "pursue" },
  auto: { blurb: "straight to a merged PR", stages: [["pursue"], ["deliver"], ["merged"]], first: "pursue" },
  feature: { blurb: "pick a direction first", stages: [["kickoff"], ["explore","you"], ["pursue"], ["demo","you"], ["deliver"], ["verify","you"]], first: "kickoff" },
};
const DEFAULT_WF = "code";
const WAVES = ["product", "systems", "quality"];
let nextId = 628;

function stopsLine(wf) {
  const you = WF[wf].stages.filter(s => s[1] === "you").map(s => s[0]);
  return you.length ? `stops for you at <b>${you.join(", ")}</b>` : `runs to a merged PR <b style="color:var(--run)">without stopping</b>`;
}
function rail(wf, nowIdx = 0) {
  return WF[wf].stages.map((s, i) => {
    const cls = ["stage", s[1] === "you" ? "you" : "", i === nowIdx ? "now" : "", i < nowIdx ? "done" : ""].join(" ");
    const icon = i === nowIdx ? '<span class="dot run"></span>' : s[1] === "you" ? "◉" : "";
    return (i ? '<span class="edge"></span>' : "") + `<span class="${cls}">${icon}${s[0]}${s[1] === "you" ? " · you" : ""}</span>`;
  }).join("");
}
function titleOf(req) { const l = req.trim().split("\n")[0]; return l.length > 60 ? l.slice(0, 57) + "…" : l; }
function esc(s) { return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
function cliFor(req, wave, wf) {
  const q = req.trim() ? req.trim().split("\n")[0].replace(/"/g, '\\"') : "…";
  return `lf task create "${q}" --run` + (wave === "repository" ? " --no-wave" : "") + (wf !== DEFAULT_WF ? ` --graph ${wf}` : "");
}

function sidebar(ns, tasks, sel) {
  const rows = tasks.map(t => `<div class="item ${t.id === sel ? "sel" : ""}"><span class="dot run"></span>${esc(titleOf(t.req)).slice(0, 26)}<small>LOO-${t.id}</small></div>`).join("");
  return `<aside class="side">
    <h4>Wave · product</h4>
    <div class="item new" data-new="${ns}">＋ New Task <kbd>⌘N</kbd></div>
    ${rows}
    <div class="item"><span class="dot you"></span>Desktop sidebar density<small>LOO-594</small></div>
    <div class="item"><span class="dot"></span>Wave defaults<small>LOO-625</small></div>
    <div class="item"><span class="dot"></span>Resume a Task<small>LOO-618</small></div>
    <h4>Waves</h4>
    <div class="item">product</div><div class="item">systems</div><div class="item">quality</div>
  </aside>`;
}

function conversation(t) {
  const wf = WF[t.wf];
  const you = wf.stages.filter(s => s[1] === "you").map(s => s[0]);
  const stopSentence = you.length ? `It will stop for you at <b>${you[0]}</b>, here in this conversation.` : `Nothing in <code>auto</code> needs you; it ends with the PR merged. You can watch here or close this.`;
  return `<div class="taskhead">
      <div class="t">${esc(titleOf(t.req))}<small>LOO-${t.id} · ${t.wave === "repository" ? "loopflow" : "Wave " + t.wave} · workflow ${t.wf}</small></div>
      <div class="rail">${rail(t.wf)}</div>
    </div>
    <div class="msgs">
      <div class="msg me"><div class="who">You</div><div class="body">${esc(t.req).replace(/\n/g, "<br>")}</div></div>
      <div class="bg"><span class="dot run"></span><span>Graph <b>${t.wf}</b> is running <code>${wf.first}</code> in the background · worktree <code>loopflow.loo-${t.id}</code></span></div>
      <div class="msg agent"><div class="who">Claude</div><div class="body">
        <p>Filed as LOO-${t.id}. <code>${wf.first}</code> is working on it now in the Task's worktree. I'm not editing alongside it.</p>
        <p>${stopSentence}</p>
        <p class="muted">Ask me anything about it while it runs, or change direction and I'll record it in the brief.</p>
      </div></div>
    </div>
    <div class="composer"><textarea rows="1" placeholder="Talk about LOO-${t.id}…"></textarea></div>`;
}

const notes = {
  a: { feel: ["Clear and deliberate: you see every choice before anything runs.", "Closest to the kickoff design; least new UI vocabulary."],
       cost: ["A modal between you and the conversation: one more surface to learn.", "The form looks like a ticket tracker, so people may write a ticket instead of saying what they want."],
       cli: "One command, <code>lf task create \"…\" --run</code>. The sheet's fields map 1:1 to its flags." },
  b: { feel: ["No form at all: New Task is an empty conversation, and your first message files it.", "Teaches the core idea (a Task is a conversation) from the first click."],
       cost: ["The workflow choice is easy to miss: it's a small bar above the composer.", "Starting a conversation you didn't mean to file needs a way out (discard before sending)."],
       cli: "<code>lf task create --run</code> with no request opens the empty conversation in the terminal; your first message becomes the Task." },
  c: { feel: ["Fastest for repeat use: ⌘N, type, Tab to change workflow, Return.", "The equivalent command is printed live, so Desktop visibly adds no private path."],
       cost: ["Keyboard-first; the least discoverable for someone's first Task.", "Long requests feel cramped in one line (Shift-Return grows it)."],
       cli: "The palette <i>is</i> the command: whatever it shows is what runs." },
};
function noteBlock(k) {
  const n = notes[k];
  return `<div class="notes">
    <div><h5>What it feels like</h5><ul>${n.feel.map(x => `<li>${x}</li>`).join("")}</ul></div>
    <div><h5>What it costs</h5><ul>${n.cost.map(x => `<li>${x}</li>`).join("")}</ul></div>
    <div><h5>Terminal</h5><p style="margin:0">${n.cli}</p></div>
  </div>`;
}
function terminal(req, wave, wf, id) {
  const cmd = cliFor(req || "lf task status prints the graph name on its first line", wave, wf);
  return `<div class="term mono"><span class="p">~/src/loopflow $</span> ${esc(cmd)}
<span class="d">${esc(titleOf(req || "lf task status prints the graph name on its first line"))} · LOO-${id}
Graph ${wf}: running ${WF[wf].first} · ${stopsLine(wf).replace(/<[^>]+>/g, "")}
Opening the conversation…</span></div>`;
}

/* ---------- A: sheet ---------- */
function renderA(s) {
  const t = s.task;
  return `<div class="pitch"><div><b>Sheet.</b> ⌘N or the New Task row drops a sheet: your words, the Wave, the workflow and where it will stop for you. Create closes it and opens the conversation.</div><div>Try: click <b>＋ New Task</b>, type something, change Workflow to <code>auto</code>, press Create (or ⌘↩).</div></div>
  <div class="win">
    <div class="titlebar"><span class="dots"><i></i><i></i><i></i></span><span class="hint">Loopflow — loopflow</span></div>
    ${sidebar("a", t ? [t] : [], t && t.id)}
    <section class="pane">${t ? conversation(t) : `<div class="empty"><div class="big">No Task selected</div>Press ⌘N to start one.</div>`}</section>
    <div class="scrim" id="a-scrim"></div>
    <div class="sheet" id="a-sheet">
      <h3>New Task</h3>
      <textarea id="a-req" placeholder="What do you want? Say it the way you'd say it to a teammate."></textarea>
      <div class="row"><label>Wave</label><select id="a-wave">${["repository", ...WAVES].map(w => `<option ${w === "product" ? "selected" : ""} value="${w}">${w === "repository" ? "No Wave (loopflow)" : w}</option>`).join("")}</select></div>
      <div class="row"><label>Workflow</label><div><select id="a-wf">${Object.keys(WF).map(w => `<option value="${w}" ${w === DEFAULT_WF ? "selected" : ""}>${w}${w === DEFAULT_WF ? " · repository default" : ""}</option>`).join("")}</select> <span class="stops" id="a-stops">${stopsLine(DEFAULT_WF)}</span></div></div>
      <div class="foot"><span class="muted mono" id="a-cli">${esc(cliFor("", "product", DEFAULT_WF))}</span><button class="btn ghost" id="a-cancel">Cancel</button><button class="btn" id="a-go" disabled>Create <kbd>⌘↩</kbd></button></div>
    </div>
  </div>
  ${t ? `<button class="btn ghost reset" data-reset>Start over</button>` : ""}
  ${terminal(t && t.req, t ? t.wave : "product", t ? t.wf : DEFAULT_WF, t ? t.id : nextId)}
  ${noteBlock("a")}`;
}
function wireA(s) {
  const open = () => { document.getElementById("a-scrim").style.display = "block"; document.getElementById("a-sheet").style.display = "block"; document.getElementById("a-req").focus(); };
  const close = () => { document.getElementById("a-scrim").style.display = "none"; document.getElementById("a-sheet").style.display = "none"; };
  document.querySelector('[data-new="a"]').onclick = open;
  s.open = open;
  const req = document.getElementById("a-req"), wave = document.getElementById("a-wave"), wf = document.getElementById("a-wf"), go = document.getElementById("a-go");
  const sync = () => { go.disabled = !req.value.trim(); document.getElementById("a-stops").innerHTML = stopsLine(wf.value); document.getElementById("a-cli").textContent = cliFor(req.value, wave.value, wf.value); };
  [req, wave, wf].forEach(e => e.oninput = sync);
  document.getElementById("a-cancel").onclick = close;
  document.getElementById("a-scrim").onclick = close;
  const submit = () => { if (!req.value.trim()) return; s.task = { id: nextId++, req: req.value, wave: wave.value, wf: wf.value }; render(); };
  go.onclick = submit;
  req.onkeydown = e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) submit(); if (e.key === "Escape") close(); };
}

/* ---------- B: talk-first ---------- */
function renderB(s) {
  const t = s.task;
  let pane;
  if (t) pane = conversation(t);
  else if (s.drafting) pane = `<div class="welcome"><h2>What do you want?</h2><p>Say it the way you'd say it to a teammate. Sending it files the Task and starts its workflow.</p>
      <div class="wfcards">${Object.keys(WF).map(w => `<button class="wfcard ${w === s.wf ? "sel" : ""}" data-wf="${w}"><b>${w}${w === DEFAULT_WF ? " ·&nbsp;default" : ""}</b><span>${WF[w].blurb}</span></button>`).join("")}</div></div>
      <div class="composer"><div class="draftbar">New Task in <select id="b-wave">${["repository", ...WAVES].map(w => `<option ${w === s.wave ? "selected" : ""} value="${w}">${w === "repository" ? "loopflow (no Wave)" : "Wave " + w}</option>`).join("")}</select><span class="sep">·</span><span class="stops" id="b-stops">${s.wf}: ${stopsLine(s.wf)}</span><span style="margin-left:auto" class="muted">Return sends · Esc discards</span></div>
      <textarea id="b-req" rows="2" placeholder="e.g. lf task status should print the graph name on its first line"></textarea></div>`;
  else pane = `<div class="empty"><div class="big">No Task selected</div>Click ＋ New Task to start a conversation.</div>`;
  const draftRow = s.drafting && !t ? [{ id: "…", req: "New Task" }] : [];
  return `<div class="pitch"><div><b>Just start talking.</b> New Task opens an empty conversation, not a form. The workflow sits as three cards you can ignore; your first message files the Task and its title comes from what you said.</div><div>Try: click <b>＋ New Task</b>, pick a card if you like, type, press Return.</div></div>
  <div class="win">
    <div class="titlebar"><span class="dots"><i></i><i></i><i></i></span><span class="hint">Loopflow — loopflow</span></div>
    ${sidebar("b", t ? [t] : draftRow, t ? t.id : "…")}
    <section class="pane">${pane}</section>
  </div>
  ${t ? `<button class="btn ghost reset" data-reset>Start over</button>` : ""}
  ${terminal(t && t.req, t ? t.wave : s.wave, t ? t.wf : s.wf, t ? t.id : nextId)}
  ${noteBlock("b")}`;
}
function wireB(s) {
  s.wf ??= DEFAULT_WF; s.wave ??= "product";
  s.open = () => { s.drafting = true; render(); };
  document.querySelector('[data-new="b"]').onclick = s.open;
  document.querySelectorAll("[data-wf]").forEach(b => b.onclick = () => { s.wf = b.dataset.wf; const v = document.getElementById("b-req").value; render(); const r = document.getElementById("b-req"); r.value = v; r.focus(); });
  const req = document.getElementById("b-req");
  if (!req) return;
  req.focus();
  document.getElementById("b-wave").onchange = e => s.wave = e.target.value;
  req.onkeydown = e => {
    if (e.key === "Escape") { s.drafting = false; render(); }
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!req.value.trim()) return; s.task = { id: nextId++, req: req.value, wave: s.wave, wf: s.wf }; s.drafting = false; render(); }
  };
}

/* ---------- C: palette ---------- */
function renderC(s) {
  const t = s.task;
  s.wf ??= DEFAULT_WF;
  return `<div class="pitch"><div><b>One line.</b> ⌘N opens a palette with one field. Tab cycles the workflow and the path redraws; the command it runs is printed underneath, live. Return starts it.</div><div>Try: press <b>⌘N</b> (or click ＋ New Task), type, hit <kbd>Tab</kbd> a couple of times, Return.</div></div>
  <div class="win">
    <div class="titlebar"><span class="dots"><i></i><i></i><i></i></span><span class="hint">Loopflow — loopflow</span></div>
    ${sidebar("c", t ? [t] : [], t && t.id)}
    <section class="pane">${t ? conversation(t) : `<div class="empty"><div class="big">No Task selected</div>Press ⌘N to start one.</div>`}</section>
    <div class="scrim" id="c-scrim"></div>
    <div class="palette" id="c-pal">
      <input id="c-req" placeholder="New Task in product — what do you want?" autocomplete="off">
      <div class="body">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${Object.keys(WF).map(w => `<span class="chip ${w === s.wf ? "sel" : ""}">${w}</span>`).join("")}<span class="stops" style="margin-left:6px">${stopsLine(s.wf)}</span></div>
        <div class="path">${rail(s.wf, -1)}</div>
        <div class="cmd mono" id="c-cli">${esc(cliFor("", "product", s.wf))}</div>
        <div class="keys"><span><kbd>Return</kbd> start</span><span><kbd>Tab</kbd> workflow</span><span><kbd>⌥W</kbd> Wave</span><span><kbd>Esc</kbd> close</span></div>
      </div>
    </div>
  </div>
  ${t ? `<button class="btn ghost reset" data-reset>Start over</button>` : ""}
  ${terminal(t && t.req, "product", t ? t.wf : s.wf, t ? t.id : nextId)}
  ${noteBlock("c")}`;
}
function wireC(s) {
  const pal = document.getElementById("c-pal"), scrim = document.getElementById("c-scrim"), req = document.getElementById("c-req");
  s.open = () => { pal.style.display = "block"; scrim.style.display = "block"; req.focus(); };
  const close = () => { pal.style.display = "none"; scrim.style.display = "none"; s.draft = ""; };
  document.querySelector('[data-new="c"]').onclick = s.open;
  scrim.onclick = close;
  if (s.reopen) { s.reopen = false; s.open(); req.value = s.draft || ""; }
  req.oninput = () => { s.draft = req.value; document.getElementById("c-cli").textContent = cliFor(req.value, "product", s.wf); };
  req.dispatchEvent(new Event("input"));
  req.onkeydown = e => {
    if (e.key === "Tab") { e.preventDefault(); const ks = Object.keys(WF); s.wf = ks[(ks.indexOf(s.wf) + (e.shiftKey ? ks.length - 1 : 1)) % ks.length]; s.reopen = true; render(); }
    if (e.key === "Escape") close();
    if (e.key === "Enter") { if (!req.value.trim()) return; s.task = { id: nextId++, req: req.value, wave: "product", wf: s.wf }; s.draft = ""; render(); }
  };
}

/* ---------- shell ---------- */
const state = { tab: "a", a: {}, b: {}, c: {} };
const R = { a: [renderA, wireA], b: [renderB, wireB], c: [renderC, wireC] };
function render() {
  const s = state[state.tab];
  if (state.tab === "b") { s.wf ??= DEFAULT_WF; s.wave ??= "product"; }
  document.getElementById("stage").innerHTML = R[state.tab][0](s);
  R[state.tab][1](s);
  const reset = document.querySelector("[data-reset]");
  if (reset) reset.onclick = () => { state[state.tab] = {}; render(); };
  document.querySelectorAll("[role=tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === state.tab));
}
document.querySelectorAll("[role=tab]").forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); });
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "n") { e.preventDefault(); const s = state[state.tab]; if (!s.task && s.open) s.open(); }
});
render();
</script>
</body>
</html>
