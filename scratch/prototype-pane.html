<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOO-711 · Task pane</title>
<style>
  :root {
    color-scheme: light dark;
    --background: #faf8f5; --surface: #fffdf9; --surface-muted: #f3eee7; --surface-element: #ece6dd;
    --border: #e6dfd6; --border-strong: #d6ccc0; --border-active: #c2b5a6;
    --text: #2a2624; --text-secondary: #5f5752; --text-tertiary: #685f58;
    --accent: #722f37; --accent-text: #faf8f5; --selected-fill: #e1d9ce;
    --working: #3269aa; --working-fill: #eaedf0; --warning: #87601b; --available: #5d3539; --available-fill: #efeae8; --failure: #b0443b; --success: #3b734c; --success-fill: #ebefe8; --stopped: #5f5752;
    --bar: #3269aa; --bar-soft: #b9cbe3; --bar-cur: #722f37; --bar-wait: #5d3539;
    --proto-bg: #2a2624; --proto-fg: #faf8f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #2b3036; --surface: #31363c; --surface-muted: #363b42; --surface-element: #3c4249;
      --border: #3f454c; --border-strong: #4a515a; --border-active: #5c646e;
      --text: #f5f1ea; --text-secondary: #c5bfb7; --text-tertiary: #a39c94;
      --accent: #c8b9c1; --accent-text: #2b3036; --selected-fill: #3d4349;
      --working: #a5c0e1; --working-fill: #2c3541; --warning: #d3bb8e; --available: #c8b9c1; --available-fill: #33363c; --failure: #e3b2ae; --success: #a7c5af; --success-fill: #2d3739; --stopped: #c5bfb7;
      --bar: #a5c0e1; --bar-soft: #4d5e73; --bar-cur: #c8b9c1; --bar-wait: #c8b9c1;
      --proto-bg: #14171a; --proto-fg: #f5f1ea;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--proto-bg); color: var(--text); font: 13px/1.45 "Lato", -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; display: flex; flex-direction: column; }
  .mono { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; }

  .proto { color: var(--proto-fg); padding: .55rem 1rem; display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; align-items: center; font-size: 12.5px; }
  .proto .seg { display: inline-flex; border: 1px solid rgba(255,255,255,.25); border-radius: 6px; overflow: hidden; }
  .proto .seg button { background: transparent; color: var(--proto-fg); border: 0; border-right: 1px solid rgba(255,255,255,.25); padding: .3rem .7rem; font: inherit; cursor: pointer; }
  .proto .seg button:last-child { border-right: 0; }
  .proto .seg button.on { background: var(--proto-fg); color: var(--proto-bg); }
  .proto .scrub { display: flex; align-items: center; gap: .6rem; flex: 1 1 20rem; }
  .proto .scrub input { flex: 1; accent-color: var(--proto-fg); }
  .proto .clock { font-variant-numeric: tabular-nums; min-width: 2.8rem; }
  .proto .phase { opacity: .75; min-width: 10rem; }
  .proto .note { flex-basis: 100%; opacity: .75; }

  .stage { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; padding: 0 1rem 1.5rem; min-height: 0; overflow: auto; }
  .pane { width: min(100%, 760px); background: var(--background); border: 1px solid var(--border-strong); border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.35); overflow: hidden; display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: .6rem; padding: .4rem .9rem; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-secondary); }
  .bar .name { color: var(--text); font-weight: 600; }
  .bar .right { margin-left: auto; font-size: 11px; }
  .body { padding: .7rem 1rem 1.2rem; color: var(--text-secondary); font-size: 12.5px; }

  .heading { display: flex; align-items: baseline; gap: .6rem; margin-bottom: .6rem; }
  .heading .id { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; color: var(--text); }
  .heading .title { color: var(--text); font-size: 14px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .heading .state { color: var(--text-secondary); white-space: nowrap; }
  .section-title { font-family: "Cormorant Garamond", "Iowan Old Style", Georgia, serif; font-size: 18px; font-weight: 500; color: var(--text); margin: 1.1rem 0 .3rem; display: flex; align-items: baseline; gap: .6rem; }
  .section-title a { color: var(--text-tertiary); text-decoration: none; border-bottom: 1px solid var(--border-active); }
  .section-title small { font-family: "Lato", -apple-system, sans-serif; font-size: 11.5px; color: var(--text-tertiary); font-weight: 400; }

  /* where: the graph path */
  .path { display: flex; align-items: center; flex-wrap: wrap; gap: .25rem .2rem; font-size: 12px; margin: .3rem 0 .1rem; }
  .path .node { padding: .2rem .55rem; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--text-secondary); background: var(--surface); white-space: nowrap; }
  .path .node.done { color: var(--text-secondary); background: var(--success-fill); border-color: transparent; }
  .path .node.cur { color: var(--accent-text); background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .path .node.wait { color: var(--accent-text); background: var(--available); border-color: var(--available); font-weight: 600; }
  .path .node.todo { color: var(--text-tertiary); border-style: dashed; }
  .path .arrow { color: var(--border-active); padding: 0 .1rem; }
  .path .loop { display: inline-flex; align-items: center; gap: .2rem; padding: .15rem .35rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-muted); }
  .path .loop .n { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 11px; color: var(--text-secondary); padding: 0 .3rem; }
  .where-line { color: var(--text); margin: .45rem 0 0; }
  .stats { color: var(--text-secondary); margin: .5rem 0 .2rem; font-variant-numeric: tabular-nums; }
  .stats .sep { color: var(--border-active); padding: 0 .45rem; }
  .where-line b { font-weight: 600; }

  /* ready: the delivery ladder */
  .ladder { display: flex; align-items: center; margin: .4rem 0 .25rem; font-size: 11.5px; }
  .ladder span { padding: .18rem .6rem; border: 1px solid var(--border); border-left: 0; color: var(--text-tertiary); background: var(--surface-muted); white-space: nowrap; }
  .ladder span:first-child { border-left: 1px solid var(--border); border-radius: 5px 0 0 5px; }
  .ladder span:last-child { border-radius: 0 5px 5px 0; }
  .ladder span.done { color: var(--text-secondary); background: var(--success-fill); }
  .ladder span.now { color: var(--accent-text); background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .ladder span.now.wait { background: var(--available); border-color: var(--available); }
  .ready-line { color: var(--text); }
  .ready-line b { font-weight: 600; }
  .pr a { color: var(--text-secondary); text-decoration: underline; text-decoration-color: var(--border-active); }

  /* stat tiles */
  .tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .5rem; margin: .5rem 0 .2rem; }
  @media (max-width: 640px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: .45rem .6rem .5rem; min-width: 0; }
  .tile .l { font-size: 11px; color: var(--text-secondary); }
  .tile .v { font-size: 20px; font-weight: 600; color: var(--text); line-height: 1.15; margin-top: .1rem; }
  .tile .v small { font-size: 12px; font-weight: 400; color: var(--text-secondary); }
  .tile .d { font-size: 11px; color: var(--text-tertiary); margin-top: .1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .spark { display: flex; gap: 2px; align-items: flex-end; height: 14px; margin-top: .3rem; }
  .tile .spark i { flex: 1; background: var(--bar-soft); border-radius: 2px 2px 0 0; display: block; }
  .tile .spark i.cur { background: var(--bar-cur); }

  /* timeline */
  .timeline { position: relative; margin: .4rem 0 .2rem; }
  .tl-axis { position: relative; height: 16px; margin-left: 88px; font-size: 10.5px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  .tl-axis span { position: absolute; transform: translateX(-50%); }
  .tl-row { display: flex; align-items: center; height: 22px; }
  .tl-row .lab { width: 88px; flex: none; font-size: 11.5px; color: var(--text-secondary); padding-right: .6rem; white-space: nowrap; display: flex; justify-content: space-between; }
  .tl-row .lab .c { color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  .tl-row .track { position: relative; flex: 1; height: 100%; border-left: 1px solid var(--border); }
  .tl-grid { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--border); }
  .tl-bar { position: absolute; top: 4px; height: 14px; background: var(--bar); border-radius: 0 4px 4px 0; cursor: default; }
  .tl-bar.cur { background: var(--bar-cur); }
  .tl-bar.wait { background: var(--bar-wait); }
  .tl-bar.tiny { min-width: 3px; }
  .tl-bar .lbl { position: absolute; left: 100%; top: -1px; padding-left: 5px; font-size: 10.5px; color: var(--text-secondary); white-space: nowrap; }
  .tl-bar.inside .lbl { left: 0; padding-left: 5px; color: #fff; }
  .tl-now { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--accent); }
  .tl-now::after { content: 'now'; position: absolute; top: -14px; left: 3px; font-size: 10px; color: var(--accent); }
  .legend { display: flex; gap: 1rem; font-size: 11px; color: var(--text-secondary); margin: .3rem 0 0 88px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: .3rem; }
  .tip { position: fixed; z-index: 9; pointer-events: none; background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); border-radius: 6px; padding: .35rem .55rem; font-size: 11.5px; box-shadow: 0 6px 20px rgba(0,0,0,.18); display: none; max-width: 22rem; }
  .tip .k { color: var(--text-secondary); }

  /* step table */
  table.steps { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: .3rem; font-variant-numeric: tabular-nums; }
  table.steps th { text-align: left; font-weight: 400; color: var(--text-tertiary); font-size: 11px; padding: .2rem .4rem .2rem 0; border-bottom: 1px solid var(--border); }
  table.steps td { padding: .22rem .4rem .22rem 0; border-bottom: 1px solid var(--border); vertical-align: top; color: var(--text-secondary); }
  table.steps td.n { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 11px; color: var(--text); white-space: nowrap; }
  table.steps td.r { text-align: right; white-space: nowrap; }
  table.steps tr.cur td.n { color: var(--working); }
  table.steps tr.wait td.n { color: var(--available); }
  table.steps td .o { white-space: nowrap; }
  table.steps td .o.running { color: var(--working); } table.steps td .o.waits { color: var(--available); }

  /* files */
  .files { font-size: 12px; margin-top: .2rem; }
  .files .f { display: grid; grid-template-columns: minmax(0, 1fr) 72px 110px; gap: .6rem; align-items: center; padding: .18rem 0; border-bottom: 1px solid var(--border); }
  .files .p { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 11px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files .n { color: var(--text-secondary); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .files .stat { display: flex; gap: 2px; height: 8px; }
  .files .stat i { display: block; height: 100%; border-radius: 2px; }
  .files .stat .a { background: var(--success); } .files .stat .d { background: var(--failure); }

  /* design items */
  .items .it { display: grid; grid-template-columns: 1.2rem minmax(0, 1fr) auto; gap: .4rem; align-items: baseline; padding: .2rem 0; border-bottom: 1px solid var(--border); }
  .items .m { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }
  .items .m.ok { color: var(--success); } .items .m.def { color: var(--warning); } .items .m.todo { color: var(--text-tertiary); }
  .items .t { color: var(--text); }
  .items .w { color: var(--text-tertiary); font-size: 11px; white-space: nowrap; }
  .items .why { grid-column: 2 / 4; color: var(--text-secondary); font-size: 11.5px; }
  .quiet { color: var(--text-tertiary); font-size: 11.5px; }
  .meter { height: 6px; border-radius: 3px; background: var(--success-fill); overflow: hidden; margin: .3rem 0 .1rem; }
  .meter i { display: block; height: 100%; background: var(--success); border-radius: 3px; }
</style>
</head>
<body>

<div class="proto">
  <span>Task pane · brief + workflow combined</span>
  <div class="scrub">
    <span class="clock" id="clock">12:10</span>
    <input type="range" id="time" min="0" max="90" value="60" step="1" aria-label="time">
    <span class="phase" id="phase"></span>
  </div>
  <div class="seg" id="depth">
    <button data-v="min">Minimal</button>
    <button data-v="full" class="on">Expanded</button>
  </div>
  <span class="note">Scrub time (or ← →). Minimal is three lines: the path, a sentence only when something is for you, one line of numbers. Expanded adds the timeline (hover a bar; “table” swaps it for rows), changes and design items.</span>
</div>

<div class="stage">
  <div class="pane">
    <div class="bar"><span class="name">Task</span><span class="right" id="panesub"></span></div>
    <div class="body" id="body"></div>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>
// ---------- the imagined run (minutes after 12:10) ----------
const T0 = 12 * 60 + 10;
const clock = m => { const t = T0 + m; return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
const steps = [
  { s: 0,  e: 24, n: 'implement',    loop: 1, cost: 1.20, files: 6,  add: 210, del: 40 },
  { s: 24, e: 31, n: 'compress',     loop: 1, cost: 0.40, files: 3 },
  { s: 31, e: 31, n: 'sync',         loop: 1, cost: 0 },
  { s: 31, e: 42, n: 'realign',      loop: 1, cost: 0.55, note: 'updated scratch/loo-711….md' },
  { s: 42, e: 43, n: 'loop-or-next', loop: 1, cost: 0.05, route: 'loop', why: 'wait exit status untested' },
  { s: 43, e: 59, n: 'implement',    loop: 2, cost: 0.90, files: 4,  add: 150, del: 40 },
  { s: 59, e: 63, n: 'compress',     loop: 2, cost: 0.25, files: 2 },
  { s: 63, e: 63, n: 'sync',         loop: 2, cost: 0 },
  { s: 63, e: 66, n: 'realign',      loop: 2, cost: 0.25 },
  { s: 66, e: 67, n: 'loop-or-next', loop: 2, cost: 0.05, route: 'loop', why: 'integration test flaky on timeout' },
  { s: 67, e: 76, n: 'implement',    loop: 3, cost: 0.45, files: 2,  add: 52, del: 16, note: 'tests only' },
  { s: 76, e: 77, n: 'compress',     loop: 3, cost: 0.10 },
  { s: 77, e: 77, n: 'sync',         loop: 3, cost: 0 },
  { s: 77, e: 78, n: 'realign',      loop: 3, cost: 0.10, note: 'deferred “timeout exits 2”' },
  { s: 78, e: 78, n: 'loop-or-next', loop: 3, cost: 0.05, route: 'next' },
  { s: 78, e: 83, n: 'deliver',      loop: 0, cost: 0.15, pr: true },
  { s: 83, e: null, n: 'verify',     loop: 0, cost: 0, wait: true },
];
const design = [
  { t: 'wait returns on the first move',        done: 24, loop: 1, where: 'ops/task.rs · 3 tests' },
  { t: 'settle window folds a step boundary',   done: 24, loop: 1, where: 'ops/task.rs' },
  { t: 'three session skills name the flags',   done: 59, loop: 2, where: '3 skill files' },
  { t: 'integration test in tests/',            done: 76, loop: '2–3', where: 'task_wait_tests.rs' },
  { t: '--timeout 0s exits 2',                  deferred: 78, loop: 3, why: 'exit codes collide with lf’s own 2' },
];
const filesAt = m => {
  const out = [];
  if (m >= 24) out.push(['rust/loopflow/src/ops/task.rs', 188, 41], ['rust/loopflow/src/lf/commands/watch.rs', 36, 4], ['rust/loopflow/src/lf/commands/task.rs', 21, 6], ['rust/loopflow/tests/task_wait_tests.rs', 96, 0], ['docs/work.md', 3, 2], ['docs/agent-api.md', 2, 1]);
  if (m >= 59) out.push(['rust/loopflow/src/builtins/task/skill/task_session.md', 22, 9], ['rust/loopflow/src/builtins/wave/skill/wave_session.md', 2, 2], ['rust/loopflow/src/builtins/ops/skill/repo_session.md', 2, 2], ['rust/loopflow/tests/integration.rs', 1, 0]);
  if (m >= 76) out.push(['rust/loopflow/tests/task_initialization_tests.rs', 0, 18], ['rust/loopflow/src/lf/commands/steer.rs', 0, 5], ['scratch/questions.md', 6, 0]);
  if (m >= 76) { const i = out.findIndex(f => f[0].endsWith('task_wait_tests.rs')); out[i] = ['rust/loopflow/tests/task_wait_tests.rs', 140, 12]; }
  return out;
};
const statAt = m => { let f = 0, a = 0, d = 0; for (const s of steps) if (s.files && s.e <= m) { f += s.files; a += s.add || 0; d += s.del || 0; } return { f, a, d }; };
const loopsAt = m => steps.filter(s => s.n === 'loop-or-next' && s.e <= m && s.route === 'loop').length + (m >= 78 ? 1 : 0);
const costAt = m => steps.filter(s => s.e !== null && s.e <= m).reduce((c, s) => c + s.cost, 0) + (steps.find(s => s.s <= m && (s.e === null || s.e > m))?.cost || 0) * 0.5;
const current = m => steps.find(s => s.s <= m && (s.e === null || s.e > m)) || (m >= 83 ? steps[steps.length - 1] : null);
const prAt = m => m >= 83 ? { n: 1803, phase: 'submitted', at: clock(83), green: m >= 88 } : null;
const dur = s => s.e === null ? null : (s.e - s.s);
const money = c => '$' + c.toFixed(2);
const hm = m => m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

// ---------- where it stands: one path from kickoff to merged ----------
function pathStrip(m) {
  const cur = current(m), loops = loopsAt(m), pr = prAt(m);
  const inLoop = cur && cur.loop;
  const node = (n, cls) => `<span class="node ${cls}">${n}</span>`;
  const arrow = '<span class="arrow">→</span>';
  const loopNodes = ['implement', 'compress', 'sync', 'realign'].map(n => {
    if (inLoop && cur.n === n) return node(n, 'cur');
    if (inLoop && steps.find(s => s.loop === cur.loop && s.n === n)?.e <= m) return node(n, 'done');
    if (!inLoop) return node(n, 'done');
    return node(n, 'todo');
  }).join(arrow);
  const passes = inLoop ? cur.loop : loops;
  const loop = `<span class="loop">${loopNodes}<span class="n">↺ ${passes}${inLoop ? '' : ' ✓'}</span></span>`;
  const deliver = m >= 83 ? node('deliver ✓', 'done') : (cur && cur.n === 'deliver') ? node('deliver', 'cur') : node('deliver', 'todo');
  // deliver unfolds into the PR's own stages; verify is where the Graph waits for your review
  const prNode = pr ? node(`PR #${pr.n} ✓`, 'done') : node('PR', 'todo');
  const checks = pr ? (pr.green ? node('checks ✓', 'done') : node('checks running', 'cur')) : node('checks', 'todo');
  const review = cur?.wait && pr?.green ? node('verify · your review', 'wait') : node('verify · your review', 'todo');
  const merged = node('merged', 'todo');
  return `<div class="path">${node('kickoff ✓', 'done')}${arrow}${node('explore ✓', 'done')}${arrow}${loop}${arrow}${deliver}${arrow}${prNode}${arrow}${checks}${arrow}${review}${arrow}${merged}</div>`;
}
function standsLine(m) {
  const cur = current(m), pr = prAt(m);
  if (cur?.wait && pr?.green) return `<div class="where-line"><b>Ready for your review.</b> PR <span class="pr"><a href="#">#${pr.n}</a></span> · 14 files · verify continues here when you’ve looked.</div>`;
  return '';
}
// ---------- one line of numbers ----------
function statsLine(m) {
  const st = statAt(m), loops = loopsAt(m), cost = costAt(m), cur = current(m);
  const done = design.filter(x => x.done && x.done <= m).length, def = design.filter(x => x.deferred && x.deferred <= m).length;
  const parts = [
    `${loops} loop${loops === 1 ? '' : 's'}${cur?.loop ? ' + 1 running' : ''}`,
    hm(m),
    money(cost),
    st.f ? `${st.f} files +${st.a} −${st.d}` : 'no changes yet',
    `design ${done}/5${def ? `, ${def} deferred` : ''}`,
  ];
  return `<div class="stats">${parts.join('<span class="sep">·</span>')}</div>`;
}
// ---------- timeline ----------
function timeline(m) {
  const span = Math.max(m, 30);
  const pct = x => (x / span * 100).toFixed(2) + '%';
  const ticks = []; for (let t = 0; t <= span; t += 15) ticks.push(t);
  let h = `<div class="timeline"><div class="tl-axis">${ticks.map(t => `<span style="left:${pct(t)}">${clock(t)}</span>`).join('')}</div>`;
  const rows = [];
  for (const l of [1, 2, 3]) if (steps.some(s => s.loop === l && s.s <= m)) rows.push({ lab: `loop ${l}`, ss: steps.filter(s => s.loop === l && s.n !== 'sync'), cost: steps.filter(s => s.loop === l && s.e !== null && s.e <= m).reduce((c, s) => c + s.cost, 0) });
  if (steps.some(s => s.loop === 0 && s.s <= m)) rows.push({ lab: 'deliver', ss: steps.filter(s => s.loop === 0), cost: 0.15 });
  for (const r of rows) {
    h += `<div class="tl-row"><div class="lab"><span>${r.lab}</span><span class="c">${r.cost ? money(r.cost) : ''}</span></div><div class="track">${ticks.map(t => `<div class="tl-grid" style="left:${pct(t)}"></div>`).join('')}`;
    for (const s of r.ss) {
      if (s.s > m) continue;
      const end = s.e === null || s.e > m ? m : s.e;
      const isCur = current(m) === s;
      const w = Math.max(end - s.s, 0);
      const cls = s.wait ? 'wait' : isCur ? 'cur' : '';
      const label = s.n === 'loop-or-next' ? '' : (w / span > 0.09 ? s.n : (w / span > 0.03 ? s.n.slice(0, 3) : ''));
      const inside = w / span > 0.09;
      h += `<div class="tl-bar ${cls} ${w < 1 ? 'tiny' : ''} ${inside ? 'inside' : ''}" style="left:${pct(s.s)};width:${pct(w)}" data-i="${steps.indexOf(s)}"><span class="lbl">${label}</span></div>`;
    }
    h += `</div></div>`;
  }
  h += `<div class="tl-row" style="height:0"><div class="lab"></div><div class="track" style="border:0;height:0"><div class="tl-now" style="left:${pct(m)};top:-${rows.length * 22 + 2}px;height:${rows.length * 22 + 2}px"></div></div></div>`;
  h += `</div>`;
  return h;
}
function stepTable(m) {
  const cur = current(m);
  let h = `<table class="steps"><tr><th>Started</th><th>Step</th><th>Loop</th><th></th><th>Outcome</th><th style="text-align:right">Took</th><th style="text-align:right">Cost</th></tr>`;
  for (const s of steps) {
    if (s.s > m) continue;
    const isCur = s === cur;
    const o = s.wait ? ['waits for you', 'waits'] : isCur ? ['running', 'running'] : s.route ? [`→ ${s.route}`, ''] : ['succeeded', ''];
    const d = isCur ? (s.wait ? '' : (m - s.s) + 'm…') : dur(s) + 'm';
    const extra = s.pr ? 'PR #1803 submitted' : s.why ? `“${s.why}”` : s.note ? s.note : s.files ? `${s.files} files` : '';
    h += `<tr class="${s.wait && isCur ? 'wait' : isCur ? 'cur' : ''}"><td class="r">${clock(s.s)}</td><td class="n">${s.n}</td><td>${s.loop || ''}</td><td>${esc(extra)}</td><td><span class="o ${o[1]}">${o[0]}</span></td><td class="r">${d}</td><td class="r">${s.cost && !isCur ? money(s.cost) : ''}</td></tr>`;
  }
  return h + `</table><div class="quiet" style="margin-top:.3rem">each row opens the step’s log and transcript</div>`;
}
function fileList(m) {
  const fs = filesAt(m);
  if (!fs.length) return '<div class="quiet">no changes yet</div>';
  const max = Math.max(...fs.map(f => f[1] + f[2]));
  let h = '<div class="files">';
  for (const [p, a, d] of fs) {
    const wa = Math.round(a / max * 110), wd = Math.round(d / max * 110);
    h += `<div class="f"><span class="p">${esc(p)}</span><span class="n">${a ? '+' + a : ''}${d ? ' −' + d : ''}</span><span class="stat"><i class="a" style="width:${wa}px"></i><i class="d" style="width:${wd}px"></i></span></div>`;
  }
  return h + '</div>';
}
function itemList(m) {
  let h = '<div class="items">';
  for (const d of design) {
    const done = d.done && d.done <= m, def = d.deferred && d.deferred <= m;
    const mark = done ? '<span class="m ok">✓</span>' : def ? '<span class="m def">○</span>' : '<span class="m todo">·</span>';
    h += `<div class="it">${mark}<span class="t">${esc(d.t)}</span><span class="w">${done ? `loop ${d.loop} · ${esc(d.where)}` : def ? `deferred, loop ${d.loop}` : ''}</span>${def ? `<span class="why">realign: ${esc(d.why)} → scratch/questions.md</span>` : ''}</div>`;
  }
  return h + '</div>';
}

// ---------- the pane ----------
let showTable = false;
function render() {
  const m = +document.getElementById('time').value, full = depth === 'full', cur = current(m);
  document.getElementById('clock').textContent = clock(m);
  document.getElementById('phase').textContent = cur ? (cur.wait ? 'verify waits for you' : `${cur.n}${cur.loop ? ' · loop ' + cur.loop : ''}`) : '';
  document.getElementById('panesub').textContent = full ? 'expanded' : 'minimal';
  const state = cur?.wait ? 'Active' : 'Moving';
  let h = `<div class="heading"><span class="id">LOO-711</span><span class="title">Task Sessions tell you what their background work is doing without being asked</span><span class="state">${state}</span></div>`;
  h += pathStrip(m) + standsLine(m) + statsLine(m);
  if (full) {
    h += `<div class="section-title">Timeline <small><a href="#" id="tbl">${showTable ? 'bars' : 'table'}</a></small></div>${showTable ? stepTable(m) : timeline(m)}`;
    h += `<div class="section-title">Changes</div>${fileList(m)}`;
    h += `<div class="section-title">Design</div>${itemList(m)}`;
  }
  document.getElementById('body').innerHTML = h;
  const t = document.getElementById('tbl'); if (t) t.onclick = e => { e.preventDefault(); showTable = !showTable; render(); };
}
let depth = 'full';
const $ = id => document.getElementById(id);
for (const b of $('depth').querySelectorAll('button')) b.onclick = () => { depth = b.dataset.v; for (const x of $('depth').querySelectorAll('button')) x.classList.toggle('on', x === b); render(); };
$('time').oninput = render;
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') { $('time').value = Math.min(90, +$('time').value + 1); render(); }
  if (e.key === 'ArrowLeft') { $('time').value = Math.max(0, +$('time').value - 1); render(); }
});
// hover tooltip on timeline bars
const tip = $('tip');
document.addEventListener('mousemove', e => {
  const bar = e.target.closest('.tl-bar');
  if (!bar) { tip.style.display = 'none'; return; }
  const s = steps[+bar.dataset.i], m = +$('time').value;
  const end = s.e === null || s.e > m ? null : s.e;
  tip.innerHTML = `<div><b>${s.n}</b>${s.loop ? ` · loop ${s.loop}` : ''}</div><div class="k">${clock(s.s)} – ${end === null ? (s.wait ? 'waiting' : 'running') : clock(end)}${end !== null ? ` · ${end - s.s}m` : ` · ${m - s.s}m so far`}</div>${s.cost && end !== null ? `<div class="k">${money(s.cost)}${s.files ? ` · ${s.files} files` : ''}</div>` : ''}${s.why ? `<div class="k">“${esc(s.why)}”</div>` : s.note ? `<div class="k">${esc(s.note)}</div>` : s.pr ? '<div class="k">PR #1803 submitted</div>' : ''}`;
  tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 12, window.innerWidth - 340) + 'px';
  tip.style.top = (e.clientY + 14) + 'px';
});
render();
</script>
</body>
</html>
