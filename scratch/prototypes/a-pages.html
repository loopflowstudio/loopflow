<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A · Pages</title>
<link rel="stylesheet" href="shared.css">
<style>
.details { flex: 1; display: flex; flex-direction: column; min-width: 340px; background: var(--surface); }
.dhead { height: 40px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 14px; border-bottom: 1px solid var(--line); }
.dhead .id { font: 600 12px var(--mono); color: var(--text2); flex: none; }
.dhead .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.docrow { height: 32px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 6px; border-bottom: 1px solid var(--line); background: var(--surface2); }
.docrow .tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1; scrollbar-width: none; }
.doctab { display: flex; align-items: center; gap: 6px; padding: 3px 6px 3px 10px; border-radius: 5px; color: var(--text2); white-space: nowrap; font-size: 12px; }
.doctab.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.doctab .x { opacity: .5; padding: 0 3px; } .doctab .x:hover { opacity: 1; }
.loc { height: 26px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 14px; font-size: 12px; color: var(--text2); border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
.loc .mach { display: inline-flex; align-items: center; gap: 5px; color: var(--text); }
.loc .crumbs { overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
.page { flex: 1; overflow: auto; min-height: 0; }
.brief { padding: 16px 20px 60px; }
.status { display: grid; gap: 8px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 14px; max-width: 680px; }
.status .r { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.status .state { font-weight: 700; }
.outline { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 0 0 6px; font-size: 12px; max-width: 680px; }
.outline button { color: var(--text2); border-bottom: 1px dotted var(--line-strong); }
.outline button:hover { color: var(--text); }
.related { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; max-width: 680px; }
.changed-note { font-size: 12px; color: var(--text2); background: var(--surface2); border-radius: 6px; padding: 6px 10px; margin-bottom: 12px; max-width: 680px; display: flex; gap: 8px; }
.changes { padding: 14px 14px 60px; display: grid; gap: 14px; align-content: start; }
.changes h4 { margin: 4px 0 0; font-size: 12px; color: var(--text2); font-weight: 700; }
.filesbody { flex: 1; display: flex; min-height: 0; }
.nav { width: 230px; flex: none; border-right: 1px solid var(--line); display: flex; flex-direction: column; background: var(--surface); }
.nav.hidden { display: none; }
.nav .filter { margin: 8px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface2); font: inherit; color: var(--text); }
.nav .scratch { padding: 0 8px 6px; border-bottom: 1px solid var(--line); }
.nav .group { font-size: 12px; color: var(--text2); font-weight: 700; padding: 6px 6px 2px; }
.nav .treewrap { flex: 1; overflow: auto; padding: 4px 6px 30px; }
.doc { flex: 1; overflow: auto; min-width: 0; }
.doc .md { padding: 16px 20px; }
.doc .err { padding: 24px; color: var(--failure); }
kbd { font: 11px var(--mono); color: var(--text3); }
</style></head>
<body>
<div class="window">
  <div class="titlebar"></div>
  <div class="main">
    <section class="convo" style="flex:0 0 61.8%"></section>
    <div class="divider"></div>
    <section class="details">
      <div class="dhead"><span class="id"></span><span class="title"></span>
        <div class="seg" role="tablist"><button data-page="brief" title="⌥⌘1">Brief</button><button data-page="changes" title="⌥⌘2">Changes</button><button data-page="files" title="⌥⌘3">Files</button></div></div>
      <div class="filechrome">
        <div class="docrow"><button class="icon-btn" data-act="nav" title="Toggle navigator (⌘P)">◧</button><div class="tabs"></div>
          <div class="seg mode"><button data-mode="read">Read</button><button data-mode="diff">Diff</button></div></div>
        <div class="loc"></div>
      </div>
      <div class="page"></div>
    </section>
  </div>
</div>
<script src="repo-data.js"></script><script src="shared.js"></script>
<script>
const { $, esc, TASKS, md, outline, related, renderPRCard, renderChangeRows, readFile, diffFor, renderCode, renderDiff, prHeadline, checksSummary } = LF;
let taskId = sessionStorage.getItem('a-task') || 'LOO-515';
const S = {};
const st = () => S[taskId] = S[taskId] || { page: 'brief', scroll: {}, tree: LF.treeState(), tabs: [], active: null, mode: {}, nav: true, seenBrief: null };
const task = () => TASKS[taskId];
const page = $('.page');
const convo = LF.mountConvo($('.convo'), task, () => { const s = st(); return s.page === 'files' && s.active ? s.active.split('/').pop() : s.page === 'brief' ? 'the brief' : s.page === 'changes' ? 'Changes' : null; });
let tree;

function saveScroll() { const s = st(); if (s.page !== 'files') s.scroll[key()] = page.scrollTop; }
function key() { const s = st(); return s.page === 'files' ? `files:${s.active}:${s.mode[s.active] || 'read'}` : s.page; }
function restoreScroll() { page.scrollTop = st().scroll[key()] || 0; }
page.addEventListener('scroll', () => { if (st().page !== 'files') st().scroll[key()] = page.scrollTop; });

function setPage(p) { saveScroll(); st().page = p; render(); }
function openFile(path, mode) {
  saveScroll(); const s = st();
  if (!s.tabs.includes(path)) s.tabs.push(path);
  s.active = path; if (mode) s.mode[path] = mode; else if (!s.mode[path]) s.mode[path] = diffFor(path) && taskId === 'LOO-515' ? 'diff' : 'read';
  s.page = 'files'; s.tree.selection = path; render(); tree && tree.reveal(path);
}

function renderHeader() {
  const t = task(), s = st();
  $('.dhead .id').textContent = t.id; $('.dhead .title').textContent = t.title; $('.dhead .title').title = t.title;
  document.querySelectorAll('.dhead .seg button').forEach(b => b.classList.toggle('on', b.dataset.page === s.page));
  $('.filechrome').style.display = s.page === 'files' ? '' : 'none';
}
function renderBrief() {
  const t = task(), s = st(), text = t.brief(), pr = t.pr();
  const [dot, head] = prHeadline(pr);
  const out = outline(text), rel = related(text);
  page.innerHTML = `<div class="brief">
    <div class="status">
      <div class="r"><span class="dot ${t.stateDot}"></span><span class="state">${t.state}</span><span class="sec">${esc(t.reason)}</span></div>
      <div class="r"><button class="chip" data-go="changes"><span class="dot ${dot}"></span>${head}${pr.checks && pr.kind !== 'merged' ? ' · ' + checksSummary(pr) : ''}${pr.read && !pr.fresh ? ' · stale' : ''}</button>
        <span class="chip">${t.machineRemote ? '⌁ ' : ''}${t.machine}</span>${t.due ? `<span class="chip">Due ${t.due}</span>` : ''}<span class="chip">${t.changes().length} changed files</span></div>
    </div>
    ${t.briefChanged() ? `<div class="changed-note">Brief updated since you last read it · Acceptance heading changed <button class="btn" style="margin-left:auto" data-act="seen">Got it</button></div>` : ''}
    ${!text ? `<div class="empty">No brief recorded for ${t.id}.<br>Write one with <span class="mono">lf task edit ${t.id}</span> or ask in the conversation.</div>` : `
    ${out.length > 1 ? `<nav class="outline">${out.map((o, i) => `<button data-jump="${i}">${esc(o)}</button>`).join('')}</nav>` : ''}
    ${rel.length ? `<div class="related">${rel.map(id => `<button class="chip" data-task="${id}" title="${esc(LF.KNOWN[id])}"><span class="mono">${id}</span> ${esc(LF.KNOWN[id]).slice(0, 34)}…</button>`).join('')}</div>` : ''}
    <div class="md">${md(text)}</div>`}
  </div>`;
}
function renderChanges() {
  const t = task();
  page.innerHTML = `<div class="changes">${renderPRCard(t)}<div><h4>Changed in this checkout</h4>${renderChangeRows(t, st().active)}</div></div>`;
}
async function renderFiles() {
  const t = task(), s = st();
  $('.tabs').innerHTML = s.tabs.map(p => `<span class="doctab${p === s.active ? ' on' : ''}" title="${p}"><button data-tab="${p}">${esc(p.split('/').pop())}</button><button class="x" data-close="${p}" aria-label="Close">×</button></span>`).join('');
  const mode = s.mode[s.active] || 'read';
  document.querySelectorAll('.mode button').forEach(b => { b.classList.toggle('on', b.dataset.mode === mode); b.disabled = !s.active || (b.dataset.mode === 'diff' && !diffFor(s.active || '')); b.style.opacity = b.disabled ? .4 : 1; });
  const dir = (s.active || '').split('/').slice(0, -1).join(' / ');
  $('.loc').innerHTML = `<span class="mach">${t.machineRemote ? '⌁' : '⌂'} ${t.machine}</span><span class="dim">·</span><span class="crumbs" title="${t.checkout}/${s.active || ''}">${esc(t.checkout.split('/').pop())}${dir ? ' / ' + esc(dir) : ''}</span>`;
  if (!page.querySelector('.filesbody')) {
    page.innerHTML = `<div class="filesbody"><aside class="nav"><input class="filter" placeholder="Filter loaded files" aria-label="Filter files">
      <div class="scratch"><div class="group">Scratch</div><div class="tree" id="scr"></div></div>
      <div class="group" style="padding-left:14px">Checkout</div><div class="treewrap"><div id="tree"></div></div></aside><div class="doc"></div></div>`;
    page.style.overflow = 'hidden';
    tree = LF.mountTree($('#tree'), task, () => st().tree, p => openFile(p));
    $('.treewrap').addEventListener('scroll', e => st().tree.scroll = e.target.scrollTop);
  }
  $('.nav').classList.toggle('hidden', !s.nav);
  $('#scr').innerHTML = taskId === 'LOO-515' ? ['scratch/loo-515-task-details.md', 'scratch/questions.md'].map(p => `<div class="node${s.active === p ? ' sel' : ''}" data-scr="${p}" style="padding-left:6px"><span class="caret"></span><span class="name">${p.split('/').pop()}</span></div>`).join('') : '<div class="note">No scratch pages</div>';
  tree.render(); $('.treewrap').scrollTop = s.tree.scroll;
  const doc = $('.doc');
  if (!s.active) { doc.innerHTML = `<div class="empty">Pick a file in the navigator, or a change from <button class="btn" data-go="changes">Changes</button>.<br><kbd>↑↓</kbd> move · <kbd>→←</kbd> expand · <kbd>⏎</kbd> open</div>`; return; }
  const path = s.active, k = key();
  doc.innerHTML = `<div class="empty"><div class="skeleton" style="width:60%;margin:0 auto"></div></div>`;
  try {
    if (mode === 'diff') doc.innerHTML = renderDiff(diffFor(path));
    else { const text = await LF.readFile(t, path); if (st().active !== path) return; doc.innerHTML = path.endsWith('.md') ? `<div class="md">${md(text)}</div>` : renderCode(text); }
  } catch (e) { doc.innerHTML = `<div class="err">⚠ ${esc(e.message)}${diffFor(path) ? ` · <button class="btn" data-mode-go="diff">Show its Diff</button>` : ''} <button class="btn" data-act="retry">Retry</button></div>`; }
  doc.scrollTop = s.scroll[k] || 0;
  doc.onscroll = () => { st().scroll[k] = doc.scrollTop; };
}
function render() {
  renderHeader(); const s = st();
  if (s.page !== 'files') { page.style.overflow = 'auto'; s.page === 'brief' ? renderBrief() : renderChanges(); restoreScroll(); }
  else renderFiles();
  convo.refreshCtx();
}
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-change],[data-scr]'); if (!t) return;
  const d = t.dataset;
  if (d.page) setPage(d.page);
  else if (d.go) { e.preventDefault(); setPage(d.go); }
  else if (d.change) openFile(d.change, 'diff');
  else if (d.scr) openFile(d.scr, 'read');
  else if (d.tab) openFile(d.tab);
  else if (d.close) { const s = st(); s.tabs = s.tabs.filter(p => p !== d.close); if (s.active === d.close) s.active = s.tabs.at(-1) || null; render(); }
  else if (d.mode) { saveScroll(); st().mode[st().active] = d.mode; render(); }
  else if (d.modeGo) { st().mode[st().active] = d.modeGo; render(); }
  else if (d.jump) { const h = page.querySelectorAll('.md [data-anchor]')[+d.jump]; h && h.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  else if (d.task && !t.closest('.titlebar')) { LF.toast(`Opens ${d.task} in its own slot`); }
  else if (d.act === 'nav') { st().nav = !st().nav; render(); }
  else if (d.act === 'pr-refresh') { LF.toast('Reading GitHub…'); }
  else if (d.act === 'retry') render();
  else if (d.act === 'seen') { LF.setScen('brief', 'normal'); }
});
page.addEventListener('keydown', e => { const r = e.target.closest('[data-change]'); if (r && e.key === 'Enter') openFile(r.dataset.change, 'diff'); });
document.addEventListener('keydown', e => {
  const n = { Digit1: 'brief', Digit2: 'changes', Digit3: 'files' }[e.code];
  if (n && e.altKey && e.metaKey) { e.preventDefault(); setPage(n); }
  if (e.metaKey && e.key === 'p') { e.preventDefault(); if (st().page !== 'files') setPage('files'); else { st().nav = !st().nav; render(); } if (st().nav) setTimeout(() => $('#tree').focus(), 50); }
});
LF.mountChrome('a', () => taskId, id => { saveScroll(); taskId = id; sessionStorage.setItem('a-task', id); page.innerHTML = ''; convo.render(); render(); });
LF.mountScenario('<kbd>⌥⌘1</kbd> Brief · <kbd>⌥⌘2</kbd> Changes · <kbd>⌥⌘3</kbd> Files · <kbd>⌘P</kbd> navigator');
LF.onScen(() => { if (st().page !== 'files') { saveScroll(); render(); } else { st().tree = LF.treeState(); page.innerHTML = ''; render(); } });
convo.render(); render();
</script>
</body></html>
