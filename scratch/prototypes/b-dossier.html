<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B · Dossier</title>
<link rel="stylesheet" href="shared.css">
<style>
.details { flex: 1; position: relative; min-width: 360px; background: var(--surface); overflow: hidden; }
.dossier { position: absolute; inset: 0; overflow: auto; }
.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 18px 0; }
.top .idline { display: flex; gap: 8px; align-items: baseline; }
.top .id { font: 600 12px var(--mono); color: var(--text2); }
.top h1 { font-size: 16px; margin: 2px 0 8px; line-height: 1.3; }
.top .facts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; font-size: 12px; }
.jump { display: flex; gap: 16px; font-size: 12px; overflow-x: auto; scrollbar-width: none; }
.jump button { padding: 6px 0 8px; color: var(--text3); border-bottom: 2px solid transparent; white-space: nowrap; }
.jump button.on { color: var(--text); border-bottom-color: var(--text); }
.sec-block { padding: 18px 18px 8px; scroll-margin-top: 120px; }
.sec-block > h2 { font-size: 13px; margin: 0 0 10px; color: var(--text2); display: flex; gap: 8px; align-items: baseline; }
.sec-block > h2 .dim { font-weight: 400; }
.outcome { font-size: 16px; line-height: 1.55; max-width: 640px; margin: 0; }
.acc { display: grid; gap: 8px; max-width: 680px; counter-reset: acc; }
.acc li { list-style: none; display: grid; grid-template-columns: 22px 1fr; gap: 4px; font-size: 13.5px; line-height: 1.55; }
.acc li::before { counter-increment: acc; content: counter(acc); font: 12px var(--mono); color: var(--text3); padding-top: 2px; }
.acc .more { display: none; color: var(--text2); } .acc li.open .more { display: inline; }
.acc .toggle { color: var(--text3); font-size: 12px; margin-left: 4px; }
.acc { padding: 0; margin: 0; }
.treebox { border: 1px solid var(--line); border-radius: 8px; height: 360px; overflow: auto; padding: 4px; }
.locline { font-size: 12px; color: var(--text2); margin-bottom: 6px; display: flex; gap: 6px; }
details.full { max-width: 680px; } details.full summary { cursor: pointer; color: var(--text2); font-size: 12px; }
.changed-note { font-size: 12px; color: var(--text2); background: var(--surface2); border-radius: 6px; padding: 6px 10px; margin: 12px 18px 0; display: flex; gap: 8px; align-items: center; }
/* drill-in sheet */
.sheet { position: absolute; inset: 0; background: var(--surface); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .18s ease; z-index: 10; box-shadow: -8px 0 24px rgba(0,0,0,.08); }
.sheet.open { transform: none; }
.sheet .bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.sheet .back { display: flex; gap: 4px; align-items: center; color: var(--text2); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
.sheet .back:hover { background: var(--surface2); color: var(--text); }
.sheet .back .mono { font-size: 12px; }
.sheet .crumbs { flex: 1; min-width: 0; display: flex; gap: 4px; font-size: 12px; color: var(--text2); overflow: hidden; white-space: nowrap; }
.sheet .crumbs button:hover { color: var(--text); text-decoration: underline; }
.sheet .crumbs .leaf { color: var(--text); font-weight: 700; }
.sheet .sub { flex: none; display: flex; align-items: center; gap: 8px; padding: 4px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--text2); background: var(--surface2); }
.sheet .body { flex: 1; overflow: auto; }
.sheet .body .md { padding: 16px 20px; }
.sheet .err { padding: 24px; color: var(--failure); }
kbd { font: 11px var(--mono); color: var(--text3); }
</style></head>
<body>
<div class="window">
  <div class="titlebar"></div>
  <div class="main">
    <section class="convo" style="flex:0 0 55%"></section>
    <div class="divider"></div>
    <section class="details">
      <div class="dossier" tabindex="-1"></div>
      <div class="sheet" aria-hidden="true">
        <div class="bar"><button class="back" data-act="back" title="Back (Esc)">‹ <span class="mono bk"></span></button><div class="crumbs"></div>
          <div class="seg mode"><button data-mode="read">Read</button><button data-mode="diff">Diff</button></div></div>
        <div class="sub"></div>
        <div class="body"></div>
      </div>
    </section>
  </div>
</div>
<script src="repo-data.js"></script><script src="shared.js"></script>
<script>
const { $, esc, TASKS, md, outline, related, outcome, acceptance, renderPRCard, renderChangeRows, readFile, diffFor, renderCode, renderDiff, prHeadline, checksSummary } = LF;
let taskId = sessionStorage.getItem('b-task') || 'LOO-515';
const S = {};
const st = () => S[taskId] = S[taskId] || { scroll: 0, tree: LF.treeState(), stack: [], mode: {}, fileScroll: {}, openAcc: new Set() };
const task = () => TASKS[taskId];
const dossier = $('.dossier'), sheet = $('.sheet');
const convo = LF.mountConvo($('.convo'), task, () => { const s = st(); return s.stack.length ? s.stack.at(-1).split('/').pop() : `${taskId} dossier`; });
let tree;
const SECTIONS = [['outcome', 'Outcome'], ['acceptance', 'Acceptance'], ['pr', 'Pull request'], ['changes', 'Changes'], ['checkout', 'Checkout']];

function renderDossier() {
  const t = task(), s = st(), text = t.brief(), pr = t.pr(), [dot, head] = prHeadline(pr), rel = related(text), acc = acceptance(text);
  const firstSentence = x => { const m = x.match(/^(.+?[.:])(\s|$)/); return m ? [m[1], x.slice(m[1].length)] : [x, '']; };
  dossier.innerHTML = `
  <header class="top">
    <div class="idline"><span class="id">${t.id}</span><span class="dim" style="font-size:12px">${t.machineRemote ? '⌁ ' : ''}${t.machine}</span></div>
    <h1>${esc(t.title)}</h1>
    <div class="facts"><span class="chip"><span class="dot ${t.stateDot}"></span>${t.state} · ${esc(t.reason)}</span>
      <button class="chip" data-jumpto="pr"><span class="dot ${dot}"></span>${head}${pr.checks && pr.kind === 'open' ? ' · ' + checksSummary(pr) : ''}${pr.read && !pr.fresh ? ' · stale' : ''}</button>
      ${t.due ? `<span class="chip">Due ${t.due}</span>` : ''}</div>
    <nav class="jump">${SECTIONS.map(([k, l]) => `<button data-jumpto="${k}">${l}</button>`).join('')}</nav>
  </header>
  ${t.briefChanged() ? `<div class="changed-note">Brief updated since you last read it · Acceptance heading changed <button class="btn" style="margin-left:auto" data-act="seen">Got it</button></div>` : ''}
  <section class="sec-block" id="outcome"><h2>Outcome</h2>
    ${text ? `<p class="outcome">${LF.md(outcome(text)).replace(/^<p>|<\/p>$/g, '')}</p>` : `<div class="empty" style="text-align:left;padding:0">No brief recorded. Write one with <span class="mono">lf task edit ${t.id}</span>, or ask in the conversation.</div>`}
    ${rel.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">${rel.map(id => `<button class="chip" data-task="${id}" title="${esc(LF.KNOWN[id])}"><span class="mono">${id}</span>${esc(LF.KNOWN[id]).split(' ').slice(0, 4).join(' ')}…</button>`).join('')}</div>` : ''}
  </section>
  <section class="sec-block" id="acceptance"><h2>Acceptance <span class="dim">${acc.length} criteria</span></h2>
    ${acc.length ? `<ol class="acc">${acc.map((a, i) => { const [h, r] = firstSentence(a); return `<li class="${s.openAcc.has(i) ? 'open' : ''}"><div><span>${LF.md(h).replace(/^<p>|<\/p>$/g, '')}</span>${r ? `<span class="more">${LF.md(r).replace(/^<p>|<\/p>$/g, '')}</span><button class="toggle" data-acc="${i}">${s.openAcc.has(i) ? 'less' : 'more'}</button>` : ''}</div></li>`; }).join('')}</ol>` : '<div class="dim">No acceptance criteria in the brief.</div>'}
    ${text ? `<details class="full" style="margin-top:14px" ${s.fullOpen ? 'open' : ''}><summary>Full brief · ${text.split(/\s+/).length.toLocaleString()} words</summary><div class="md" style="margin-top:8px">${md(text)}</div></details>` : ''}
  </section>
  <section class="sec-block" id="pr"><h2>Pull request</h2>${renderPRCard(t)}</section>
  <section class="sec-block" id="changes"><h2>Changes <span class="dim">${t.changes().length} files</span></h2>${renderChangeRows(t, s.stack.at(-1))}</section>
  <section class="sec-block" id="checkout" style="padding-bottom:80px"><h2>Checkout</h2>
    <div class="locline"><span>${t.machineRemote ? '⌁' : '⌂'} ${t.machine}</span><span class="dim">·</span><span class="mono" style="font-size:11.5px">${esc(t.checkout)}</span></div>
    <div class="treebox"><div id="tree"></div></div></section>`;
  tree = LF.mountTree($('#tree'), task, () => st().tree, p => push(p));
  tree.render();
  $('.treebox').scrollTop = s.tree.scroll || 0;
  $('.treebox').addEventListener('scroll', e => st().tree.scroll = e.target.scrollTop);
  $('details.full') && $('details.full').addEventListener('toggle', e => st().fullOpen = e.target.open);
  dossier.scrollTop = s.scroll;
  spy();
}
function spy() {
  const top = dossier.scrollTop + 140; let cur = 'outcome';
  for (const [k] of SECTIONS) { const el = document.getElementById(k); if (el && el.offsetTop <= top) cur = k; }
  if (dossier.scrollTop + dossier.clientHeight >= dossier.scrollHeight - 4) cur = 'checkout';
  dossier.querySelectorAll('.jump button').forEach(b => b.classList.toggle('on', b.dataset.jumpto === cur));
}
dossier.addEventListener('scroll', () => { st().scroll = dossier.scrollTop; spy(); });

function push(path, mode) { const s = st(); if (s.stack.at(-1) !== path) s.stack.push(path); if (mode) s.mode[path] = mode; renderSheet(); }
function pop() { const s = st(); s.stack.pop(); renderSheet(); if (!s.stack.length) { renderDossier(); dossier.focus(); } }
async function renderSheet() {
  const s = st(), t = task(), path = s.stack.at(-1);
  sheet.classList.toggle('open', !!path); sheet.setAttribute('aria-hidden', !path);
  if (!path) return;
  const ch = t.changes(), idx = ch.findIndex(c => c.path === path), canDiff = !!diffFor(path) && taskId === 'LOO-515';
  const mode = s.mode[path] = s.mode[path] || (canDiff ? 'diff' : 'read');
  $('.bk').textContent = s.stack.length > 1 ? s.stack.at(-2).split('/').pop() : t.id;
  const parts = path.split('/');
  $('.crumbs').innerHTML = `<span>${t.machineRemote ? '⌁' : '⌂'} ${t.machine}</span><span class="dim">›</span>` + parts.map((p, i) => i === parts.length - 1 ? `<span class="leaf">${esc(p)}</span>` : `<button data-reveal="${parts.slice(0, i + 1).join('/')}">${esc(p)}</button><span class="dim">›</span>`).join('');
  document.querySelectorAll('.mode button').forEach(b => { b.classList.toggle('on', b.dataset.mode === mode); b.disabled = b.dataset.mode === 'diff' && !canDiff; b.style.opacity = b.disabled ? .4 : 1; });
  const c = ch[idx];
  $('.sub').innerHTML = idx >= 0 ? `<span class="st">${c.st === 'M' ? 'Modified' : c.st === 'A' ? 'Added' : 'Deleted'} in this Task · <span style="color:var(--add-ink)">+${c.a}</span> <span style="color:var(--del-ink)">−${c.d}</span></span><span class="spacer" style="flex:1"></span>
      <button class="btn" data-step="-1" ${idx === 0 ? 'disabled' : ''}>‹ prev</button><span>${idx + 1} of ${ch.length} changes</span><button class="btn" data-step="1" ${idx === ch.length - 1 ? 'disabled' : ''}>next ›</button>`
    : `<span>Unchanged in this Task</span><span style="flex:1"></span><kbd>Esc</kbd>&nbsp;back`;
  const body = $('.body'), k = path + ':' + mode;
  body.innerHTML = `<div class="empty"><div class="skeleton" style="width:60%;margin:0 auto"></div></div>`;
  try {
    if (mode === 'diff') body.innerHTML = renderDiff(diffFor(path));
    else { const text = await readFile(t, path); if (st().stack.at(-1) !== path) return; body.innerHTML = path.endsWith('.md') ? `<div class="md">${md(text)}</div>` : renderCode(text); }
  } catch (e) { body.innerHTML = `<div class="err">⚠ ${esc(e.message)} ${canDiff ? '<button class="btn" data-mode="diff">Show its Diff</button>' : ''} <button class="btn" data-act="retry">Retry</button></div>`; }
  body.scrollTop = s.fileScroll[k] || 0; body.onscroll = () => st().fileScroll[k] = body.scrollTop;
  convo.refreshCtx();
}
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-change]'); if (!t) return; const d = t.dataset;
  if (d.jumpto) { const el = document.getElementById(d.jumpto); dossier.scrollTo({ top: el.offsetTop - 118, behavior: 'smooth' }); }
  else if (d.change) push(d.change);
  else if (d.act === 'back') pop();
  else if (d.mode) { st().mode[st().stack.at(-1)] = d.mode; renderSheet(); }
  else if (d.step) { const ch = task().changes(), i = ch.findIndex(c => c.path === st().stack.at(-1)); const s = st(); s.stack[s.stack.length - 1] = ch[i + +d.step].path; renderSheet(); }
  else if (d.reveal) { const s = st(); s.stack = []; renderSheet(); renderDossier(); const el = $('#checkout'); dossier.scrollTo({ top: el.offsetTop - 118 }); tree.reveal(d.reveal); }
  else if (d.acc) { const s = st(), i = +d.acc; s.openAcc.has(i) ? s.openAcc.delete(i) : s.openAcc.add(i); renderDossier(); }
  else if (d.task && !t.closest('.titlebar')) LF.toast(`Opens ${d.task} in its own slot`);
  else if (d.act === 'pr-refresh') LF.toast('Reading GitHub…');
  else if (d.act === 'retry') renderSheet();
  else if (d.act === 'seen') LF.setScen('brief', 'normal');
});
dossier.addEventListener('keydown', e => { const r = e.target.closest('[data-change]'); if (r && e.key === 'Enter') push(r.dataset.change); });
document.addEventListener('keydown', e => {
  if ((e.key === 'Escape' || (e.metaKey && e.key === '[')) && st().stack.length && !e.target.closest('.convo')) { e.preventDefault(); pop(); }
  if (st().stack.length && !e.target.closest('.convo, input') && (e.key === ']' || e.key === '[') && !e.metaKey) { const b = document.querySelector(`[data-step="${e.key === ']' ? 1 : -1}"]`); b && !b.disabled && b.click(); }
  if (e.altKey && e.metaKey) { const k = { Digit1: 'outcome', Digit2: 'acceptance', Digit3: 'pr', Digit4: 'changes', Digit5: 'checkout' }[e.code]; if (k) { e.preventDefault(); if (st().stack.length) { st().stack = []; renderSheet(); } document.querySelector(`[data-jumpto="${k}"]`).click(); } }
});
LF.mountChrome('b', () => taskId, id => { taskId = id; sessionStorage.setItem('b-task', id); convo.render(); renderDossier(); renderSheet(); });
LF.mountScenario('<kbd>⌥⌘1–5</kbd> jump to section · <kbd>Esc</kbd> back from a file · <kbd>[</kbd> <kbd>]</kbd> previous/next change');
LF.onScen(() => { st().tree = LF.treeState(); renderDossier(); renderSheet(); });
convo.render(); renderDossier(); renderSheet();
</script>
</body></html>
