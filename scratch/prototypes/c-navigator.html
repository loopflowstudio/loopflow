<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C · Navigator</title>
<link rel="stylesheet" href="shared.css">
<style>
.strip { flex: none; display: flex; align-items: center; gap: 10px; padding: 7px 14px; border-bottom: 1px solid var(--line); background: var(--surface); white-space: nowrap; overflow: hidden; }
.strip .id { font: 600 12px var(--mono); color: var(--text2); }
.strip .title { font-weight: 700; overflow: hidden; text-overflow: ellipsis; min-width: 80px; flex: 0 1 auto; }
.strip .facts { display: flex; gap: 6px; margin-left: auto; flex: none; }
.details { flex: 1; display: flex; min-width: 420px; background: var(--surface); }
.navcol { width: 250px; flex: none; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.navcol.hidden { display: none; }
.navcol .scroll { flex: 1; overflow: auto; padding: 6px 6px 40px; }
.navcol .group { font-size: 12px; color: var(--text2); font-weight: 700; padding: 10px 6px 3px; display: flex; gap: 6px; }
.navcol .group .dim { font-weight: 400; margin-left: auto; }
.navcol .find { margin: 8px 8px 0; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface2); color: var(--text3); font-size: 12px; display: flex; justify-content: space-between; text-align: left; }
.tnode .sub { margin-left: auto; font-size: 11px; color: var(--text3); }
.viewer { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.vhead { flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--line); min-height: 38px; }
.vhead .crumbs { flex: 1; min-width: 0; display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--text2); overflow: hidden; white-space: nowrap; }
.vhead .crumbs .leaf { color: var(--text); font-weight: 700; }
.vbody { flex: 1; overflow: auto; min-height: 0; }
.vbody .md { padding: 18px 22px 60px; }
.vbody .pad { padding: 16px 16px 60px; display: grid; gap: 14px; align-content: start; max-width: 760px; }
.vbody .err { padding: 24px; color: var(--failure); }
.statusbox { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; max-width: 680px; margin-bottom: 14px; font-size: 13px; }
.palette { position: fixed; inset: 0; background: rgba(0,0,0,.18); display: none; z-index: 40; }
.palette.open { display: block; }
.palette .box { position: absolute; left: 50%; top: 12vh; transform: translateX(-50%); width: min(560px, 92vw); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: 0 16px 48px rgba(0,0,0,.25); overflow: hidden; }
.palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 12px 14px; font: 14px var(--sans); background: none; color: var(--text); outline: 0; }
.palette .res { max-height: 50vh; overflow: auto; padding: 4px; }
.palette .it { display: flex; gap: 8px; padding: 6px 10px; border-radius: 6px; font-size: 13px; align-items: center; }
.palette .it.on { background: var(--sel); }
.palette .it .p { color: var(--text3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-left: auto; max-width: 60%; direction: rtl; }
.palette .foot { padding: 6px 12px; font-size: 11.5px; color: var(--text3); border-top: 1px solid var(--line); }
kbd { font: 11px var(--mono); color: var(--text3); }
.changed-note { font-size: 12px; color: var(--text2); background: var(--surface2); border-radius: 6px; padding: 6px 10px; margin: 0 0 12px; max-width: 680px; display: flex; gap: 8px; }
</style></head>
<body>
<div class="window">
  <div class="titlebar"></div>
  <div class="strip"></div>
  <div class="main">
    <section class="convo" style="flex:0 0 48%"></section>
    <div class="divider"></div>
    <section class="details">
      <aside class="navcol"><button class="find" data-act="palette"><span>Go to file or Task page…</span><kbd>⌘K</kbd></button><div class="scroll"></div></aside>
      <div class="viewer">
        <div class="vhead"><button class="icon-btn" data-act="hist" data-dir="-1" title="Back (⌘[)">‹</button><button class="icon-btn" data-act="hist" data-dir="1" title="Forward (⌘])">›</button>
          <button class="icon-btn" data-act="nav" title="Toggle navigator (⌘\\)">◧</button><div class="crumbs"></div>
          <div class="seg mode"><button data-mode="read">Read</button><button data-mode="diff">Diff</button></div></div>
        <div class="vbody"></div>
      </div>
    </section>
  </div>
</div>
<div class="palette"><div class="box"><input placeholder="Brief, Pull request, or a file name" aria-label="Go to"><div class="res"></div>
  <div class="foot">↑↓ choose · ⏎ open · Esc close. Prototype searches all 1,458 checkout paths; the real reader would need a recursive search on the Task's Machine.</div></div></div>
<script src="repo-data.js"></script><script src="shared.js"></script>
<script>
const { $, esc, TASKS, md, outline, related, renderPRCard, renderChangeRows, readFile, diffFor, renderCode, renderDiff, prHeadline, checksSummary } = LF;
let taskId = sessionStorage.getItem('c-task') || 'LOO-515';
const S = {};
const st = () => S[taskId] = S[taskId] || { doc: 'task:brief', hist: ['task:brief'], hi: 0, tree: LF.treeState(), mode: {}, scroll: {}, nav: true, changesOpen: true, navScroll: 0 };
const task = () => TASKS[taskId];
const vbody = $('.vbody');
const docName = d => d === 'task:brief' ? 'Brief' : d === 'task:pr' ? 'Pull request' : d === 'task:changes' ? 'Changes' : d.split('/').pop();
const convo = LF.mountConvo($('.convo'), task, () => docName(st().doc));
let tree;

function renderStrip() {
  const t = task(), pr = t.pr(), [dot, head] = prHeadline(pr);
  $('.strip').innerHTML = `<span class="id">${t.id}</span><span class="title" title="${esc(t.title)}">${esc(t.title)}</span>
    <div class="facts"><span class="chip"><span class="dot ${t.stateDot}"></span>${t.state}</span>
    <button class="chip" data-open="task:pr"><span class="dot ${dot}"></span>${head}${pr.checks && pr.kind === 'open' ? ' · ' + checksSummary(pr) : ''}${pr.read && !pr.fresh ? ' · stale' : ''}</button>
    <span class="chip">${t.machineRemote ? '⌁' : '⌂'} ${t.machine}</span>${t.due ? `<span class="chip">Due ${t.due}</span>` : ''}</div>`;
}
function renderNav() {
  const t = task(), s = st(), ch = t.changes(), pr = t.pr(), [dot, head] = prHeadline(pr);
  const sel = d => s.doc === d ? ' sel' : '';
  const nav = $('.navcol .scroll');
  nav.innerHTML = `<div class="group">This Task</div><div class="tree">
      <div class="node tnode${sel('task:brief')}" data-open="task:brief" style="padding-left:6px"><span class="caret">≡</span><span class="name">Brief</span>${t.briefChanged() ? '<span class="sub">updated</span>' : ''}</div>
      <div class="node tnode${sel('task:pr')}" data-open="task:pr" style="padding-left:6px"><span class="caret"><span class="dot ${dot}"></span></span><span class="name">${pr.num ? 'Pull request #' + pr.num : 'Pull request'}</span><span class="sub">${pr.kind === 'none' ? 'none' : pr.kind === 'open' ? (pr.fresh ? checksSummary(pr).split(' · ')[0] : 'stale') : pr.kind}</span></div>
      <div class="node tnode${sel('task:changes')}" data-open="task:changes" style="padding-left:6px"><span class="caret" data-act="toggle-changes">${ch.length ? (s.changesOpen ? '▾' : '▸') : ''}</span><span class="name">Changes</span><span class="sub">${ch.length}</span></div>
      ${s.changesOpen ? ch.map(c => `<div class="node${sel(c.path)}" data-open="${c.path}" data-diff="1" style="padding-left:20px" title="${c.path}"><span class="caret"></span><span class="name">${esc(c.path.split('/').pop())}</span><span class="badge ${c.st}">${c.st}</span></div>`).join('') : ''}
    </div>
    ${t.id === 'LOO-515' ? `<div class="group">Scratch</div><div class="tree">${['scratch/loo-515-task-details.md', 'scratch/questions.md'].map(p => `<div class="node${sel(p)}" data-open="${p}" style="padding-left:6px"><span class="caret"></span><span class="name">${p.split('/').pop()}</span></div>`).join('')}</div>` : ''}
    <div class="group">Checkout <span class="dim">${t.machine}</span></div><div id="tree"></div>`;
  tree = LF.mountTree($('#tree'), task, () => st().tree, p => open(p));
  tree.render();
  nav.scrollTop = s.navScroll; nav.onscroll = () => st().navScroll = nav.scrollTop;
  $('.navcol').classList.toggle('hidden', !s.nav);
}
function open(doc, opts = {}) {
  const s = st(); s.scroll[s.doc + ':' + (s.mode[s.doc] || '')] = vbody.scrollTop;
  if (opts.diff) s.mode[doc] = 'diff';
  if (s.doc !== doc && !opts.hist) { s.hist = s.hist.slice(0, s.hi + 1); s.hist.push(doc); s.hi = s.hist.length - 1; }
  s.doc = doc; if (!doc.startsWith('task:')) s.tree.selection = doc;
  renderNav(); renderViewer(); convo.refreshCtx();
}
async function renderViewer() {
  const t = task(), s = st(), doc = s.doc;
  const isTask = doc.startsWith('task:'), canDiff = !isTask && !!diffFor(doc) && taskId === 'LOO-515';
  const mode = isTask ? null : (s.mode[doc] = s.mode[doc] || (canDiff ? 'diff' : 'read'));
  document.querySelectorAll('.mode button').forEach(b => { b.classList.toggle('on', b.dataset.mode === mode); b.disabled = isTask || (b.dataset.mode === 'diff' && !canDiff); b.style.opacity = b.disabled ? .35 : 1; });
  $('.mode').style.visibility = isTask ? 'hidden' : '';
  const parts = isTask ? [t.id, docName(doc)] : [t.machine, t.checkout.split('/').pop(), ...doc.split('/')];
  $('.vhead .crumbs').innerHTML = parts.map((p, i) => i === parts.length - 1 ? `<span class="leaf">${esc(p)}</span>` : `<span>${esc(p)}</span><span class="dim">/</span>`).join('');
  $('.vhead .crumbs').title = isTask ? '' : `${t.machine}:${t.checkout}/${doc}`;
  const k = doc + ':' + (mode || '');
  if (doc === 'task:brief') {
    const text = t.brief(), out = outline(text), rel = related(text);
    vbody.innerHTML = `<div class="md">
      <div class="statusbox"><div><span class="dot ${t.stateDot}"></span> <strong>${t.state}</strong> <span class="sec">· ${esc(t.reason)}</span></div>
        ${rel.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap">${rel.map(id => `<button class="chip" data-task="${id}" title="${esc(LF.KNOWN[id])}"><span class="mono">${id}</span></button>`).join('')}<span class="dim" style="font-size:12px">related</span></div>` : ''}</div>
      ${t.briefChanged() ? `<div class="changed-note">Brief updated since you last read it · Acceptance heading changed <button class="btn" style="margin-left:auto" data-act="seen">Got it</button></div>` : ''}
      ${text ? md(text) : `<div class="empty">No brief recorded for ${t.id}.<br>Write one with <span class="mono">lf task edit ${t.id}</span>.</div>`}</div>`;
  } else if (doc === 'task:pr') vbody.innerHTML = `<div class="pad">${renderPRCard(t)}</div>`;
  else if (doc === 'task:changes') vbody.innerHTML = `<div class="pad">${renderChangeRows(t, null)}</div>`;
  else {
    vbody.innerHTML = `<div class="empty"><div class="skeleton" style="width:60%;margin:0 auto"></div></div>`;
    try {
      if (mode === 'diff') vbody.innerHTML = renderDiff(diffFor(doc));
      else { const text = await readFile(t, doc); if (st().doc !== doc) return; vbody.innerHTML = doc.endsWith('.md') ? `<div class="md">${md(text)}</div>` : renderCode(text); }
    } catch (e) { vbody.innerHTML = `<div class="err">⚠ ${esc(e.message)} ${canDiff ? '<button class="btn" data-mode="diff">Show its Diff</button>' : ''} <button class="btn" data-act="retry">Retry</button></div>`; }
  }
  vbody.scrollTop = s.scroll[k] || 0;
}
vbody.addEventListener('scroll', () => { const s = st(); s.scroll[s.doc + ':' + (s.mode[s.doc] || '')] = vbody.scrollTop; });

// palette
const pal = $('.palette'), pin = $('.palette input'), res = $('.palette .res'); let items = [], pi = 0;
function openPalette() { pal.classList.add('open'); pin.value = ''; search(); pin.focus(); }
function search() {
  const q = pin.value.toLowerCase().trim(), t = task();
  const base = [['task:brief', 'Brief', t.id], ['task:pr', 'Pull request', t.id], ['task:changes', 'Changes', t.id], ...t.changes().map(c => [c.path, c.path.split('/').pop(), 'changed · ' + c.path])];
  const all = q ? REPO_PATHS.filter(p => p.toLowerCase().includes(q)).sort((a, b) => a.split('/').pop().toLowerCase().indexOf(q) < 0 ? 1 : a.length - b.length).slice(0, 40).map(p => [p, p.split('/').pop(), p]) : [];
  items = (q ? base.filter(b => b[1].toLowerCase().includes(q)) : base).concat(all.filter(a => !base.some(b => b[0] === a[0]))).slice(0, 40); pi = 0; draw();
}
function draw() { res.innerHTML = items.map((it, i) => `<div class="it${i === pi ? ' on' : ''}" data-pick="${i}"><span>${esc(it[1])}</span><span class="p">${esc(it[2])}</span></div>`).join('') || '<div class="empty">No match</div>'; const on = res.querySelector('.on'); on && on.scrollIntoView({ block: 'nearest' }); }
pin.addEventListener('input', search);
pin.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { pi = Math.min(pi + 1, items.length - 1); draw(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { pi = Math.max(pi - 1, 0); draw(); e.preventDefault(); }
  else if (e.key === 'Enter' && items[pi]) { pick(pi); }
  else if (e.key === 'Escape') pal.classList.remove('open');
});
function pick(i) { const d = items[i][0]; pal.classList.remove('open'); open(d); if (!d.startsWith('task:')) tree.reveal(d); }
pal.addEventListener('click', e => { const p = e.target.closest('[data-pick]'); if (p) pick(+p.dataset.pick); else if (e.target === pal) pal.classList.remove('open'); });

document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-open],[data-change]'); if (!t || t.closest('.palette')) return; const d = t.dataset;
  if (e.target.closest('[data-act="toggle-changes"]')) { st().changesOpen = !st().changesOpen; renderNav(); return; }
  if (d.open) { open(d.open, { diff: !!d.diff }); if (t.closest('.strip')) {} }
  else if (d.change) { open(d.change, { diff: true }); tree.reveal(d.change); }
  else if (d.mode) { const s = st(); s.mode[s.doc] = d.mode; renderViewer(); }
  else if (d.act === 'palette') openPalette();
  else if (d.act === 'nav') { st().nav = !st().nav; renderNav(); }
  else if (d.act === 'hist') hist(+d.dir);
  else if (d.task && !t.closest('.titlebar')) LF.toast(`Opens ${d.task} in its own slot`);
  else if (d.act === 'pr-refresh') LF.toast('Reading GitHub…');
  else if (d.act === 'retry') renderViewer();
  else if (d.act === 'seen') LF.setScen('brief', 'normal');
});
vbody.addEventListener('keydown', e => { const r = e.target.closest('[data-change]'); if (r && e.key === 'Enter') open(r.dataset.change, { diff: true }); });
function hist(dir) { const s = st(); const n = s.hi + dir; if (n < 0 || n >= s.hist.length) return; s.hi = n; open(s.hist[n], { hist: true }); }
document.addEventListener('keydown', e => {
  if (e.metaKey && e.key === 'k') { e.preventDefault(); openPalette(); }
  if (e.metaKey && e.key === '\\') { e.preventDefault(); st().nav = !st().nav; renderNav(); }
  if (e.metaKey && (e.key === '[' || e.key === ']') && !e.target.closest('input')) { e.preventDefault(); hist(e.key === ']' ? 1 : -1); }
});
LF.mountChrome('c', () => taskId, id => { taskId = id; sessionStorage.setItem('c-task', id); convo.render(); renderStrip(); renderNav(); renderViewer(); });
LF.mountScenario('<kbd>⌘K</kbd> go to · <kbd>⌘[</kbd> <kbd>⌘]</kbd> back/forward · <kbd>⌘\\</kbd> navigator · arrows in the tree');
LF.onScen(() => { st().tree = LF.treeState(); renderStrip(); renderNav(); renderViewer(); });
convo.render(); renderStrip(); renderNav(); renderViewer();
</script>
</body></html>
