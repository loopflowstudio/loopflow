<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>loopflow</title>
<style>
@font-face{font-family:Lato;src:url('../../swift/Loopflow/Fonts/Lato-Regular.ttf')}
@font-face{font-family:Lato;src:url('../../swift/Loopflow/Fonts/Lato-Bold.ttf');font-weight:700}
@font-face{font-family:Mono;src:url('../../swift/Loopflow/Fonts/JetBrainsMono-Regular.ttf')}

/* Loopflow Light / Dark tokens, from swift/Loopflow/Themes/Catalogue */
:root,[data-theme="light"]{
  --bg:#faf8f5;--surface:#fffdf9;--muted-surface:#f3eee7;--element:#ece6dd;
  --border:#e6dfd6;--border-strong:#d6ccc0;--text:#2a2624;--text2:#5f5752;--text3:#685f58;
  --accent:#722f37;--accent-hover:#5e2630;--accent-text:#faf8f5;--accent-ink:#722f37;
  --working:#3269aa;--working-fill:#eaedf0;--waiting:#87601b;--waiting-fill:#f4eee4;
  --success:#3b734c;--failure:#b0443b;--stopped:#5f5752;
  --term-bg:#faf8f5;--term-fg:#2a2624;--t-red:#a02e25;--t-green:#31633e;--t-yellow:#79520d;--t-blue:#24579e;--t-magenta:#722f37;--t-cyan:#246568;--t-dim:#685f58;
  --titlebar:#722f37;--titlebar-text:#faf8f5;--titlebar-dim:#ebdcd8;
  --shadow:0 18px 50px #3a2a1a1c;
}
[data-theme="dark"]{
  --bg:#2b3036;--surface:#343b44;--muted-surface:#30363d;--element:#444e59;
  --border:#46505b;--border-strong:#56606b;--text:#f5f1ea;--text2:#c8c1b8;--text3:#a79f97;
  --accent:#722f37;--accent-hover:#5e2630;--accent-text:#faf8f5;--accent-ink:#cebfa9;
  --working:#a5c0e1;--working-fill:#2c3541;--waiting:#d3bb8e;--waiting-fill:#353634;
  --success:#a7c5af;--failure:#e3b2ae;--stopped:#c8c1b8;
  --term-bg:#2b3036;--term-fg:#f5f1ea;--t-red:#d4756a;--t-green:#8b9a6b;--t-yellow:#d4a574;--t-blue:#7b8fa8;--t-magenta:#a67b93;--t-cyan:#7fafaf;--t-dim:#7f766f;
  --titlebar:#262b31;--titlebar-text:#f5f1ea;--titlebar-dim:#c8c1b8;
  --shadow:0 18px 50px #00000055;
}

*{box-sizing:border-box}
html,body{margin:0}
body{font:13px/1.45 Lato,system-ui,sans-serif;background:#e4ded5;color:#2a2624;min-height:100vh}
body.dark-page{background:#1f2328;color:#f5f1ea}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0;text-align:left}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:Mono,ui-monospace,monospace}

/* ---------- study chrome (not proposed app UI) ---------- */
.study{max-width:1240px;margin:0 auto;padding:18px 20px 30px}
.study-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12px}
.study-bar .label{font-weight:700;margin-right:6px}
.study-bar .seg{display:flex;background:#00000010;border-radius:7px;padding:2px}
.dark-page .study-bar .seg{background:#ffffff14}
.study-bar .seg button{padding:5px 11px;border-radius:5px;white-space:nowrap}
.study-bar .seg button[aria-pressed="true"]{background:#fffdf9;box-shadow:0 1px 2px #0002}
.dark-page .study-bar .seg button[aria-pressed="true"]{background:#444e59}
.study-bar .spacer{flex:1}
.thesis{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin:14px 2px 16px;font-size:12.5px}
.thesis h1{font-size:20px;margin:0 0 4px;letter-spacing:-.2px}
.thesis p{margin:0;opacity:.8}
.thesis ul{margin:0;padding-left:16px;opacity:.85}
.thesis li{margin:2px 0}
.try{margin-top:12px;font-size:11.5px;opacity:.65}
.try kbd{font:10.5px Mono,monospace;border:1px solid currentColor;border-radius:3px;padding:0 4px;opacity:.8}
@media(max-width:820px){.thesis{grid-template-columns:1fr}}

/* ---------- window ---------- */
.win{background:var(--bg);color:var(--text);border-radius:11px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border-strong);display:flex;flex-direction:column;height:min(720px,calc(100vh - 190px));min-height:520px;position:relative}
.traffic{display:flex;gap:8px;flex:none}
.traffic i{width:12px;height:12px;border-radius:50%;background:#ec6a5e}
.traffic i:nth-child(2){background:#f4bf4f}.traffic i:nth-child(3){background:#61c554}
.icon-btn{width:28px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:inherit;opacity:.75;flex:none}
.icon-btn:hover{opacity:1;background:color-mix(in srgb,currentColor 10%,transparent)}
.icon-btn:disabled{opacity:.3;cursor:default;background:none}
.body{flex:1;display:flex;min-height:0}
.side{flex:none;display:flex;flex-direction:column;min-height:0;overflow:hidden;transition:width .16s ease}
.side-scroll{flex:1;overflow-y:auto;min-height:0}
.center{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--term-bg)}

/* ---------- terminal ---------- */
.term{flex:1;overflow:auto;padding:14px 18px;font:12px/1.6 Mono,ui-monospace,monospace;color:var(--term-fg);white-space:pre-wrap;word-break:break-word}
.term .dim{color:var(--t-dim)}.term .red{color:var(--t-red)}.term .green{color:var(--t-green)}.term .yellow{color:var(--t-yellow)}
.term .blue{color:var(--t-blue)}.term .mag{color:var(--t-magenta)}.term .cyan{color:var(--t-cyan)}.term b{font-weight:700}
.term .box{border:1px solid var(--border-strong);border-radius:4px;padding:6px 10px;margin:10px 0 0;display:block}
.term .cursor{display:inline-block;width:7px;height:14px;background:var(--term-fg);vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.term-input{outline:none;caret-color:transparent}

/* status glyphs shared */
.st{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
.st.available{background:var(--waiting)}
.st.running{background:var(--working)}
.st.idle{background:transparent;border:1.5px solid var(--text3);opacity:.7}
.spin{display:inline-block;width:10px;color:var(--working);font-family:Mono,monospace}

/* ---------- palette ---------- */
.palette-scrim{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 30%,#0000004d);display:none;z-index:20}
.palette-scrim.open{display:block}
.palette{position:absolute;left:50%;top:64px;transform:translateX(-50%);width:min(560px,calc(100% - 32px));background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;box-shadow:0 24px 60px #0000003a;overflow:hidden;color:var(--text)}
.palette input{width:100%;border:0;border-bottom:1px solid var(--border);background:transparent;padding:13px 16px;font-size:15px;outline:none}
:is(.palette,.omni-drop) .results{max-height:360px;overflow:auto;padding:6px}
:is(.palette,.omni-drop) .group{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--text3);padding:8px 10px 4px}
:is(.palette,.omni-drop) .item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:6px;font-size:13px}
:is(.palette,.omni-drop) .item .k{font:11px Mono,monospace;color:var(--text3);min-width:62px}
:is(.palette,.omni-drop) .item .r{margin-left:auto;font-size:11px;color:var(--text3)}
:is(.palette,.omni-drop) .item.hl{background:var(--element)}
.palette .foot{display:flex;gap:14px;padding:7px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--text3)}

.toast{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:7px 13px;border-radius:7px;font-size:12px;opacity:0;transition:opacity .15s;pointer-events:none;z-index:30}
.toast.show{opacity:1}

/* =====================================================================
   A — ADDRESS BAR: burgundy titlebar, one omnibox that is breadcrumb,
   search and repo switcher at once. Quiet paper sidebar.
   ===================================================================== */
[data-v="a"] .titlebar{height:44px;display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--titlebar);color:var(--titlebar-text);flex:none}
[data-v="a"] .titlebar .traffic{margin-right:8px}
[data-v="a"] .omni{flex:1;max-width:620px;margin:0 auto;height:28px;display:flex;align-items:center;gap:2px;padding:0 4px 0 10px;border-radius:7px;background:color-mix(in srgb,var(--titlebar-text) 13%,transparent);cursor:text;min-width:0;position:relative}
[data-v="a"] .omni:hover{background:color-mix(in srgb,var(--titlebar-text) 18%,transparent)}
[data-v="a"] .omni .seg{padding:2px 6px;border-radius:4px;white-space:nowrap;font-size:12.5px;color:var(--titlebar-dim);cursor:pointer}
[data-v="a"] .omni .seg:hover{background:color-mix(in srgb,var(--titlebar-text) 16%,transparent);color:var(--titlebar-text)}
[data-v="a"] .omni .seg.repo{font-weight:700;color:var(--titlebar-text)}
[data-v="a"] .omni .seg.cur{color:var(--titlebar-text);overflow:hidden;text-overflow:ellipsis;min-width:0}
[data-v="a"] .omni .sep{opacity:.45;font-size:11px}
[data-v="a"] .omni kbd{margin-left:auto;font:10.5px Mono,monospace;opacity:.6;padding:0 6px;flex:none}
[data-v="a"] .omni input{flex:1;background:transparent;border:0;outline:none;color:var(--titlebar-text);font-size:13px;min-width:0}
[data-v="a"] .omni input::placeholder{color:var(--titlebar-dim);opacity:.8}
[data-v="a"] .titlebar .right{display:flex;gap:2px;margin-left:8px}
[data-v="a"] .side{width:236px;background:var(--muted-surface);border-right:1px solid var(--border)}
[data-v="a"] .side.collapsed{width:0;border-right:0}
[data-v="a"] .side-scroll{padding:10px 8px 16px}
[data-v="a"] .sec{display:flex;align-items:baseline;justify-content:space-between;padding:8px 10px 6px;font-size:11.5px;color:var(--text3)}
[data-v="a"] .sec b{font-weight:700;color:var(--text2)}
[data-v="a"] .row{display:block;width:100%;padding:9px 10px 10px;border-radius:7px;border:1px solid transparent;margin-bottom:2px}
[data-v="a"] .row:hover{background:color-mix(in srgb,var(--element) 60%,transparent)}
[data-v="a"] .row.sel{background:var(--surface);border-color:var(--border);box-shadow:0 1px 2px #0000000d}
[data-v="a"] .row .t{font-size:13px;line-height:1.35;color:var(--text)}
[data-v="a"] .row .t .id{color:var(--text3);font-family:Mono,monospace;font-size:11px;margin-right:5px}
[data-v="a"] .row .d{font-size:12px;color:var(--text2);margin-top:3px}
[data-v="a"] .row .m{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:11px;color:var(--text3)}
[data-v="a"] .row .m .avail{color:var(--waiting)}
[data-v="a"] .row .m .run{color:var(--working)}
[data-v="a"] .wave{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:6px;font-size:13px;color:var(--text2)}
[data-v="a"] .wave:hover{background:color-mix(in srgb,var(--element) 60%,transparent)}
[data-v="a"] .wave.sel{background:var(--surface);color:var(--text)}
[data-v="a"] .wave .n{margin-left:auto;font:11px Mono,monospace;color:var(--text3)}
[data-v="a"] .omni-drop{position:absolute;left:0;right:0;top:32px;background:var(--surface);color:var(--text);border:1px solid var(--border-strong);border-radius:9px;box-shadow:0 20px 50px #00000038;overflow:hidden;z-index:25;display:none}
[data-v="a"] .omni-drop.open{display:block}
[data-v="a"] .omni-drop .results{max-height:380px;overflow:auto;padding:6px}

/* =====================================================================
   B — MARGIN: one continuous paper surface, no colored chrome.
   Hanging mono ID gutter; collapse leaves the gutter as the rail.
   ===================================================================== */
[data-v="b"] .body{background:var(--bg)}
[data-v="b"] .side{width:244px;border-right:1px solid var(--border);background:var(--bg)}
[data-v="b"] .side.collapsed{width:58px}
[data-v="b"] .side-top{height:46px;display:flex;align-items:center;padding:0 10px 0 14px;gap:8px;flex:none}
[data-v="b"] .side-top .icon-btn{margin-left:auto}
[data-v="b"] .side.collapsed .side-top .traffic{display:none}
[data-v="b"] .side.collapsed .side-top{padding:0;justify-content:center}
[data-v="b"] .side.collapsed .side-top .icon-btn{margin:0}
[data-v="b"] .repo{display:flex;align-items:center;gap:6px;margin:4px 8px 10px;padding:6px 8px;border-radius:6px;width:calc(100% - 16px);font-weight:700;font-size:14px}
[data-v="b"] .repo:hover{background:var(--element)}
[data-v="b"] .repo .chev{font-weight:400;color:var(--text3);font-size:11px}
[data-v="b"] .repo kbd{margin-left:auto;font:10.5px Mono,monospace;color:var(--text3);font-weight:400}
[data-v="b"] .side.collapsed .repo{justify-content:center;margin:4px 6px 10px;width:calc(100% - 12px);padding:6px 0}
[data-v="b"] .side.collapsed .repo .full{display:none}
[data-v="b"] .sec{font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--text3);padding:10px 16px 6px 58px}
[data-v="b"] .side.collapsed .sec{padding:12px 0 4px;text-align:center;font-size:0}
[data-v="b"] .side.collapsed .sec::after{content:"";display:block;margin:0 auto;width:18px;border-top:1px solid var(--border-strong)}
[data-v="b"] .row{display:grid;grid-template-columns:58px 1fr;width:100%;padding:8px 14px 9px 0;position:relative}
[data-v="b"] .row:hover .t{color:var(--text)}
[data-v="b"] .row:hover{background:color-mix(in srgb,var(--element) 45%,transparent)}
[data-v="b"] .row .g{font:11px/18px Mono,monospace;color:var(--text3);text-align:right;padding-right:12px;display:flex;justify-content:flex-end;align-items:center;gap:5px;height:18px}
[data-v="b"] .row .t{font-size:13px;line-height:18px;color:var(--text2)}
[data-v="b"] .row .d{font-size:11.5px;color:var(--text3);margin-top:2px;line-height:1.35}
[data-v="b"] .row.sel::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;background:var(--accent);border-radius:0 2px 2px 0}
[data-theme="dark"][data-v="b"] .row.sel::before,[data-theme="dark"] [data-v="b"] .row.sel::before{background:var(--accent-ink)}
[data-v="b"] .row.sel .t{color:var(--text);font-weight:700}
[data-v="b"] .row.sel .g{color:var(--accent-ink)}
[data-v="b"] .side.collapsed .row{grid-template-columns:58px;padding-right:0}
[data-v="b"] .side.collapsed .row .g{padding-right:0;justify-content:center}
[data-v="b"] .side.collapsed .row .txt{display:none}
[data-v="b"] .wave{display:grid;grid-template-columns:58px 1fr auto;align-items:center;width:100%;padding:6px 16px 6px 0;font-size:13px;color:var(--text2)}
[data-v="b"] .wave:hover{background:color-mix(in srgb,var(--element) 45%,transparent)}
[data-v="b"] .wave .g{text-align:right;padding-right:12px;color:var(--text3);font-size:11px}
[data-v="b"] .wave .n{font:11px Mono,monospace;color:var(--text3)}
[data-v="b"] .wave.sel{color:var(--text);font-weight:700}
[data-v="b"] .side.collapsed .wave{grid-template-columns:58px;padding-right:0}
[data-v="b"] .side.collapsed .wave .g{text-align:center;padding:0;font:11px Mono,monospace}
[data-v="b"] .side.collapsed .wave .lbl,[data-v="b"] .side.collapsed .wave .n{display:none}
[data-v="b"] .pane-head{height:46px;display:flex;align-items:center;gap:4px;padding:0 10px 0 12px;border-bottom:1px solid var(--border);flex:none;background:var(--bg)}
[data-v="b"] .crumbs{display:flex;align-items:center;gap:2px;min-width:0;font-size:12.5px;color:var(--text3);margin-left:6px}
[data-v="b"] .crumbs button{padding:3px 6px;border-radius:5px;white-space:nowrap}
[data-v="b"] .crumbs button:hover{background:var(--element);color:var(--text)}
[data-v="b"] .crumbs .cur{color:var(--text);overflow:hidden;text-overflow:ellipsis;min-width:0}
[data-v="b"] .crumbs .sep{opacity:.5}
[data-v="b"] .pane-head .meta{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--text3);white-space:nowrap}
[data-v="b"] .center{border-left:0}

/* =====================================================================
   C — CONSOLE: cmux density. Thin chrome, live agent tail in each row,
   status as a left bar, Waves as a footer line. Breadcrumbs live on the pane.
   ===================================================================== */
[data-v="c"] .titlebar{height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--muted-surface);border-bottom:1px solid var(--border);flex:none;font-size:12px}
[data-theme="dark"] [data-v="c"] .titlebar,[data-v="c"][data-theme="dark"] .titlebar{background:#262b31}
[data-v="c"] .titlebar .traffic i{width:11px;height:11px}
[data-v="c"] .titlebar .repo{display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:5px;font-weight:700;margin-left:6px}
[data-v="c"] .titlebar .repo:hover{background:var(--element)}
[data-v="c"] .titlebar .repo .chev{font-weight:400;color:var(--text3);font-size:10px}
[data-v="c"] .titlebar .hint{margin-left:auto;font:10.5px Mono,monospace;color:var(--text3);padding:3px 8px;border-radius:5px}
[data-v="c"] .titlebar .hint:hover{background:var(--element);color:var(--text)}
[data-v="c"] .side{width:252px;background:var(--muted-surface);border-right:1px solid var(--border)}
[data-theme="dark"] [data-v="c"] .side,[data-v="c"][data-theme="dark"] .side{background:#262b31}
[data-v="c"] .side.collapsed{width:0;border-right:0}
[data-v="c"] .side-scroll{padding:6px 6px 10px}
[data-v="c"] .row{display:block;width:100%;padding:7px 9px 8px 12px;border-radius:5px;position:relative;margin-bottom:1px}
[data-v="c"] .row::before{content:"";position:absolute;left:3px;top:8px;bottom:8px;width:3px;border-radius:2px;background:transparent}
[data-v="c"] .row.available::before{background:var(--waiting)}
[data-v="c"] .row.running::before{background:var(--working)}
[data-v="c"] .row:hover{background:color-mix(in srgb,var(--element) 55%,transparent)}
[data-v="c"] .row.sel{background:var(--element)}
[data-v="c"] .row .t{font-size:12.5px;font-weight:700;line-height:1.3}
[data-v="c"] .row .tail{font:11px/1.45 Mono,monospace;color:var(--text2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
[data-v="c"] .row .m{display:flex;gap:8px;margin-top:4px;font:10.5px Mono,monospace;color:var(--text3);flex-wrap:wrap}
[data-v="c"] .row .m .pr-ok{color:var(--success)}
[data-v="c"] .row .m .pr-open{color:var(--text2)}
[data-v="c"] .row .m .avail{color:var(--waiting)}
[data-v="c"] .waves-foot{flex:none;border-top:1px solid var(--border);padding:7px 8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
[data-v="c"] .waves-foot .lbl{font:10px Mono,monospace;color:var(--text3);margin:0 4px 0 2px;letter-spacing:.5px}
[data-v="c"] .waves-foot button{font-size:11.5px;padding:3px 8px;border-radius:4px;color:var(--text2);border:1px solid var(--border)}
[data-v="c"] .waves-foot button:hover{background:var(--element)}
[data-v="c"] .waves-foot button.sel{background:var(--text);color:var(--bg);border-color:var(--text)}
[data-v="c"] .waves-foot .n{font:10px Mono,monospace;opacity:.6;margin-left:3px}
[data-v="c"] .pane-head{height:30px;display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--border);flex:none;font:11.5px Mono,monospace;color:var(--text3);background:var(--term-bg)}
[data-v="c"] .pane-head .crumb{padding:2px 5px;border-radius:4px;white-space:nowrap}
[data-v="c"] .pane-head .crumb:hover{background:var(--element);color:var(--text)}
[data-v="c"] .pane-head .crumb.cur{color:var(--text)}
[data-v="c"] .pane-head .meta{margin-left:auto;white-space:nowrap;display:flex;gap:10px;align-items:center}
[data-v="c"] .pane-head .icon-btn{width:24px;height:22px}
[data-v="c"] .scope-label{font:10px Mono,monospace;letter-spacing:.5px;color:var(--text3);padding:6px 10px 4px 12px;display:flex;justify-content:space-between}

/* wave overview (all variants) */
.overview{flex:1;overflow:auto;padding:22px 26px;background:var(--bg)}
.overview h2{margin:0 0 4px;font-size:18px}
.overview p{margin:0 0 16px;color:var(--text3);font-size:12.5px}
.overview .orow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 6px;border-bottom:1px solid var(--border);font-size:13px}
.overview .orow:hover{background:var(--muted-surface)}
.overview .orow .k{font:11px Mono,monospace;color:var(--text3);width:64px}
.overview .orow .s{margin-left:auto;font-size:11.5px;color:var(--text3)}
</style>
</head>
<body>
<div class="study">
  <div class="study-bar">
    <span class="label">Redesign studies</span>
    <div class="seg" id="variant-seg" role="group" aria-label="Redesign">
      <button data-v="a">A · Address bar</button>
      <button data-v="b">B · Margin</button>
      <button data-v="c">C · Console</button>
    </div>
    <span class="spacer"></span>
    <div class="seg" id="theme-seg" role="group" aria-label="Theme">
      <button data-t="light">Loopflow Light</button>
      <button data-t="dark">Loopflow Dark</button>
    </div>
  </div>
  <div class="thesis" id="thesis"></div>
  <div id="win-host"></div>
  <div class="try">Try: click Tasks and Waves · <kbd>⌘K</kbd> search, switch repo, or choose what the sidebar shows · <kbd>⌘\</kbd> toggle sidebar · <kbd>⌘[</kbd> <kbd>⌘]</kbd> back/forward. Sample work; nothing runs.</div>
</div>

<script>
// ---------- sample work ----------
const REPOS = {
  loopflow: {
    waves: [{id:'product',name:'Product'},{id:'infrastructure',name:'Infrastructure'}],
    tasks: [
      {id:'489',title:'Make navigation feel like home',wave:'product',state:'available',detail:'Choose the sidebar direction',agent:'codex',time:'4m',branch:'loo-489-navigation',pr:null,
       tail:'Three redesigns are ready. Which direction should the native sidebar take?',
       prompt:'Let’s compare the navigation options before we build.',
       work:[['read','scratch/navigation-studies/README.md'],['read','swift/LoopflowMac/Views/WorkNavigator.swift'],['run','node --test model.test.cjs','5 passed']],
       reply:'Three redesigns are ready for review. Each keeps one selected workspace and the Tasks-then-Waves sidebar; they differ in where the navigator lives and how much the chrome speaks.',
       ask:'Which direction should the native sidebar take?'},
      {id:'499',title:'Make conversations easy to continue',wave:'product',state:'available',detail:'Review the opening interaction',agent:'claude',time:'12m',branch:'loo-499-opening',pr:'#1591',prState:'open',
       tail:'Opening a Task now reveals its existing conversation. Approve the fresh-start action?',
       prompt:'Make it obvious which conversation I am continuing.',
       work:[['read','rust/loopflow/src/lf/commands/session.rs'],['edit','swift/LoopflowMac/Views/SessionsView.swift','+41 −18'],['run','cargo test session::open','14 passed']],
       reply:'Opening a Task now reveals its existing conversation. Starting a fresh one is a separate, explicit action.',
       ask:'Should “New conversation” live in the Task’s action menu or the pane header?'},
      {id:'505',title:'Allow Tasks without a Wave',wave:'product',state:'running',detail:'Tracing Task ownership',agent:'codex',time:'now',branch:'loo-505-waveless',pr:null,
       tail:'Reading rust/loopflow/src/work/mod.rs — 6 call sites still require a Wave',
       prompt:'A Task can have one home, or no Wave yet.',
       work:[['grep','wave_id.expect','6 matches'],['read','rust/loopflow/src/work/mod.rs']],
       reply:null},
      {id:'416',title:'Keep Sessions across app restart',wave:'infrastructure',state:'running',detail:'Checking reattachment',agent:'codex',time:'now',branch:'loo-416-retain',pr:'#1588',prState:'checks',
       tail:'cargo test session::reattach — 12 passed; verifying pane + draft return together',
       prompt:'Returning should feel exactly like leaving it.',
       work:[['read','rust/loopflow/src/session/attach.rs'],['run','cargo test session::reattach','12 passed'],['edit','swift/Loopflow/Services/WorkObservation.swift','+12 −3']],
       reply:null},
      {id:'497',title:'Compose custom workspaces',wave:'product',state:'idle',detail:'Dashboard + grid + API',agent:'claude',time:'1h',branch:'loo-497-dashboards',pr:null,
       tail:'Paused after kickoff. Navigation lands first in LOO-489.',
       prompt:'Keep navigation separate from custom composition.',
       work:[['read','scratch/dashboard-design.md']],
       reply:'This Task owns custom dashboards, multi-work grids and the API. It can resume once LOO-489 lands.'},
      {id:'503',title:'Keep repair running through merge',wave:'infrastructure',state:'available',detail:'Choose retry behavior',agent:'codex',time:'8m',branch:'loo-503-repair',pr:'#1586',prState:'passing',
       tail:'Two retry boundaries possible: after rebase, or after gate. Pick one.',
       prompt:'Keep the repair going until it can land.',
       work:[['run','lf sync --continue','merged'],['run','cargo test flow::repair','9 passed']],
       reply:'The interrupted repair is isolated. Two retry boundaries are reasonable.',
       ask:'Retry after rebase, or after gate?'},
    ],
    extra: [
      {id:'330',title:'Give Waves a clearer structure',wave:'product',state:'idle',detail:'Design notes saved',agent:'claude',time:'2h',branch:'loo-330-waves',pr:null,tail:'Design notes saved.',prompt:'Keep the hierarchy understandable.',work:[],reply:'Notes saved.'},
      {id:'504',title:'Bring OpenCode to parity',wave:'infrastructure',state:'running',detail:'Running provider checks',agent:'opencode',time:'now',branch:'loo-504-opencode',pr:null,tail:'smoke: 7/11 providers checks passing',prompt:'Prove the same workflow across providers.',work:[['run','lf smoke --provider opencode','7/11']],reply:null},
    ],
  },
  fieldnotes: {
    waves: [{id:'editor',name:'Editor'},{id:'sharing',name:'Sharing'}],
    tasks: [
      {id:'101',title:'Make offline notes reliable',wave:'editor',state:'available',detail:'Review conflict resolution',agent:'codex',time:'3m',branch:'fn-101-offline',pr:null,tail:'Two conflicting paragraphs need a decision before sync.',prompt:'Keep my notes intact when I reconnect.',work:[['run','npm test sync','31 passed']],reply:'Offline edits are preserved.',ask:'Keep both paragraphs, or the newer one?'},
      {id:'102',title:'Speed up full-text search',wave:'editor',state:'running',detail:'Measuring index updates',agent:'claude',time:'now',branch:'fn-102-search',pr:null,tail:'bench: incremental index 38ms p95 (was 410ms)',prompt:'Search should keep up as the notebook grows.',work:[['run','npm run bench','running']],reply:null},
    ],
    extra: [],
  },
};
const PREFIX = {loopflow:'LOO', fieldnotes:'FN'};
for (const [repo, r] of Object.entries(REPOS)) for (const t of [...r.tasks, ...r.extra]) { t.repo = repo; t.key = `${PREFIX[repo]}-${t.id}`; }

const THESES = {
  a: {name:'Address bar', line:'The breadcrumb is the search field.',
      body:'Burgundy lives only in the titlebar, as you suggested. Inside it is one omnibox: <b>loopflow › Infrastructure › LOO-416</b>. Click a segment to go there; click the empty part or press ⌘K and it becomes a query with results dropping down underneath, like Safari or Arc. Repo switching, search and “what the sidebar shows” are all typed or picked here, so nothing else in the window does those jobs.',
      bets:['Removes the separate search button: breadcrumb, repo menu and ⌘K are one control','Sidebar is quiet paper; the selected row is a raised card, not a colored fill','Collapsing hides the sidebar entirely; the omnibox still reaches everything','Risk: an editable titlebar is unusual on macOS; double-click-to-zoom on the titlebar needs care']},
  b: {name:'Margin', line:'No colored chrome. Typography carries everything.',
      body:'One continuous paper surface, like a Notion page. The repo name sits at the top of the sidebar (and is the ⌘K target). Task IDs hang in a mono gutter and wrapped titles sit beside them. Selection is a 2px burgundy rule plus weight. When you collapse the sidebar, the gutter stays as a 58px rail of IDs and status, so collapse costs almost no horizontal space and you can still switch Tasks.',
      bets:['Burgundy is used as ink, not as a surface: the selection rule, the selected ID, and nothing else','Breadcrumbs and back/forward move onto the pane, above the terminal: they describe the work, not the window','The collapsed rail falls out of the layout instead of being a second design','Risk: with so little chrome, attention (Available) has to come from the status glyph alone']},
  c: {name:'Console', line:'cmux density. Every row shows what the agent is doing right now.',
      body:'The thinnest chrome: a 32px titlebar with just the repo name. Each sidebar row shows the Task title, the agent’s last line in mono, and branch · PR · age. Status is a colored bar on the row’s left edge, so you can tell what needs you without reading. Waves collapse into a single footer line of chips. Breadcrumbs move to a mono path on the terminal pane.',
      bets:['The sidebar answers “what is everyone doing?” without opening anything, which is the cmux strength','Waves are filters on the list, not sections: clicking one scopes the sidebar and opens its overview','Designed dark-first; light keeps the same structure','Risk: live tails make the sidebar move; rows must never reorder as text updates']},
};

// ---------- state ----------
const params = new URLSearchParams(location.search);
const S = {
  v: params.get('v') || 'a',
  theme: params.get('theme') || 'light',
  repo: 'loopflow',
  route: {kind:'task', id:'416'},
  back: [], fwd: [],
  collapsed: params.get('side') === '0',
  scope: 'working',            // working | available | running | wave:<id>
  palette: false, query: '', hl: 0,
  frame: 0,
};
const repoData = () => REPOS[S.repo];
const allTasks = (repo=S.repo) => [...REPOS[repo].tasks, ...REPOS[repo].extra];
const findTask = id => allTasks().find(t => t.id === id);
const waveName = id => repoData().waves.find(w => w.id === id)?.name ?? id;

function sidebarTasks() {
  const r = repoData();
  if (S.scope === 'working') return r.tasks;
  if (S.scope === 'available') return allTasks().filter(t => t.state === 'available');
  if (S.scope === 'running') return allTasks().filter(t => t.state === 'running');
  if (S.scope.startsWith('wave:')) return allTasks().filter(t => t.wave === S.scope.slice(5));
  return r.tasks;
}
const scopeLabel = () => ({working:'Working tasks',available:'Available',running:'Running'})[S.scope] ?? waveName(S.scope.slice(5));

function go(route, {record=true}={}) {
  if (JSON.stringify(route) === JSON.stringify(S.route)) return;
  if (record) { S.back.push({route:S.route, repo:S.repo}); S.fwd = []; }
  if (route.kind === 'task') {
    const t = findTask(route.id);
    if (t && !repoData().tasks.includes(t)) repoData().tasks.push(t); // opening a Task puts it in the working set
  }
  S.route = route;
  render();
}
function travel(dir) {
  const from = dir < 0 ? S.back : S.fwd, to = dir < 0 ? S.fwd : S.back;
  const item = from.pop(); if (!item) return;
  to.push({route:S.route, repo:S.repo});
  S.route = item.route; S.repo = item.repo; render();
}
function switchRepo(repo) {
  if (repo === S.repo) return;
  toast(`Focus the ${repo} window (⌘\` cycles repository windows)`);
  S.back.push({route:S.route, repo:S.repo}); S.fwd = [];
  S.repo = repo; S.scope = 'working';
  S.route = {kind:'task', id: REPOS[repo].tasks[0].id};
  render();
}

// ---------- palette results ----------
function results() {
  const q = S.query.trim().toLowerCase();
  const m = s => !q || s.toLowerCase().includes(q);
  const out = [];
  const tasks = Object.keys(REPOS).flatMap(r => allTasks(r)).filter(t => m(`${t.key} ${t.title} ${t.detail} ${t.state} ${t.repo}`));
  tasks.sort((a,b) => (a.repo===S.repo?0:1)-(b.repo===S.repo?0:1));
  if (tasks.length) { out.push({group:'Tasks'}); for (const t of tasks.slice(0,7)) out.push({k:t.key, label:t.title, right: t.repo===S.repo ? waveName(t.wave) : t.repo, act:() => t.repo===S.repo ? go({kind:'task',id:t.id}) : (switchRepo(t.repo), go({kind:'task',id:t.id}))}); }
  const waves = repoData().waves.filter(w => m(w.name));
  if (waves.length) { out.push({group:'Waves'}); for (const w of waves) out.push({k:'wave', label:w.name, right:`${allTasks().filter(t=>t.wave===w.id).length} tasks`, act:() => { S.scope=`wave:${w.id}`; go({kind:'wave',id:w.id}); }}); }
  const scopes = [['working','Working tasks'],['available','Available'],['running','Running']].filter(([,n]) => m(`show ${n} sidebar`));
  if (scopes.length) { out.push({group:'Sidebar shows'}); for (const [id,n] of scopes) out.push({k:'show', label:n, right: S.scope===id ? 'current' : '', act:() => { S.scope=id; render(); }}); }
  const repos = Object.keys(REPOS).filter(r => m(`repo ${r}`));
  if (repos.length) { out.push({group:'Repositories'}); for (const r of repos) out.push({k:'repo', label:r, right: r===S.repo ? 'this window' : 'open window', act:() => switchRepo(r)}); }
  return out;
}
function paletteHTML() {
  const rs = results(); let i = -1;
  const items = rs.map(r => r.group ? `<div class="group">${r.group}</div>` :
    (i++, `<button class="item ${i===S.hl?'hl':''}" data-ri="${i}"><span class="k">${r.k}</span><span>${esc(r.label)}</span><span class="r">${esc(r.right)}</span></button>`)).join('');
  return `<div class="results">${items || '<div class="group">No matches</div>'}</div>`;
}
const actionable = () => results().filter(r => !r.group);
function openPalette(seed='') { S.palette = true; S.query = seed; S.hl = 0; render(); const inp = document.getElementById('pq'); if (inp) { inp.focus(); inp.setSelectionRange(seed.length, seed.length); } }
function closePalette() { S.palette = false; S.query = ''; render(); }

// ---------- shared pieces ----------
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const SPIN = '⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏';
const stateWord = s => ({available:'Available', running:'Working', idle:'Idle'})[s];
const ICON = {
  side:'<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M6 3v10" stroke="currentColor" stroke-width="1.2"/></svg>',
  back:'<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  fwd:'<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  more:'<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="12.5" cy="8" r="1.3" fill="currentColor"/></svg>',
};
const navButtons = () => `
  <button class="icon-btn" data-act="back" title="Back ⌘[" aria-label="Back" ${S.back.length?'':'disabled'}>${ICON.back}</button>
  <button class="icon-btn" data-act="fwd" title="Forward ⌘]" aria-label="Forward" ${S.fwd.length?'':'disabled'}>${ICON.fwd}</button>`;
const sideToggle = () => `<button class="icon-btn" data-act="side" title="Toggle sidebar ⌘\\" aria-label="Toggle sidebar" aria-expanded="${!S.collapsed}">${ICON.side}</button>`;
const moreBtn = () => `<button class="icon-btn" data-act="more" title="Actions" aria-label="Contextual actions">${ICON.more}</button>`;

function terminal(t) {
  const L = [];
  const agentName = {codex:'Codex', claude:'Claude Code', opencode:'OpenCode'}[t.agent];
  L.push(`<span class="dim">╭─ </span><b class="mag">${agentName}</b><span class="dim"> · ${t.key} · ${t.branch}</span>`);
  L.push(`<span class="dim">╰─ ~/src/${t.repo}.${t.branch}</span>`);
  L.push('');
  L.push(`<span class="dim">›</span> ${esc(t.prompt)}`);
  L.push('');
  for (const [kind, what, res] of t.work) {
    const verb = {read:'Read', edit:'Edit', run:'Ran', grep:'Search'}[kind];
    L.push(`<span class="green">●</span> <b>${verb}</b> <span class="cyan">${esc(what)}</span>${res ? `  <span class="dim">⎿</span> ${/passed|merged/.test(res)?`<span class="green">${res}</span>`:`<span class="yellow">${res}</span>`}` : ''}`);
  }
  L.push('');
  if (t.reply) L.push(esc(t.reply));
  if (t.ask) { L.push(''); L.push(`<span class="yellow">◆ Waiting on you:</span> ${esc(t.ask)}`); }
  if (t.state === 'running') L.push(`<span class="blue">${SPIN[S.frame % SPIN.length]}</span> <span class="dim">Working… (esc to interrupt)</span>`);
  const prompt = t.state === 'running' ? '' : `<span class="box"><span class="dim">›</span> <span class="term-input" contenteditable="true" spellcheck="false" data-draft="${t.key}">${esc(drafts[t.key] ?? '')}</span><span class="cursor"></span></span>`;
  return `<div class="term" id="term">${L.join('\n')}\n${prompt}</div>`;
}
const drafts = {};

function overview(waveId) {
  const ts = allTasks().filter(t => t.wave === waveId);
  return `<div class="overview"><h2>${esc(waveName(waveId))}</h2><p>${ts.length} open Tasks in this Wave. The Wave’s own conversation would sit here; the multi-Task grid belongs to LOO-497.</p>
    ${ts.map(t => `<button class="orow" data-task="${t.id}"><span class="k">${t.key}</span><span class="st ${t.state}"></span><span>${esc(t.title)}</span><span class="s">${stateWord(t.state)} · ${t.time}</span></button>`).join('')}</div>`;
}
function centerBody() {
  if (S.route.kind === 'wave') return overview(S.route.id);
  return terminal(findTask(S.route.id));
}
function crumbParts() {
  const parts = [{label:S.repo, repo:true, act:'repo'}];
  if (S.route.kind === 'wave') parts.push({label:waveName(S.route.id), cur:true});
  else { const t = findTask(S.route.id); parts.push({label:waveName(t.wave), act:`wave:${t.wave}`}); parts.push({label:`${t.key}`, title:t.title, cur:true}); }
  return parts;
}

// ---------- A: Address bar ----------
function renderA() {
  const parts = crumbParts();
  const omni = S.palette
    ? `<div class="omni" id="omni"><input id="pq" value="${esc(S.query)}" placeholder="Search Tasks, Waves, repositories, or what the sidebar shows…" autocomplete="off"><kbd>esc</kbd>
         <div class="omni-drop open">${paletteHTML()}</div></div>`
    : `<div class="omni" id="omni" data-act="palette">${parts.map((p,i) => `${i?'<span class="sep">›</span>':''}<span class="seg ${p.repo?'repo':''} ${p.cur?'cur':''}" ${p.act?`data-crumb="${p.act}"`:''}>${esc(p.label)}${p.title?` <span style="opacity:.75">${esc(p.title)}</span>`:''}</span>`).join('')}<kbd>⌘K</kbd></div>`;
  const tasks = sidebarTasks();
  return `
  <div class="titlebar"><div class="traffic"><i></i><i></i><i></i></div>${sideToggle()}${navButtons()}
    ${omni}
    <div class="right">${moreBtn()}</div></div>
  <div class="body">
    <aside class="side ${S.collapsed?'collapsed':''}"><div class="side-scroll">
      <div class="sec"><b>${scopeLabel()}</b><span class="mono">${tasks.length}</span></div>
      ${tasks.map(t => `<button class="row ${S.route.kind==='task'&&S.route.id===t.id?'sel':''}" data-task="${t.id}">
          <div class="t"><span class="id">${t.id}</span>${esc(t.title)}</div>
          <div class="d">${esc(t.detail)}</div>
          <div class="m">${t.state==='running'?`<span class="spin">${SPIN[S.frame%SPIN.length]}</span><span class="run">Working</span>`:`<span class="st ${t.state}"></span><span class="${t.state==='available'?'avail':''}">${stateWord(t.state)}</span>`}<span>· ${waveName(t.wave)}</span><span style="margin-left:auto">${t.time}</span></div>
        </button>`).join('')}
      <div class="sec" style="margin-top:10px"><b>Waves</b></div>
      ${repoData().waves.map(w => `<button class="wave ${S.route.kind==='wave'&&S.route.id===w.id?'sel':''}" data-wave="${w.id}"><span style="opacity:.6">◇</span>${w.name}<span class="n">${allTasks().filter(t=>t.wave===w.id).length}</span></button>`).join('')}
    </div></aside>
    <main class="center">${centerBody()}</main>
  </div>`;
}

// ---------- B: Margin ----------
function renderB() {
  const tasks = sidebarTasks();
  const parts = crumbParts().slice(1);
  const t = S.route.kind === 'task' ? findTask(S.route.id) : null;
  const glyph = x => x.state==='running' ? `<span class="spin">${SPIN[S.frame%SPIN.length]}</span>` : `<span class="st ${x.state}"></span>`;
  return `
  <div class="body">
    <aside class="side ${S.collapsed?'collapsed':''}">
      <div class="side-top"><div class="traffic"><i></i><i></i><i></i></div>${sideToggle()}</div>
      <button class="repo" data-act="palette" title="Search, switch repository, choose sidebar ⌘K"><span>${S.collapsed ? S.repo[0].toUpperCase() : ''}</span><span class="full">${S.repo}</span><span class="chev full">⌄</span><kbd class="full">⌘K</kbd></button>
      <div class="side-scroll">
        <div class="sec">${scopeLabel()}</div>
        ${tasks.map(x => `<button class="row ${t&&t.id===x.id?'sel':''}" data-task="${x.id}" title="${esc(x.key+' '+x.title)}">
          <span class="g">${glyph(x)}${x.id}</span>
          <span class="txt"><div class="t">${esc(x.title)}</div><div class="d">${esc(x.detail)}</div></span></button>`).join('')}
        <div class="sec" style="margin-top:8px">Waves</div>
        ${repoData().waves.map(w => `<button class="wave ${S.route.kind==='wave'&&S.route.id===w.id?'sel':''}" data-wave="${w.id}" title="${w.name}"><span class="g">${S.collapsed ? w.name.slice(0,2) : '◇'}</span><span class="lbl">${w.name}</span><span class="n">${allTasks().filter(x=>x.wave===w.id).length}</span></button>`).join('')}
      </div>
    </aside>
    <main class="center">
      <div class="pane-head">${navButtons()}
        <div class="crumbs">${parts.map((p,i) => `${i?'<span class="sep">/</span>':''}<button class="${p.cur?'cur':''}" ${p.act?`data-crumb="${p.act}"`:'data-act="palette"'}>${esc(p.label)}${p.title?` <span style="color:var(--text3);font-weight:400">${esc(p.title)}</span>`:''}</button>`).join('')}</div>
        <div class="meta">${t ? `${glyph(t)}<span>${stateWord(t.state)}</span><span>·</span><span>${t.agent}</span>${t.pr?`<span>·</span><span>${t.pr}</span>`:''}` : ''}${moreBtn()}</div>
      </div>
      ${centerBody()}
    </main>
  </div>
  ${S.palette ? `<div class="palette-scrim open" data-act="close"><div class="palette" data-stop><input id="pq" value="${esc(S.query)}" placeholder="Search Tasks, Waves, repositories, or what the sidebar shows…" autocomplete="off">${paletteHTML()}<div class="foot"><span>↑↓ choose</span><span>↵ open</span><span>esc close</span></div></div></div>` : ''}`;
}

// ---------- C: Console ----------
function renderC() {
  const tasks = sidebarTasks();
  const t = S.route.kind === 'task' ? findTask(S.route.id) : null;
  const pr = x => !x.pr ? '' : x.prState==='passing' ? `<span class="pr-ok">${x.pr} ✓</span>` : x.prState==='checks' ? `<span class="pr-open">${x.pr} ⋯</span>` : `<span class="pr-open">${x.pr}</span>`;
  const parts = crumbParts();
  return `
  <div class="titlebar"><div class="traffic"><i></i><i></i><i></i></div>${sideToggle()}
    <button class="repo" data-act="palette"><span>${S.repo}</span><span class="chev">⌄</span></button>
    <button class="hint" data-act="palette">⌘K</button></div>
  <div class="body">
    <aside class="side ${S.collapsed?'collapsed':''}">
      <div class="scope-label"><span>${scopeLabel().toUpperCase()}</span><span>${tasks.length}</span></div>
      <div class="side-scroll">
        ${tasks.map(x => `<button class="row ${x.state} ${t&&t.id===x.id?'sel':''}" data-task="${x.id}">
          <div class="t">${esc(x.title)}</div>
          <div class="tail">${x.state==='running'?`<span style="color:var(--working)">${SPIN[S.frame%SPIN.length]}</span> `:''}${esc(x.tail)}</div>
          <div class="m"><span>${x.key}</span>${x.state==='available'?'<span class="avail">available</span>':''}${pr(x)}<span style="margin-left:auto">${x.time}</span></div></button>`).join('')}
      </div>
      <div class="waves-foot"><span class="lbl">WAVES</span>${repoData().waves.map(w => `<button class="${S.scope===`wave:${w.id}`?'sel':''}" data-wave="${w.id}">${w.name}<span class="n">${allTasks().filter(x=>x.wave===w.id).length}</span></button>`).join('')}</div>
    </aside>
    <main class="center">
      <div class="pane-head">${navButtons()}
        ${parts.map((p,i) => `${i?'<span>›</span>':''}<button class="crumb ${p.cur?'cur':''}" ${p.act?`data-crumb="${p.act}"`:''}>${esc(p.label)}</button>`).join('')}
        <span class="meta">${t?`<span>${t.agent}</span><span>${t.branch}</span>`:''}${moreBtn()}</span>
      </div>
      ${centerBody()}
    </main>
  </div>
  ${S.palette ? `<div class="palette-scrim open" data-act="close"><div class="palette" data-stop style="top:44px"><input id="pq" value="${esc(S.query)}" placeholder="Search Tasks, Waves, repositories, or what the sidebar shows…" autocomplete="off">${paletteHTML()}<div class="foot"><span>↑↓ choose</span><span>↵ open</span><span>esc close</span></div></div></div>` : ''}`;
}

// ---------- render + events ----------
function render() {
  document.body.classList.toggle('dark-page', S.theme === 'dark');
  for (const b of document.querySelectorAll('#variant-seg button')) b.setAttribute('aria-pressed', b.dataset.v === S.v);
  for (const b of document.querySelectorAll('#theme-seg button')) b.setAttribute('aria-pressed', b.dataset.t === S.theme);
  const th = THESES[S.v];
  document.getElementById('thesis').innerHTML = `<div><h1>${S.v.toUpperCase()} · ${th.name}</h1><p><b>${th.line}</b> ${th.body}</p></div><ul>${th.bets.map(b=>`<li>${b}</li>`).join('')}</ul>`;
  const host = document.getElementById('win-host');
  const focusedDraft = document.activeElement?.dataset?.draft;
  host.innerHTML = `<div class="win" data-v="${S.v}" data-theme="${S.theme}">${({a:renderA,b:renderB,c:renderC})[S.v]()}<div class="toast" id="toast"></div></div>`;
  const pq = document.getElementById('pq');
  if (pq) { pq.focus(); pq.setSelectionRange(pq.value.length, pq.value.length); }
  else if (focusedDraft) { const el = host.querySelector(`[data-draft="${focusedDraft}"]`); if (el) { el.focus(); placeCaretEnd(el); } }
  const term = document.getElementById('term'); if (term) term.scrollTop = term.scrollHeight;
  const u = new URL(location); u.searchParams.set('v', S.v); u.searchParams.set('theme', S.theme); history.replaceState(null, '', u);
}
function placeCaretEnd(el) { const r = document.createRange(); r.selectNodeContents(el); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
let toastTimer;
function toast(msg) { setTimeout(() => { const el = document.getElementById('toast'); if (!el) return; el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200); }, 0); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-v],[data-t],[data-task],[data-wave],[data-crumb],[data-act],[data-ri],[data-stop]');
  if (!el) return;
  if (el.closest('.study-bar')) {
    if (el.dataset.v) { S.v = el.dataset.v; S.palette = false; }
    if (el.dataset.t) S.theme = el.dataset.t;
    return render();
  }
  if (el.dataset.ri !== undefined) { const r = actionable()[+el.dataset.ri]; S.palette = false; S.query=''; r.act(); return render(); }
  if (el.dataset.stop !== undefined && !el.dataset.act) return;
  if (el.dataset.task) { go({kind:'task', id:el.dataset.task}); return; }
  if (el.dataset.wave) {
    const id = el.dataset.wave;
    if (S.v === 'c') S.scope = S.scope === `wave:${id}` ? 'working' : `wave:${id}`;
    go({kind:'wave', id}); render(); return;
  }
  if (el.dataset.crumb) {
    e.stopPropagation();
    const c = el.dataset.crumb;
    if (c === 'repo') return openPalette('repo ');
    if (c.startsWith('wave:')) return go({kind:'wave', id:c.slice(5)});
  }
  const act = el.dataset.act;
  if (act === 'back') travel(-1);
  else if (act === 'fwd') travel(1);
  else if (act === 'side') { S.collapsed = !S.collapsed; render(); }
  else if (act === 'palette') { if (!S.palette) openPalette(); }
  else if (act === 'close') closePalette();
  else if (act === 'more') toast(S.route.kind==='task' ? 'Task actions: New conversation · Open PR · Open in editor · Move to Wave' : 'Wave actions: Open conversation · New Task');
});
document.addEventListener('mousedown', e => {
  if (S.v === 'a' && S.palette && !e.target.closest('#omni')) closePalette();
});
document.addEventListener('input', e => {
  if (e.target.id === 'pq') { S.query = e.target.value; S.hl = 0;
    const box = e.target.closest('.omni,.palette'); const res = box.querySelector('.results'); res.outerHTML = paletteHTML(); }
  if (e.target.dataset?.draft) drafts[e.target.dataset.draft] = e.target.textContent;
});
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); S.palette ? closePalette() : openPalette(); return; }
  if (mod && e.key === '\\') { e.preventDefault(); S.collapsed = !S.collapsed; render(); return; }
  if (mod && e.key === '[') { e.preventDefault(); travel(-1); return; }
  if (mod && e.key === ']') { e.preventDefault(); travel(1); return; }
  if (!S.palette) return;
  const n = actionable().length;
  if (e.key === 'Escape') { e.preventDefault(); closePalette(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); S.hl = (S.hl + 1) % n; refreshResults(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); S.hl = (S.hl - 1 + n) % n; refreshResults(); }
  else if (e.key === 'Enter') { e.preventDefault(); const r = actionable()[S.hl]; S.palette = false; S.query=''; if (r) r.act(); render(); }
});
function refreshResults() { const res = document.querySelector('.omni .results, .palette .results'); if (res) res.outerHTML = paletteHTML(); }

// Animate working spinners without re-rendering the whole window
setInterval(() => { S.frame++; for (const el of document.querySelectorAll('.spin, .row .tail > span:first-child, #term .blue:last-of-type')) if (el.textContent.length === 1 && SPIN.includes(el.textContent)) el.textContent = SPIN[S.frame % SPIN.length]; }, 110);

render();
if (params.get('palette')) openPalette(params.get('palette') === '1' ? '' : params.get('palette'));
</script>
</body>
</html>
