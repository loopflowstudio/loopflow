<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Retained Work — dashboard study</title>
  <link rel="stylesheet" href="dashboards.css">
</head>
<body>
  <header class="study">
    <span>LOO-489 · DESIGN STUDY</span>
    <p>A place to return to.</p>
    <label><input type="checkbox" id="expandable"> Expandable sections</label>
  </header>
  <div class="app">
    <aside>
      <button class="repo" data-action="repo">loopflow <small>Pinned dashboard</small></button>
      <section><h2>Needs you</h2><div id="attention"></div></section>
      <nav aria-label="Work"><h2>Work</h2><div id="navigation"></div></nav>
      <p class="sidebar-note">Navigation scaffold only.<br>The parent sidebar design is unresolved.</p>
    </aside>
    <main>
      <header class="destination"><div><p id="scope"></p><h1 id="title"></h1></div><div id="actions"></div></header>
      <p id="notice" role="status"></p>
      <div id="work"></div>
    </main>
  </div>
  <footer>
    <span>Draft choices · Fictional Work · No execution · State lasts until reload</span>
    <details><summary>Simulate query update</summary><div>
      <button data-action="complete">Complete / reopen theme Task</button>
      <button data-action="error">Disconnect / restore reading</button>
      <button data-action="attention">Clear / restore Task attention</button>
    </div></details>
  </footer>
  <script src="dashboards.js"></script>
</body>
</html>
