<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sidebar selection comparison</title><link rel="stylesheet" href="task-workspaces.css"><style>
html,body{height:100%;overflow:hidden}.app{display:block;height:100vh;min-height:0}.sidebar{height:100%;width:100%}#work,.resize{display:none!important}.app.collapsed .collapsed-rail{height:100%}.selected{box-shadow:none!important}.repo-name{font:700 21px/1.5 Lato,sans-serif;padding:8px 10px}.trail{padding:0;gap:3px}.trail button{font-size:14px;padding:8px 10px}.trail-note{font:11px/1.5 Lato,sans-serif;padding:10px 10px 0}.collapse{font-size:17px}#side-head{padding:14px 12px 14px}.wave{padding:16px 12px;margin-bottom:3px}.wave b{font-size:17px}.wave p{margin:6px 0}.wave small{margin-top:8px}.section-title{padding-top:12px}.task{border:0;padding:14px 12px}.task b{font-size:14px}.task p{font-size:12px}.task .meta{font-size:10px}.task:hover{border:0}button:hover{background:#e8e2d9}.selected{font-weight:700}.search{margin-bottom:12px}#attention{padding:0 16px 15px}.attention-row{font-size:11px}.attention-row span:first-child{width:70px}.attention-row small{font-size:9px}
body.notion{--select:#e5e0d9}.notion .selected{color:#302b27}.notion .selected b{color:#302b27}
body.figma{--select:#dceefd}.figma .selected{color:#145a91}.figma .selected b{color:#145a91}.figma .selected p,.figma .selected .meta{color:#416580}.figma button{border-radius:4px}
body.ink{--select:#7a333d}.ink .selected,.ink .selected b{color:#fffaf3}.ink .selected p,.ink .selected .meta,.ink .selected .status{color:#eee0df}
</style></head><body>
<div class="app" id="app"><aside class="sidebar"><div id="side-head"></div><div id="attention"></div><nav id="navigation" aria-label="Work navigation"></nav><div class="search"><span>⌕</span><input type="search" placeholder="Find a Task or Wave…" aria-label="Find Work"><kbd>⌘ K</kbd></div></aside><div class="resize" role="separator" tabindex="-1" aria-label="Resize sidebar"></div><aside class="collapsed-rail"><button data-collapse aria-label="Show sidebar">◧</button><span>LOOPFLOW</span></aside><main id="work" aria-label="Work multiplexer"></main></div>
<script src="task-workspaces.js"></script><script>
const treatment=new URLSearchParams(location.search).get('style');
document.body.classList.add(['notion','figma','ink'].includes(treatment)?treatment:'notion');
window.addEventListener('message',e=>{if(e.source===parent&&e.origin===location.origin&&e.data?.type==='selection-study'&&['repo',...waves.map(w=>w.id),...tasks.map(t=>t.id)].includes(e.data.id)){hidden=false;show(e.data.id)}});
document.addEventListener('click',e=>{if(e.target.closest('[data-open]'))parent.postMessage({type:'selection-changed',id:selected},location.origin)});
</script></body></html>
