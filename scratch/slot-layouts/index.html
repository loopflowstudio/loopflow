<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard slot layouts</title>
<style>
:root {
  --bg: #f6f3ee; --surface: #fbf9f5; --border: #d9d2c7; --text: #2a2522; --muted: #8a8079;
  --accent: #6b2c35; --term: #1d1b1a; --term-text: #d8d2c8; --term-dim: #7d756c; --focus: #c9a227;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, system-ui, sans-serif; }
header { padding: 14px 20px 10px; display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
h1 { font-size: 15px; margin: 0; }
.tabs { display: flex; gap: 6px; }
.tabs button { border: 1px solid var(--border); background: var(--surface); padding: 5px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
.tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.hint { color: var(--muted); font-size: 12px; }
.note { padding: 0 20px 8px; color: var(--muted); font-size: 13px; max-width: 1100px; }
.window { margin: 0 20px 20px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,.08); }
.titlebar { background: var(--accent); color: #fff; padding: 8px 14px; font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; }
.titlebar .pager { font-weight: 400; opacity: .85; }
.stage { position: relative; aspect-ratio: 1728 / 1000; background: var(--bg); }
.pane { position: absolute; padding: 4px; transition: all .18s ease; }
.pane .inner { height: 100%; border-radius: 6px; border: 1px solid var(--border); background: var(--term); overflow: hidden; display: flex; flex-direction: column; cursor: pointer; }
.pane.focused .inner { border: 2px solid var(--focus); }
.pane.covered { opacity: 0; pointer-events: none; }
.pane.focused { z-index: 2; }
.pane.ghost .inner { background: var(--surface); border-style: dashed; }
.head { background: var(--surface); color: var(--text); padding: 4px 8px; font-size: 12px; display: flex; justify-content: space-between; gap: 8px; white-space: nowrap; }
.head .id { font-family: ui-monospace, monospace; color: var(--muted); }
.head .cols { font-family: ui-monospace, monospace; color: var(--muted); font-size: 11px; }
.head .name { overflow: hidden; text-overflow: ellipsis; }
.body { padding: 6px 8px; font: 11px/1.45 ui-monospace, Menlo, monospace; color: var(--term-text); white-space: pre; overflow: hidden; flex: 1; }
.body .dim { color: var(--term-dim); }
.badge { position: absolute; right: 10px; font-size: 11px; background: var(--focus); color: #000; padding: 1px 6px; border-radius: 8px; z-index: 3; }
.attn { color: #e0b44c; }
</style>
</head>
<body>
<header>
  <h1>Dashboard slot layouts</h1>
  <div class="tabs" id="tabs"></div>
  <span class="hint">Click a pane or press 1–8 to focus · [ and ] page side to side</span>
</header>
<div class="note" id="note"></div>
<div class="window">
  <div class="titlebar"><span>loopflow › Working Tasks</span><span class="pager" id="pager"></span></div>
  <div class="stage" id="stage"></div>
</div>
<script>
// Window width in points on Jack's display; a 11px Menlo cell is ~6.6pt wide.
const WINDOW_PT = 1728, CELL_PT = 6.6;

const TASKS = [
  ["LOO-539", "Clean up merged remote branches from lf"],
  ["LOO-521", "Let older lf open stores after additive migrations"],
  ["LOO-520", "Use Asana or Notion instead of Linear for planning"],
  ["LOO-389", "Track computing dependencies, their access and costs"],
  ["LOO-538", "Hourly disk cleanup on laptop and mini"],
  ["LOO-312", "A newcomer gets from download to a running Loopflow"],
  ["LOO-426", "Open any Task or Session in the Mac app with one command"],
  ["LOO-416", "Keep Task Sessions seamless across switching and app restart"],
  ["LOO-497", "Compose saved Dashboards of Tasks in Loopflow Desktop"],
  ["LOO-523", "Own Tasks as (person, machine) with an ownership log"],
  ["LOO-531", "Check every Desktop read against a built world"],
];
const LINES = [
  "● Reading swift/LoopflowMac/WorkModel.swift",
  "  Ran 1 shell command",
  "● The heading falls through to Linear's planning_state after the durable started check passes.",
  "* Cogitated for 35s · done 2:41 PM",
  "● cargo test -p loopflow --lib selection — 34 passed",
  "  Edited rust/loopflow/src/store/sqlite/selections.rs (+12 −4)",
  "● Publishing PR #1580; scratch-clear passed, every other job skipped",
  "> waiting for input",
];

// Each layout: slot rectangles in fractions of the stage, and how focus reshapes them.
const LAYOUTS = {
  seven: {
    label: "7 slots",
    note: "Jack's layout: (1 | (2 | 3)) over (1 | 2 | 3 | 4). Slot 1 is always the big one; focus only highlights.",
    count: 7,
    rects: () => [
      [0, 0, .5, .5], [.5, 0, .25, .5], [.75, 0, .25, .5],
      [0, .5, .25, .5], [.25, .5, .25, .5], [.5, .5, .25, .5], [.75, .5, .25, .5],
    ],
  },
  golden: {
    label: "7 slots, golden",
    note: "Jack's 7 slots, split by the golden ratio: the top band takes 61.8% of the height and slot 1 takes 61.8% of its width; slots 2 and 3 share the rest. The bottom band stays four equal slots.",
    count: 7,
    rects: () => {
      const g = 0.618, top = g, rest = 1 - g;
      return [
        [0, 0, g, top], [g, 0, rest / 2, top], [g + rest / 2, 0, rest / 2, top],
        [0, top, .25, 1 - top], [.25, top, .25, 1 - top], [.5, top, .25, 1 - top], [.75, top, .25, 1 - top],
      ];
    },
  },
  goldenGrow: {
    label: "7 slots, golden, focus grows in place",
    note: "The golden layout, with nothing focused. Focus a slot and its band takes 61.8% of the height, and the slot takes 61.8% of that band's width. The rest of its band splits the remainder in order, and the other band keeps its own proportions. Nothing is covered and nothing changes order.",
    count: 7,
    rects: (f) => {
      const g = 0.618;
      const bands = [[0, 1, 2], [3, 4, 5, 6]];
      const base = [[g, (1 - g) / 2, (1 - g) / 2], [.25, .25, .25, .25]];
      const band = f == null ? null : (f < 3 ? 0 : 1);
      const heights = band == null ? [g, 1 - g] : (band === 0 ? [g, 1 - g] : [1 - g, g]);
      const r = [];
      bands.forEach((slots, b) => {
        const widths = band === b
          ? slots.map(s => s === f ? g : (1 - g) / (slots.length - 1))
          : base[b];
        let x = 0;
        const y = b === 0 ? 0 : heights[0];
        slots.forEach((s, k) => { r[s] = [x, y, widths[k], heights[b]]; x += widths[k]; });
      });
      return r;
    },
  },
  goldenTree: {
    label: "7 slots, golden, tree rule",
    note: "The general rule for any arrangement. The layout is a split tree with base ratios. Focus walks from the root to the focused slot, and at each split the branch holding focus takes 61.8%, with its siblings sharing the rest in proportion to their base ratios. Nested slots (2, 3) grow less than top-level ones, because their 61.8% is taken of a smaller branch.",
    count: 7,
    rects: (f) => {
      const g = 0.618;
      // [direction, [[weight, child], ...]]; a number is a slot.
      const tree = ["v", [[g, ["h", [[g, 0], [1 - g, ["h", [[.5, 1], [.5, 2]]]]]]],
                          [1 - g, ["h", [[.25, 3], [.25, 4], [.25, 5], [.25, 6]]]]]];
      const holds = (node, s) => typeof node === "number" ? node === s : node[1].some(([, c]) => holds(c, s));
      const r = [];
      const lay = (node, [x, y, w, h]) => {
        if (typeof node === "number") { r[node] = [x, y, w, h]; return; }
        const [dir, kids] = node;
        const hit = f == null ? -1 : kids.findIndex(([, c]) => holds(c, f));
        const rest = kids.reduce((a, [wt], i) => i === hit ? a : a + wt, 0);
        let at = 0;
        kids.forEach(([wt, c], i) => {
          const share = hit < 0 ? wt : (i === hit ? g : (1 - g) * wt / rest);
          lay(c, dir === "h" ? [x + at * w, y, share * w, h] : [x, y + at * h, w, share * h]);
          at += share;
        });
      };
      lay(tree, [0, 0, 1, 1]);
      return r;
    },
  },
  grow: {
    label: "8 slots, focus grows in place",
    note: "4×2 slots, all always visible. The focused slot's column takes 46% of the width and its row 61.8% of the height; every other slot shrinks to make room but keeps its place. Nothing is covered.",
    count: 8,
    rects: (f) => {
      const col = f == null ? null : f % 4, row = f == null ? null : Math.floor(f / 4);
      const widths = [0, 1, 2, 3].map(c => col == null ? .25 : (c === col ? .46 : .18));
      const heights = [0, 1].map(r => row == null ? .5 : (r === row ? .618 : .382));
      const xs = widths.map((_, c) => widths.slice(0, c).reduce((a, b) => a + b, 0));
      return [...Array(8)].map((_, i) => [xs[i % 4], Math.floor(i / 4) === 0 ? 0 : heights[0], widths[i % 4], heights[Math.floor(i / 4)]]);
    },
  },
  stageSide: {
    label: "Stage + side slots",
    note: "A reserved stage (61.8% of the width) shows the focused Task. The 8 slots sit beside it in two columns and never move; the focused Task's slot shows that it's on stage. With nothing focused, the stage shows slot 1.",
    count: 8,
    stage: [0, 0, 0.618, 1],
    rects: () => [...Array(8)].map((_, i) => [0.618 + (i % 2) * 0.191, Math.floor(i / 2) * .25, 0.191, .25]),
  },
  stageBottom: {
    label: "Stage + bottom row",
    note: "The stage takes the top 61.8% at full width; 7 slots run along the bottom in order. The focused Task's slot shows that it's on stage.",
    count: 7,
    stage: [0, 0, 1, 0.618],
    rects: () => [...Array(7)].map((_, i) => [i / 7, 0.618, 1 / 7, 0.382]),
  },
  eight: {
    label: "8 slots, focus overfills",
    note: "4×2 equal slots. Focus grows the pane vertically over its column neighbour; nothing moves. Width never changes.",
    count: 8,
    rects: (f) => {
      const r = [...Array(8)].map((_, i) => [(i % 4) * .25, Math.floor(i / 4) * .5, .25, .5]);
      if (f != null) r[f] = [(f % 4) * .25, 0, .25, 1];
      return r;
    },
    covers: (f) => f == null ? null : (f < 4 ? f + 4 : f - 4),
  },
  wide: {
    label: "8 slots, focus overfills + widens",
    note: "As before, and the focused column takes 40% of the width; the other three columns share the rest. Neighbours shrink but keep their places.",
    count: 8,
    rects: (f) => {
      const col = f == null ? null : f % 4;
      const widths = [0, 1, 2, 3].map(c => col == null ? .25 : (c === col ? .4 : .2));
      const xs = widths.map((_, c) => widths.slice(0, c).reduce((a, b) => a + b, 0));
      const r = [...Array(8)].map((_, i) => [xs[i % 4], Math.floor(i / 4) * .5, widths[i % 4], .5]);
      if (f != null) r[f] = [xs[col], 0, widths[col], 1];
      return r;
    },
    covers: (f) => f == null ? null : (f < 4 ? f + 4 : f - 4),
  },
};

let layout = "seven", focus = null, page = 0;
try { layout = localStorage.getItem("slot-layout") || layout; } catch (e) {}

function render() {
  const L = LAYOUTS[layout];
  const pages = Math.ceil(TASKS.length / L.count);
  page = Math.min(page, pages - 1);
  const onPage = TASKS.slice(page * L.count, (page + 1) * L.count);
  if (focus != null && focus >= onPage.length) focus = null;
  const rects = L.rects(focus);
  const covered = L.covers ? L.covers(focus) : null;

  document.getElementById("tabs").innerHTML = Object.entries(LAYOUTS).map(([k, v]) =>
    `<button class="${k === layout ? "on" : ""}" data-k="${k}">${v.label}</button>`).join("");
  document.getElementById("note").textContent = L.note;
  document.getElementById("pager").textContent =
    `page ${page + 1} of ${pages} · Tasks ${page * L.count + 1}–${page * L.count + onPage.length} of ${TASKS.length}`;

  const stage = document.getElementById("stage");
  stage.innerHTML = "";
  const onStage = L.stage ? (focus ?? 0) : null;
  const place = ([id, name], i, [x, y, w, h], opts = {}) => {
    const cols = Math.floor((w * WINDOW_PT - 20) / CELL_PT);
    const el = document.createElement("div");
    el.className = "pane" + (opts.focused ? " focused" : "") + (i === covered ? " covered" : "") + (opts.ghost ? " ghost" : "");
    Object.assign(el.style, { left: x * 100 + "%", top: y * 100 + "%", width: w * 100 + "%", height: h * 100 + "%" });
    const body = opts.ghost ? `<span class="dim">on stage</span>` : LINES.map((l, n) => {
      const text = l.length > cols ? l.slice(0, cols - 1) + "…" : l;
      const cls = n === 7 && i === 5 ? "attn" : (l.startsWith("  ") || l.startsWith("*") ? "dim" : "");
      return `<span class="${cls}">${text.replace(/</g, "&lt;")}</span>`;
    }).join("\n");
    el.innerHTML = `<div class="inner"><div class="head"><span class="name"><span class="id">${id}</span> ${name}</span><span class="cols">${cols} cols</span></div><div class="body">${body}</div></div>`;
    el.onclick = () => { focus = focus === i ? null : i; render(); };
    stage.appendChild(el);
  };
  if (onStage != null && onStage < onPage.length) place(onPage[onStage], onStage, L.stage, { focused: true });
  onPage.forEach((task, i) => place(task, i, rects[i], {
    focused: onStage == null && i === focus,
    ghost: onStage === i,
  }));
  if (covered != null && covered < onPage.length) {
    const [x, y, w] = rects[focus];
    const b = document.createElement("div");
    b.className = "badge";
    b.textContent = `covers ${onPage[covered][0]}${covered === 5 ? " · waiting" : ""}`;
    Object.assign(b.style, { left: `calc(${(x + w) * 100}% - 12px)`, right: "auto", transform: "translateX(-100%)", top: covered < focus ? "8px" : "auto", bottom: covered > focus ? "8px" : "auto" });
    stage.appendChild(b);
  }
}

document.getElementById("tabs").onclick = (e) => {
  const k = e.target.dataset.k;
  if (!k) return;
  layout = k; focus = null; page = 0;
  try { localStorage.setItem("slot-layout", k); } catch (err) {}
  render();
};
document.onkeydown = (e) => {
  if (e.key === "[") { page = Math.max(0, page - 1); focus = null; }
  else if (e.key === "]") { page += 1; focus = null; }
  else if (/^[1-8]$/.test(e.key)) { const i = +e.key - 1; focus = focus === i ? null : i; }
  else if (e.key === "Escape") focus = null;
  else return;
  render();
};
render();
</script>
</body>
</html>
