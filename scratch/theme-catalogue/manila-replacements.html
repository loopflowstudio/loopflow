<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manila Replacements</title>
<style>:root{--bg:#f6f4f1;--ink:#24201d;--muted:#6b635c}@media (prefers-color-scheme:dark){:root{--bg:#1b1918;--ink:#ece7e1;--muted:#a39a91;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}.w{max-width:1100px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-left))}
h1{font-size:22px;margin:0 0 6px}p{color:var(--muted);margin:0 0 20px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
figure{margin:0}.t{padding:14px;border-radius:6px;font:12px/1.6 ui-monospace,Menlo,monospace}.n{font:600 15px system-ui;margin-bottom:8px}
.sw{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;margin-bottom:10px}.sw i{height:9px}figcaption{padding:8px 2px;font-size:13px}small{color:var(--muted)}</style></head>
<body><div class="w"><h1>Manila replacements</h1><p>All are Mark Badolato's own themes, MIT on their pages. Pick one to take Manila's light slot, or keep yellow with Butter.</p><div class="g"><figure><div class="t" style="background:#fbe68b;color:#25231f"><div class="n">Manila (current)</div><div class="sw"><i style="background:#342d27"></i><i style="background:#9c2922"></i><i style="background:#37663e"></i><i style="background:#785015"></i><i style="background:#244f85"></i><i style="background:#67416c"></i><i style="background:#17616b"></i><i style="background:#3e3730"></i></div>
<div class="m" style="color:#25231f"><span style="color:#244f85">~/loopflow</span> $ lf task status<br><span style="color:#37663e">✓</span> build passed <span style="color:#785015">●</span> waiting <span style="color:#9c2922">✗</span> failed</div></div>
<figcaption><b>Manila (current)</b> <small>from Yngwie&#x27;s Strat · Badolato MIT</small><br>Saturated legal-pad yellow.<br><small>text 12.5:1 · ANSI 5.4:1</small></figcaption></figure><figure><div class="t" style="background:#fff7fb;color:#211522"><div class="n">Quartz</div><div class="sw"><i style="background:#332a33"></i><i style="background:#881f3b"></i><i style="background:#175b36"></i><i style="background:#695000"></i><i style="background:#1a478e"></i><i style="background:#623080"></i><i style="background:#005765"></i><i style="background:#403640"></i></div>
<div class="m" style="color:#211522"><span style="color:#1a478e">~/loopflow</span> $ lf task status<br><span style="color:#175b36">✓</span> build passed <span style="color:#695000">●</span> waiting <span style="color:#881f3b">✗</span> failed</div></div>
<figcaption><b>Quartz</b> <small>from Afterimage · Badolato MIT</small><br>Pink-tinted white; no light theme is pink yet.<br><small>text 16.7:1 · ANSI 7.3:1</small></figcaption></figure><figure><div class="t" style="background:#fff0d2;color:#51463b"><div class="n">Butter</div><div class="sw"><i style="background:#322b24"></i><i style="background:#9b2f12"></i><i style="background:#46612d"></i><i style="background:#785711"></i><i style="background:#36516b"></i><i style="background:#69416e"></i><i style="background:#28656a"></i><i style="background:#51463b"></i></div>
<div class="m" style="color:#51463b"><span style="color:#36516b">~/loopflow</span> $ lf task status<br><span style="color:#46612d">✓</span> build passed <span style="color:#785711">●</span> waiting <span style="color:#9b2f12">✗</span> failed</div></div>
<figcaption><b>Butter</b> <small>from Candy Corn · Badolato MIT</small><br>Soft pale yellow; Manila&#x27;s role, much quieter.<br><small>text 8.2:1 · ANSI 5.9:1</small></figcaption></figure><figure><div class="t" style="background:#f0dfc3;color:#4a382f"><div class="n">Sand</div><div class="sw"><i style="background:#4a4038"></i><i style="background:#9e4935"></i><i style="background:#4b694d"></i><i style="background:#725a1c"></i><i style="background:#3a6378"></i><i style="background:#76546e"></i><i style="background:#33656a"></i><i style="background:#594b40"></i></div>
<div class="m" style="color:#4a382f"><span style="color:#3a6378">~/loopflow</span> $ lf task status<br><span style="color:#4b694d">✓</span> build passed <span style="color:#725a1c">●</span> waiting <span style="color:#9e4935">✗</span> failed</div></div>
<figcaption><b>Sand</b> <small>from Sun Bleached · Badolato MIT</small><br>Warm sand; sits between Clay and Vellum.<br><small>text 8.5:1 · ANSI 4.6:1</small></figcaption></figure><figure><div class="t" style="background:#f3f1ed;color:#20242b"><div class="n">Ash</div><div class="sw"><i style="background:#30343b"></i><i style="background:#842626"></i><i style="background:#165a38"></i><i style="background:#654d00"></i><i style="background:#17458a"></i><i style="background:#603286"></i><i style="background:#005765"></i><i style="background:#40444b"></i></div>
