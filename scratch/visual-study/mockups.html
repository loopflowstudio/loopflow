<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loopflow — workspace directions (sample)</title>
<style>
@font-face{font-family:"Cormorant";src:url("../../swift/Loopflow/Fonts/CormorantGaramond-Regular.otf");font-weight:400}
@font-face{font-family:"Cormorant";src:url("../../swift/Loopflow/Fonts/CormorantGaramond-SemiBold.otf");font-weight:600}
@font-face{font-family:"Lato";src:url("../../swift/Loopflow/Fonts/Lato-Regular.ttf");font-weight:400}
@font-face{font-family:"Lato";src:url("../../swift/Loopflow/Fonts/Lato-Bold.ttf");font-weight:700}
@font-face{font-family:"JBM";src:url("../../swift/Loopflow/Fonts/JetBrainsMono-Regular.ttf")}

:root{
  --wine:#722F37; --wine-deep:#4E2026; --wine-wash:#F2E6E4; --wine-soft:#B9868B;
  --cream:#FAF8F5; --paper:#F4F0E9; --sand:#ECE6DC; --line:#E2DACE; --line-2:#D5CBBC;
  --ink:#2A2421; --ink-2:#51483F; --muted:#857A6F; --faint:#A89D91;
  --char:#2B3036; --char-2:#24282D; --char-3:#353B42; --char-line:#3D434A;
  --t-ink:#DDD7CD; --t-dim:#8F8B84; --t-you:#E9C9A6; --t-ok:#9CB88C; --t-warn:#D9A95F;
  --moss:#5F7A56; --amber:#9E6B22; --ochre-wash:#F5EBD8;
  --w-product:#722F37; --w-infra:#4F6B78; --w-intel:#7A6A3E; --w-studio:#5D5A7A;
  --serif:"Cormorant",Georgia,serif; --sans:"Lato",-apple-system,"Helvetica Neue",sans-serif; --mono:"JBM",ui-monospace,Menlo,monospace;
  --ring:0 0 0 2px var(--cream),0 0 0 4px #9A4A53;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--sans);font-size:13.5px;color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{box-shadow:var(--ring);border-radius:5px}
.dark :focus-visible,.pane :focus-visible{box-shadow:0 0 0 2px var(--char),0 0 0 4px #D9A0A7}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shared bits ---------- */
.sample{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--wine);border:1px solid var(--wine-soft);border-radius:999px;padding:2px 8px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--line-2);background:var(--cream);color:var(--ink-2);font-size:13px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:#fff;border-color:var(--faint)}
.btn.primary{background:var(--wine);border-color:var(--wine);color:#FBF3F2}
.btn.primary:hover{background:#7F3740}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sand)}
.btn.small{height:26px;padding:0 9px;font-size:12px}
.btn[aria-pressed="true"]{background:var(--wine-wash);border-color:var(--wine-soft);color:var(--wine-deep)}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.state::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.state.review::before{background:var(--wine)}
.state.progress::before{background:var(--moss)}
.state.upcoming::before{background:transparent;border:1.5px solid var(--faint)}
.loc{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:4px;white-space:nowrap}
.loc.here{color:var(--moss);background:#E8EEE3}
.loc.elsewhere{color:var(--amber);background:var(--ochre-wash)}
.loc.unknown{color:var(--muted);background:var(--sand)}
.key{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.crumb{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;min-width:0;white-space:nowrap}
.crumb b{color:var(--ink);font-weight:700;overflow:hidden;text-overflow:ellipsis}
.crumb .sep{color:var(--faint)}
.kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}

/* ---------- outline ---------- */
.outline{padding:6px 8px 16px;font-size:13px}
.search{display:flex;align-items:center;gap:7px;margin:10px 10px 6px;padding:0 9px;height:30px;border-radius:6px;background:rgba(255,255,255,.55);border:1px solid var(--line);color:var(--muted)}
.search:focus-within{background:#fff;border-color:var(--wine-soft)}
.search input{border:0;background:transparent;flex:1;min-width:0;outline:none;color:var(--ink);font-size:13px}
.row{display:flex;align-items:center;min-height:30px;border-radius:6px;position:relative}
.row:hover{background:rgba(114,47,55,.05)}
.disc{width:22px;height:26px;display:grid;place-items:center;color:var(--faint);border-radius:5px;flex:none}
.disc:hover{color:var(--ink-2);background:rgba(0,0,0,.04)}
.disc svg{transition:transform .15s}
.disc[aria-expanded="true"] svg{transform:rotate(90deg)}
.disc.none{visibility:hidden}
.row .label{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:30px;padding-right:8px;border-radius:5px}
.row .label span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.repo-row .label{font-weight:700;font-size:12.5px;color:var(--ink-2)}
.wave-row{margin-top:6px}
.wave-row .label{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink);letter-spacing:.01em}
.wave-row .dot{width:7px;height:7px;border-radius:2px;flex:none}
.wave-row .count{margin-left:auto;font-family:var(--sans);font-size:11px;color:var(--faint);font-weight:400}
.task-row .label{padding-left:2px}
.task-row .st{width:7px;height:7px;border-radius:50%;flex:none;background:var(--faint)}
.task-row .st.review{background:var(--wine)} .task-row .st.progress{background:var(--moss)} .task-row .st.upcoming{background:transparent;border:1.5px solid var(--faint)}
.task-row.sel{background:var(--cream);box-shadow:inset 2.5px 0 0 var(--wine),0 1px 2px rgba(60,30,30,.06)}
.task-row.sel .label{color:var(--wine-deep);font-weight:700}
/* A experiment: flat Task rows with an inline open-conversation count; no nested Session rows */
.task-row.flat .label{padding-left:24px}
.task-row .convs{flex:none;display:inline-flex;align-items:center;gap:4px;height:22px;margin-right:6px;padding:0 6px;border-radius:11px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.task-row .convs svg{width:12px;height:12px}
.task-row .convs:hover{background:rgba(114,47,55,.08);color:var(--wine-deep)}
.task-row.sel .convs{color:var(--wine-deep)}
.sess-row .label{font-size:12.5px;color:var(--ink-2);gap:7px}
.sess-row .label svg{color:var(--faint)}
.sess-row.sel .label{color:var(--wine-deep)}
.sess-row.sel{background:rgba(114,47,55,.07)}
.empty-row{padding:4px 0 6px 52px;color:var(--faint);font-size:12px;font-style:italic}
.err-row{margin:4px 6px 6px 30px;padding:7px 9px;border-radius:6px;background:var(--ochre-wash);color:#6B4A1A;font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.err-row button{text-decoration:underline;text-underline-offset:2px}
.nomatch{padding:18px 16px;color:var(--muted);font-size:12.5px}
.ind1{padding-left:14px}.ind2{padding-left:30px}.ind3{padding-left:50px}
.outline.scoped .wave-row{padding-left:0}.outline.scoped .wave-row:first-child{margin-top:0}
.outline.scoped .task-row{padding-left:16px}.outline.scoped .sess-row.ind3{padding-left:36px}
.outline.scoped .sess-row.ind1{padding-left:6px}.outline.scoped .empty-row{padding-left:38px}
.outline.scoped .err-row{margin:10px 4px 4px 8px}

/* ---------- panes / terminal ---------- */
.panes{display:grid;gap:6px;height:100%;min-height:0;padding:6px;background:var(--char-2)}
.pane{background:var(--char);border-radius:7px;display:flex;flex-direction:column;min-height:0;min-width:0;color:var(--t-ink);border:1px solid var(--char-line);position:relative;overflow:hidden}
.pane.focused{border-color:#8E5A60;box-shadow:inset 0 2px 0 #B5727A}
.phead{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 12px;border-bottom:1px solid var(--char-line);font-size:12px;color:var(--t-dim);flex:none;background:rgba(255,255,255,.015)}
.phead .kind{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#B7A99B}
.phead .name{color:var(--t-ink);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phead .owner{color:var(--t-dim);white-space:nowrap}
.phead .typing{margin-left:auto;font-size:10.5px;color:#D9A0A7;display:flex;align-items:center;gap:5px;white-space:nowrap}
.phead .typing::before{content:"";width:6px;height:6px;border-radius:50%;background:#D9A0A7}
.phead .spacer{margin-left:auto}
.phead .x{width:24px;height:24px;display:grid;place-items:center;border-radius:5px;color:var(--t-dim)}
.phead .x:hover{background:var(--char-3);color:var(--t-ink)}
.term{flex:1;overflow:auto;padding:14px 16px 8px;font-family:var(--mono);font-size:12.5px;line-height:1.62;min-height:0}
.term .l{white-space:pre-wrap;margin:0 0 9px}
.term .who{color:var(--t-dim);display:block;font-size:11px;margin-bottom:1px}
.term .you{color:var(--t-you)}
.term .dim{color:var(--t-dim)} .term .ok{color:var(--t-ok)} .term .warn{color:var(--t-warn)}
.term .marker{font-size:10.5px;color:var(--t-dim);border:1px dashed var(--char-line);border-radius:4px;padding:1px 6px;display:inline-block;margin-bottom:12px;font-family:var(--sans);letter-spacing:.04em}
.cursor{display:inline-block;width:7px;height:14px;background:var(--t-ink);vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.composer{border-top:1px solid var(--char-line);padding:10px 14px 8px;display:flex;gap:10px;align-items:flex-start;flex:none}
.composer .p{font-family:var(--mono);color:#D9A0A7;padding-top:2px}
.composer textarea{flex:1;background:transparent;border:0;resize:none;color:var(--t-ink);font-family:var(--mono);font-size:12.5px;line-height:1.55;min-height:40px;outline:none}
.composer textarea::placeholder{color:#6F6C67}
.cfoot{display:flex;gap:10px;padding:0 14px 8px 36px;font-size:10.5px;color:#77746E;flex:none}
.cfoot .kept{color:var(--t-ok)}
.pstate{flex:1;display:grid;place-items:center;padding:24px;text-align:center}
.pstate .box{max-width:340px;font-size:13px;line-height:1.55;color:var(--t-ink)}
.pstate h4{font-family:var(--serif);font-weight:600;font-size:21px;margin:0 0 6px;color:#F1EAE0}
.pstate p{margin:0 0 14px;color:var(--t-dim)}
.pstate .btn{background:transparent;border-color:#5B6168;color:var(--t-ink)}
.pstate .btn:hover{background:var(--char-3)}
.pstate .btn.primary{background:#8A3A44;border-color:#8A3A44;color:#fff}
.mon{flex:1;overflow:auto;padding:12px 14px;font-size:12.5px;min-height:0}
.mon .read{display:flex;align-items:center;gap:8px;color:var(--t-dim);font-size:11.5px;margin-bottom:10px;flex-wrap:wrap}
.mon .read .ok{color:var(--t-ok)} .mon .read .warn{color:var(--t-warn)}
.mon .read button{color:var(--t-ink);text-decoration:underline;text-underline-offset:2px}
.run{border:1px solid var(--char-line);border-radius:6px;padding:9px 11px;margin-bottom:8px;background:rgba(255,255,255,.02)}
.run .top{display:flex;align-items:center;gap:8px;color:var(--t-ink);font-weight:700}
.run .top .live{width:7px;height:7px;border-radius:50%;background:var(--t-ok);box-shadow:0 0 0 3px rgba(156,184,140,.15)}
.run .meta{color:var(--t-dim);font-size:11.5px;margin-top:3px;font-family:var(--mono)}
.gap{border:1px dashed #6E5A3A;color:var(--t-warn);border-radius:6px;padding:8px 10px;font-size:12px;margin-bottom:8px}
.gap details summary{cursor:pointer;color:var(--t-ink)}
.gap pre{font-family:var(--mono);font-size:11px;color:var(--t-dim);white-space:pre-wrap;margin:6px 0 0}

/* ---------- context blocks ---------- */
.ctx h1{font-family:var(--serif);font-weight:600;letter-spacing:-.005em;margin:0;color:var(--ink);line-height:1.08}
.ctx .brief{color:var(--ink-2);line-height:1.55}
.outcome{list-style:none;padding:0;margin:0}
.outcome li{display:flex;gap:9px;align-items:baseline;padding:3px 0;color:var(--ink-2)}
.outcome li::before{content:"";width:5px;height:5px;border:1.5px solid var(--wine-soft);border-radius:50%;flex:none;transform:translateY(-1px)}
.sessions-list{display:flex;flex-direction:column;gap:2px}
.sline{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:6px;border:1px solid transparent}
.sline:hover{background:#fff;border-color:var(--line)}
.sline.sel{background:#fff;border-color:var(--line-2)}
.sline .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sline .agent{font-size:11.5px;color:var(--muted)}
.label-sm{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700}
.detailsbody{font-size:13px;line-height:1.6;color:var(--ink-2)}
.detailsbody h5{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.detailsbody p{margin:0 0 10px}
.detailsbody ul{margin:0 0 10px;padding-left:18px}
.detailsbody code,.diag{font-family:var(--mono);font-size:11.5px}
.diag{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 12px;white-space:pre-wrap;color:var(--ink-2)}
.ids{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:11.5px;color:var(--muted)}
.ids span:nth-child(odd){color:var(--faint)}
.ids span:nth-child(even){font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#F6EFE6;padding:9px 14px;border-radius:8px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:all .2s;pointer-events:none;z-index:50;max-width:80vw}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* =========================================================
   A · Work led
   ========================================================= */
.va .app{display:grid;grid-template-columns:var(--sw,272px) 1fr;grid-template-rows:48px minmax(0,1fr);height:100vh;transition:grid-template-columns .18s}
/* One frame: the repository header and its outline share one paper column; main's top rule stops at that column. */
.va .hrepo{grid-column:1;grid-row:1;background:var(--paper);border-right:1px solid var(--line);display:flex;align-items:center;padding:0 8px;min-width:0;overflow:hidden;position:relative}
.va .rsw{display:flex;align-items:center;height:38px;padding-right:8px;border-radius:7px;min-width:0;max-width:100%;transition:background .12s}
.va .rsw:hover,.va .rsw[aria-expanded="true"]{background:rgba(114,47,55,.06)}
.va .rsw .slot{width:22px;flex:none}
.va .rsw .mk{width:9px;height:9px;border-radius:2.5px;background:var(--wine);flex:none;margin-right:10px;box-shadow:0 0 0 3px var(--wine-wash)}
.va .rsw .mk.all{background:transparent;border:1.5px solid var(--wine);box-shadow:none}
.va .rsw .nm{font-family:var(--serif);font-weight:600;font-size:22px;color:var(--ink);letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}
.va .rsw svg{color:var(--faint);margin-left:7px;margin-top:3px}
.va .rsw.compact{height:26px;padding:0 6px;margin-left:-6px}
.va .rsw.compact .nm{font-family:var(--sans);font-weight:400;font-size:12.5px;color:var(--muted)}
.va .rsw.compact svg{margin:0 0 0 3px;width:12px;height:12px}
.va .rmenu{position:absolute;top:46px;left:8px;width:250px;background:var(--cream);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 18px 40px -18px rgba(50,20,24,.35);padding:5px;z-index:30}
.va .app{position:relative}
.va .rmenu.at-top{left:52px;top:42px}
.va .rmenu button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 9px;border-radius:6px}
.va .rmenu button:hover,.va .rmenu button:focus-visible{background:var(--sand);box-shadow:none}
.va .rmenu .mk{width:8px;height:8px;border-radius:2px;background:var(--wine-soft);flex:none}
.va .rmenu .mk.all{background:transparent;border:1.5px solid var(--wine-soft)}
.va .rmenu [aria-checked="true"] .mk{background:var(--wine)}
.va .rmenu [aria-checked="true"] .mk.all{background:transparent;border-color:var(--wine)}
.va .rmenu .nm{flex:1;min-width:0}
.va .rmenu .nm b{display:block;font-weight:700;font-size:13px;color:var(--ink)}
.va .rmenu .nm small{display:block;font-size:11.5px;color:var(--muted)}
.va .rmenu .nm small.warn{color:#8A5E1E}
.va .rmenu .ck{color:var(--wine);font-size:12px;visibility:hidden}
.va .rmenu [aria-checked="true"] .ck{visibility:visible}
.va .rmenu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.va .mscrim{position:fixed;inset:0;z-index:29}
.va.side-off .app{--sw:0px}
.va .side{grid-column:1;grid-row:2;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.va .side .scroll{flex:1;overflow:auto;min-height:0}
.va .side .outline{padding-top:0}
.va .side .dock{flex:none;border-top:1px solid var(--line);padding:9px 10px 7px;background:var(--paper)}
.va .side .dock .search{margin:0}
.va .side .foot{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:11px;padding:6px 3px 0}
.va main{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.va .top{height:48px;display:flex;align-items:center;gap:10px;padding:0 16px 0 14px;border-bottom:1px solid var(--line);flex:none}
.va .top .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.va .page{padding:26px 44px 18px;flex:none;max-width:980px;width:100%}
.va .page .eyebrow{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.va .page h1{font-size:40px}
.va .page .brief{font-size:17px;margin:10px 0 0;max-width:640px}
.va .page .cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;margin-top:20px}
.va .page .actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.va .page.slim{padding:14px 44px 12px}
.va .page.slim h1{font-size:26px}
.va .work{flex:1;min-height:220px;margin:0 16px 16px;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:var(--char-2);box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 10px 30px -18px rgba(40,20,20,.5)}
.va .wbar{display:flex;align-items:center;gap:4px;height:38px;padding:0 10px;color:var(--t-dim);font-size:12px;border-bottom:1px solid #1C1F23;flex:none}
.va .wbar .ttl{color:#CFC6BA;margin-right:10px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.va .wbar .ttl b{color:#F0E8DD}
.va .wbar .tg{height:26px;padding:0 10px;border-radius:5px;color:var(--t-dim);display:inline-flex;gap:6px;align-items:center}
.va .wbar .tg:hover{background:var(--char-3);color:var(--t-ink)}
.va .wbar .tg[aria-pressed="true"]{color:#F0E8DD;background:#3A3036}
.va .wbar .right{margin-left:auto;display:flex;gap:4px;align-items:center}
.va .panes{flex:1;padding:0 6px 6px}
.va .panes.n1{grid-template-columns:1fr}
.va .panes.n2{grid-template-columns:1.45fr 1fr}
.va .panes.n3{grid-template-columns:1.45fr 1fr;grid-template-rows:1fr 1fr}
.va .panes.n3 .pane.p-session{grid-row:1/3}
.va .drawer{position:absolute;top:48px;right:0;bottom:0;width:min(460px,92%);background:var(--cream);border-left:1px solid var(--line);box-shadow:-18px 0 40px -24px rgba(40,20,20,.35);transform:translateX(102%);transition:transform .2s;overflow:auto;padding:22px 26px;z-index:5}
.va .drawer.open{transform:none}
.va .wavepage{padding:30px 44px;overflow:auto;flex:1}

/* ---------------- outline (shared) ---------------- */
function outline(opts={}){
  const searching = !!S.q; let any = false; let out = "";
  const only = opts.scope && opts.scope!=="all" ? repoOf(opts.scope) : null; // A: one repository, no repeated root row
  for (const repo of (only ? [only] : REPOS)){
    const tasksIn = repo.waves.flatMap(w=>w.tasks).map(id=>TASKS[id]).filter(t=>!opts.flat || t.started);
    const looseIn = repo.loose.map(id=>SESSIONS[id]).filter(sessMatch);
    const repoHit = tasksIn.some(matches) || looseIn.length || !searching;
    if (!repoHit) continue; any = true;
    const ro = only || searching || S.openRepos[repo.id];
    const errRow = repo.error ? `<div class="err-row" role="status"><span>${esc(repo.error)}.</span><button data-act="retry" data-id="${repo.id}">Retry</button><button data-act="errdetail" title="lf session list exited 1: store is migrating (sample)">Details</button></div>` : "";
    if (!only) out += `<div class="row repo-row" role="treeitem" aria-level="1" aria-expanded="${ro}">
      <button class="disc" data-act="repo" data-id="${repo.id}" aria-expanded="${ro}" aria-label="${ro?"Collapse":"Expand"} ${repo.name}">${I.chev}</button>
      <button class="label" data-act="repo" data-id="${repo.id}"><span class="t">${repo.name}</span></button></div>`;
    if (!ro) continue;
    if (!only) out += errRow;
    for (const w of repo.waves){
      const started = w.tasks.map(id=>TASKS[id]).filter(t=>!opts.flat || t.started);
      const ts = started.filter(matches);
      if (searching && !ts.length) continue;
      const wo = searching || S.openWaves[w.id];
      const wsel = S.sel.kind==="wave" && S.sel.id===w.id;
      out += `<div class="row wave-row ind1${wsel?" sel":""}" role="treeitem" aria-level="2">
        <button class="disc" data-act="wave" data-id="${w.id}" aria-expanded="${wo}" aria-label="${wo?"Collapse":"Expand"} ${w.name}">${I.chev}</button>
        <button class="label" data-act="selwave" data-id="${w.id}" aria-current="${wsel}" title="Open ${w.name} — objective and plan"><span class="dot" style="background:${w.color}"></span><span class="t">${w.name}</span><span class="count">${started.length||""}</span></button></div>`;
      if (!wo) continue;
      if (!started.length){ out += `<div class="empty-row">${w.planError?"Plan unavailable":opts.flat?"No started Tasks":"No active Tasks"}</div>`; continue; }
      for (const t of ts){
        const tsel = S.sel.kind==="task" && S.sel.id===t.id;
        const has = t.sessions.length>0; const to = searching || !!S.openTasks[t.id];
        if (opts.flat){ // A: one row per Task; open conversations shown as an inline count
          const n = t.sessions.length; const cl = `${n} open conversation${n===1?"":"s"}`;
          const opens = n===1 && SESSIONS[t.sessions[0]].where==="here" ? `Open “${esc(SESSIONS[t.sessions[0]].title)}”` : "Open Task";
          out += `<div class="row task-row flat ind2${tsel?" sel":""}" role="treeitem" aria-level="3" aria-selected="${tsel}">
          <button class="label" data-act="opentask" data-id="${t.id}" title="${esc(t.title)} · ${t.key} · ${t.stateLabel} — ${opens}"><span class="st ${t.state}" aria-hidden="true"></span><span class="t">${esc(t.title)}</span>${n?`<span class="sr">, ${cl}</span>`:""}</button>
          ${n?`<button class="convs" data-act="inspecttask" data-id="${t.id}" aria-label="${cl} — show ${esc(t.title)} overview" title="${cl} — show the Task overview">${I.term}<span aria-hidden="true">${n}</span></button>`:""}</div>`;
          continue;
        }
        out += `<div class="row task-row ind2${tsel?" sel":""}" role="treeitem" aria-level="3" aria-selected="${tsel}">
          <button class="disc${has?"":" none"}" data-act="task" data-id="${t.id}" ${has?`aria-expanded="${to}" aria-label="${to?"Hide":"Show"} Sessions for ${esc(t.title)}"`:'tabindex="-1" aria-hidden="true"'}>${I.chev}</button>
          <button class="label" data-act="seltask" data-id="${t.id}" title="${esc(t.title)} · ${t.key} · ${t.stateLabel}"><span class="st ${t.state}" aria-hidden="true"></span><span class="t">${esc(t.title)}</span></button></div>`;
        if (has && to) for (const sid of t.sessions){
          const s = SESSIONS[sid]; const ssel = tsel && S.ws[t.id].session===sid;
          out += `<div class="row sess-row ind3${ssel?" sel":""}" role="treeitem" aria-level="4">
            <button class="label" data-act="selsession" data-id="${sid}" title="${esc(s.title)} · ${s.agent}">${I.term}<span class="t">${esc(s.title)}</span></button></div>`;
        }
      }
    }
    for (const s of looseIn){
      const ssel = S.sel.kind==="loose" && S.sel.id===s.id;
      out += `<div class="row sess-row ind1${ssel?" sel":""}" role="treeitem" aria-level="2" style="margin-top:6px">
        <button class="label" data-act="selloose" data-id="${s.id}" title="Not attached to a Task — attribution unknown">${I.term}<span class="t">${esc(s.title)}</span><span class="loc unknown">no Task</span></button></div>`;
    }
    if (only) out += errRow; // scoped: the read warning follows the data, quietly
  }
  if (!any) out = `<div class="nomatch">No Work or Sessions${only?" in "+esc(only.name):""} match “${esc(S.q)}”.<br><button class="btn small ghost" data-act="clearq" style="margin-top:8px;padding-left:0">Clear search</button></div>`;
  return `<div class="outline${only?" scoped":""}" role="tree" aria-label="${only?"Work in "+esc(only.name):"Work"}">${out}</div>`;
}

  if (!root.contains(document.activeElement) || document.activeElement===document.body) root.querySelector(`[data-fk="zoom-${z}"]`)?.focus();

function zoomContext(t, keptNote=""){

}
function repoMenu(atTop){
  if (!S.repoMenu) return "";

  return `<div class="mscrim" data-act="repomenu"></div><div class="rmenu${atTop?" at-top":""}" role="menu" aria-label="Repository">

function setScope(sc){
  S.repoMenu = false;

  if (S.scope==="all"){ const r=selRepo(); const lt=TASKS[S.lastTask]; S.scopeMem[r] = {sel:{...S.sel}, lastTask: lt && lt.repo===r ? S.lastTask : S.scopeMem[r].lastTask, q:""}; }
  const m = S.scopeMem[sc];
  if (m){ S.sel={...m.sel}; S.lastTask=m.lastTask; S.q=m.q; } else S.q="";

}

/* ---------------- render + focus retention ---------------- */
const root = document.getElementById("root");
function render(){
  const a = document.activeElement; const fk = a && a.dataset ? a.dataset.fk : null;
  const sel = fk && a.selectionStart!=null ? [a.selectionStart,a.selectionEnd] : null;
  if (S.zoom>0 && zoomBlock()) S.zoom = 0;
  const zc = S.v==="a" && S.zoom>0 ? " zoomed z"+S.zoom : "";
  document.body.className = "v"+S.v + zc + (S.sideOff?(S.v==="a"?" side-off":" rail-off"):"") + (S.navOff?" nav-off":"") + (S.inspOff?" insp-off":"") + (S.inspSm?" insp-open-sm":"");
  root.innerHTML = S.v==="a" ? renderA() : S.v==="b" ? renderB() : renderC();
  if (fk){ const el = root.querySelector(`[data-fk="${fk}"]`); if (el){ el.focus({preventScroll:true}); if (sel && el.setSelectionRange) el.setSelectionRange(sel[0],sel[1]); } }
}
function focusDraft(){ const w=ws(); if(!w||!w.session) return; const el=root.querySelector(`[data-draft="${w.session}"]`); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length);} }

/* ---------------- actions ---------------- */
function selectTask(id){ S.sel={kind:"task",id}; S.lastTask=id; S.switcher=false; S.zoom=0; }
// A experiment: a Task with exactly one local open conversation opens straight into it (Session + context).
// None, several, or one open elsewhere: the Task Overview, where the choice stays explicit.
function foregroundSession(tid, sid){ const w=S.ws[tid]; w.session=sid; w.focus="session"; S.detailsOpen=false; S.zoomDir="in"; S.zoom=1; render(); S.zoomDir=null; focusDraft(); }
function openTask(id){
  const t=TASKS[id]; selectTask(id); S.detailsOpen=false;
  const only = t.sessions.length===1 ? SESSIONS[t.sessions[0]] : null;
  if (only && only.where==="here"){ foregroundSession(id, only.id); return; }
  if (only) S.ws[id].session=only.id; // shown with its explicit Move-here choice
  render();
}
root.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (S.currentData && ["newconv","startconv","movehere","retry","refresh","retrymon"].includes(act)) return;
  if (act==="focus"){ // pane focus: only when clicking pane chrome, not inner buttons
    if (e.target.closest("button,textarea,summary,a")) return;
    const w=ws(); if (w){ w.focus=el.dataset.pane; render(); if (w.focus==="session") focusDraft(); } return;
  }
  e.stopPropagation();
  switch(act){
    case "repo": S.openRepos[id]=!S.openRepos[id]; break;
    case "wave": S.openWaves[id]=!S.openWaves[id]; break;
    case "task": S.openTasks[id]=!S.openTasks[id]; break;
    case "selwave": S.sel={kind:"wave",id}; S.switcher=false; S.detailsOpen=false; S.zoom=0; break;
    case "seltask": selectTask(id); break;
    case "opentask": openTask(id); return;
    case "inspecttask": selectTask(id); S.detailsOpen=false; break;
    case "selsession": { const s=SESSIONS[id]; if (S.v==="a" && s.where==="here"){ selectTask(s.task); foregroundSession(s.task, id); return; } selectTask(s.task); S.ws[s.task].session=id; S.ws[s.task].focus="session"; S.openTasks[s.task]=true; render(); focusDraft(); return; }
    case "selloose": S.sel={kind:"loose",id}; S.switcher=false; S.detailsOpen=false; S.zoom=0; render(); focusDraft(); return;
    case "zoom": setZoom(+el.dataset.z); return;
    case "repomenu": S.repoMenu=!S.repoMenu; render(); if (S.repoMenu) root.querySelector(`.rmenu [aria-checked="true"]`)?.focus(); else rswEl()?.focus(); return;
    case "scope": setScope(id); render(); rswEl()?.focus(); return;
    case "togglecomp": { const w=ws(); w.companion=!w.companion; w.focus = w.companion?"companion":"session"; if(!w.companion) toast("Shell hidden — it keeps running in this workspace."); break; }
    case "togglemon": { const w=ws(); w.monitor=!w.monitor; if(w.monitor) w.focus="monitor"; else if(w.focus==="monitor") w.focus="session"; break; }
    case "continue": { const w=ws(); w.focus="session"; render(); focusDraft(); return; }
    case "movehere": { SESSIONS[id].where="here"; toast("Sample: conversation shown here. Nothing was moved."); break; }
    case "startconv": case "newconv": {
      const t=TASKS[id]; const sid="s-new-"+(++S.n); SESSIONS[sid]={id:sid,title:"New conversation"+(S.n>1?" "+S.n:""),task:id,agent:"Codex",where:"here",run:"run_sample_"+S.n,lines:[["codex",`Ready to talk about “${t.title}”. (Sample — no provider is running.)`]]};
      t.started=true; t.sessions.push(sid); S.ws[id].session=sid; S.ws[id].focus="session"; S.openTasks[id]=true; selectTask(id); render(); focusDraft(); return; }
    case "refresh": S.reads[id]=nowStr(); toast("Monitor re-read (sample data)."); break;
    case "retrymon": RUNS[id].complete=true; RUNS[id].gap=null; S.reads[id]=nowStr(); toast("Sample retry: ownership confirmed."); break;
    case "retry": { const r=repoOf(id); r.error=null; toast("Sample retry succeeded for "+r.name+"."); break; }
    case "errdetail": toast("lf session list exited 1 — store is migrating (sample)."); return;
    case "clearq": S.q=""; break;
    case "details": S.detailsOpen=!S.detailsOpen; break;
    case "slim": S.briefSlim=!S.briefSlim; break;
    case "side": S.sideOff=!S.sideOff; break;
    case "nav": S.navOff=!S.navOff; break;
    case "insp": if (matchMedia("(max-width:1240px)").matches) S.inspSm=!S.inspSm; else S.inspOff=!S.inspOff; break;
    case "ctxmore": S.ctxMore=!S.ctxMore; break;
    case "switcher": S.switcher=!S.switcher; render(); if (S.switcher) root.querySelector('.switcher input')?.focus(); return;
  }
  render();
});
root.addEventListener("toggle", e=>{ if (e.target.dataset && e.target.dataset.det) S.detailsOpen=e.target.open; }, true);
root.addEventListener("input", e=>{
  const t=e.target;
  if (t.dataset.inp==="q"){ S.q=t.value; render(); }
  else if (t.dataset.draft){ S.drafts[t.dataset.draft]=t.value; const f=t.closest(".pane").querySelector(".cfoot span"); if(f){f.textContent=t.value?"Draft kept with this Session":"Draft is kept when you navigate"; f.className=t.value?"kept":"";} }
});
root.addEventListener("focusin", e=>{
  const p = e.target.closest && e.target.closest(".pane"); const w=ws();
  if (p && w && e.target.dataset.draft && w.focus!=="session"){ w.focus="session"; render(); focusDraft(); }
});
root.addEventListener("keydown", e=>{
  const t=e.target;
  if (t.dataset && t.dataset.draft && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); toast("Sample workspace — nothing was sent. Your draft is kept."); }
});
document.addEventListener("keydown", e=>{
  const typing = e.target.matches && e.target.matches("input,textarea");
  if (S.repoMenu && S.v==="a" && (e.key==="ArrowDown"||e.key==="ArrowUp")){ e.preventDefault(); const items=[...root.querySelectorAll(".rmenu button")]; const i=items.indexOf(document.activeElement); items[(i+(e.key==="ArrowDown"?1:-1)+items.length)%items.length]?.focus(); return; }
  if (e.key==="/" && !typing && S.v==="a"){ e.preventDefault(); if (S.zoom>0||S.sideOff){ S.sideOff=false; S.zoomDir=S.zoom>0?"out":null; S.zoom=0; render(); S.zoomDir=null; } root.querySelector('[data-inp="q"]')?.focus(); return; }
  if (e.key==="/" && !typing){ e.preventDefault(); if (S.v==="c" && (S.sideOff || matchMedia("(max-width:1100px)").matches)){ S.switcher=true; render(); root.querySelector(".switcher input")?.focus(); } else root.querySelector('[data-inp="q"]')?.focus(); }
  else if (e.key==="Escape"){ if (S.repoMenu){S.repoMenu=false;render();rswEl()?.focus();} else if (S.switcher){S.switcher=false;render();} else if (S.inspSm && S.v==="b"){S.inspSm=false;render();} else if (S.detailsOpen && S.v==="a"){S.detailsOpen=false;render();} else if (S.q && typing && e.target.dataset.inp==="q"){S.q="";render();} else if (S.v==="a" && S.zoom>0){e.preventDefault(); setZoom(S.zoom-1);} }
  else if ((e.metaKey||e.ctrlKey) && e.key==="\\"){ e.preventDefault(); if (S.v==="b") S.navOff=!S.navOff; else if (S.v==="a" && S.zoom>0){ S.sideOff=false; setZoom(0); return; } else S.sideOff=!S.sideOff; render(); }
});
function setDirection(v){ if(S.currentData) return; if(!["a","b","c"].includes(v)) return; S.v=v; S.switcher=false; S.inspSm=false; S.repoMenu=false; render(); }
window.addEventListener("message", e=>{ const d=e.data; if (d && d.type==="direction") setDirection(d.value); });
matchMedia("(max-width:1240px)").addEventListener("change", () => render());
window.setDirection = setDirection;
</script>
