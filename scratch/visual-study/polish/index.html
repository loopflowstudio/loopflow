<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loopflow — four polish directions</title>
<link rel="stylesheet" href="polish.css">
</head>
<body>
<header class="study" aria-label="Study controls">
  <div class="study-group" role="group" aria-label="Direction">
    <span class="study-label">Direction</span>
    <button data-v="a">A · Quiet editorial</button>
    <button data-v="b">B · Crisp tool</button>
    <button data-v="c">C · Warm spacious</button>
    <button data-v="d">D · Combined</button>
  </div>
  <div class="study-group" role="group" aria-label="Surface">
    <span class="study-label">Surface</span>
    <button data-surface="wave">Wave</button>
    <button data-surface="task">Task</button>
    <button data-surface="session">Session</button>
  </div>
  <span class="study-sample">Sample data</span>
</header>
<div id="app" class="app"></div>
<script src="polish.js"></script>
</body>
</html>
