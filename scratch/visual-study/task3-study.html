<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loopflow · Open Sessions</title>
<style>
@font-face{font-family:Lato;src:url('../../swift/Loopflow/Fonts/Lato-Regular.ttf')}@font-face{font-family:Lato;src:url('../../swift/Loopflow/Fonts/Lato-Bold.ttf');font-weight:700}
*{box-sizing:border-box}body{margin:0;background:#eae5de;color:#30282a;font:14px Lato,sans-serif}header{padding:14px 24px;display:flex;align-items:center;gap:22px;background:#faf8f5;border-bottom:1px solid #d9d0c7}header strong{color:#722f37}nav{display:flex;align-items:center;gap:5px;margin-left:auto}button,a{font:inherit}button{border:0;border-radius:5px;padding:10px 14px;background:transparent;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#722f37;color:#fff}a{color:#722f37;text-underline-offset:3px}nav a{margin-left:18px}button:focus-visible,a:focus-visible{outline:3px solid #b2723c;outline-offset:3px}.intro{padding:14px 24px;color:#706765;font-size:12px;line-height:1.5}.intro p{margin:0}.caption{padding:4px 24px 12px;display:flex;align-items:baseline;gap:16px}.caption h1{font-size:17px;margin:0}.caption p{margin:0;color:#706765}.caption a{margin-left:auto}.window{margin:0 24px 24px;height:calc(100dvh - 188px);min-height:500px;border:1px solid #c7bfb5;border-radius:8px;overflow:hidden;background:#faf8f5;box-shadow:0 6px 20px #30282a08}iframe{width:100%;height:100%;border:0;display:block}@media(max-width:1000px){header{flex-wrap:wrap;gap:8px}nav{margin:0;flex-wrap:wrap}.caption{flex-wrap:wrap}.caption p{order:3;flex-basis:100%}.window{margin:0 10px 20px;height:750px}}
</style></head><body>
<header><strong>loopflow</strong><span>Task 3 · Open Sessions</span><nav aria-label="Session scenario"><button data-state="one" aria-pressed="true">One Session</button><button data-state="multiple" aria-pressed="false">Three Sessions</button><a href="task2-study.html">Task 2 ↗</a></nav></header>
<div class="intro"><p>Captured Linear title and description; simulated Sessions, transcripts and execution. Typing stays in this prototype. No provider is connected.</p></div>
<div class="caption"><h1 id="scenario-title">One open Session</h1><p id="scenario-description">Clicking the Task opens its named Session.</p><a id="open-page" href="#" target="_blank" rel="noopener">Open Task ↗</a></div>
<main class="window"><iframe id="task-frame" title="Task execution workspace"></iframe></main>
<script>
const scenarios={one:['One open Session','Clicking the Task opens its named Session.'],multiple:['Three open Sessions','Choose a conversation from the Task overview; switch without losing your draft.']};
function select(state,load=true){if(!scenarios[state])return;document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===state)));document.getElementById('scenario-title').textContent=scenarios[state][0];document.getElementById('scenario-description').textContent=scenarios[state][1];const url='mockups.html?v=a&population=current&task=LOO-285&flowstudy=c&execution=running&sessions='+state;document.getElementById('open-page').href=url;if(load)document.getElementById('task-frame').src=url;history.replaceState(null,'','#'+state)}
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>select(b.dataset.state));

select(scenarios[location.hash.slice(1)]?location.hash.slice(1):'one');
</script></body></html>
