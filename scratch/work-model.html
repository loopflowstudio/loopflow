<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>How work fits together · Loopflow</title>
<style>
:root{--ink:#202b28;--muted:#53665d;--paper:#f6f5ef;--line:#cfd6cb;--green:#256848;--violet:#665290;--gold:#986321}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:1210px;margin:auto;padding:25px 5vw 44px}header{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:680;border-bottom:1px solid var(--line);padding-bottom:16px}.mark{width:20px;height:20px;background:repeating-linear-gradient(135deg,#30684e 0 4px,transparent 4px 7px);border-radius:5px}h1,h2{font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;font-weight:500;letter-spacing:-.045em}h1{font-size:clamp(40px,5.5vw,76px);line-height:1.04;margin:28px 0 10px}.intro{color:var(--muted);margin:0 0 25px;max-width:72ch}.tabs{display:flex;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #b76c21;outline-offset:3px}.tabs button{border:0;border-bottom:3px solid transparent;background:transparent;padding:10px 16px;font-weight:650}.tabs button[aria-pressed=true]{border-color:var(--green);color:var(--green);background:#e5ecdf;border-radius:7px 7px 0 0}.scene{padding:22px 0 10px}.scene h2{font-size:clamp(28px,3.6vw,47px);margin:0;line-height:1.16}.scene p{margin:7px 0 10px;color:var(--muted);max-width:86ch}.board{display:grid;grid-template-columns:1.18fr 1fr;border:1px solid #b9c5b8;border-radius:14px;overflow:hidden;box-shadow:0 5px 18px #223e2b0a}.pane{padding:18px clamp(16px,2.1vw,30px) 22px;background:#ecf1e8}.outside{background:#f1eef5;border-left:1px solid #cfc9d8}.panehead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:16px}.panehead strong{font-size:18px}.panehead span,.kind,.key{font:600 11px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.035em}.panehead span{color:var(--muted)}.node{border:1px solid #c4d0c2;background:#fcfdf8;border-radius:8px;padding:8px 12px;line-height:1.35;position:relative}.node b{display:block;font-size:15px}.node small{display:block;font-size:12px;color:var(--muted);margin-top:2px}.kind{color:var(--green);font-size:10px;text-transform:uppercase}.outside .kind{color:var(--violet)}.outside .node{border-color:#d1c9db;background:#fcfaff}.children{margin-left:14px;padding-left:18px;border-left:1.5px solid #839684}.children>.branch{padding-top:7px;position:relative}.children>.branch:before{content:'';position:absolute;left:-18px;top:28px;width:18px;border-top:1.5px solid #839684}.pair{display:grid;grid-template-columns:1fr 1fr;gap:7px}.pair .node{height:100%}.pairwrap{padding-top:7px}.outside .children{border-color:#aaa0b8}.empty{display:grid;place-content:center;min-height:245px;text-align:center;border:1px dashed #c6bdcf;border-radius:10px;padding:25px}.empty b{font:28px Georgia,serif}.empty p{font-size:14px;color:var(--muted);max-width:32ch;margin:10px auto}.note{font-size:13px;margin:14px 0 0;color:#51465f}.foot{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:18px}.foot section{border-top:2px solid var(--line);padding-top:10px}.foot h3{font-size:15px;margin:0 0 4px}.foot p{font-size:14px;margin:0;color:var(--muted)}.key{display:inline-block;color:var(--violet);background:#ece6f5;border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:middle}.dep{color:var(--gold);font-weight:650}footer{font-size:12px;color:var(--muted);margin-top:18px}.board .branch:last-child{padding-bottom:0}@media(max-width:710px){main{padding:18px 15px 30px}.board,.foot{grid-template-columns:1fr}.outside{border-left:0;border-top:1px solid #cfc9d8}.tabs{gap:1px}.tabs button{padding:8px;font-size:13px}.foot{gap:12px}.empty{min-height:140px}.pane{padding:16px}.panehead{margin-bottom:11px}}@media print{.tabs{display:none}.board{break-inside:avoid}body{background:white}}
</style></head><body><main><header><span class="mark" aria-hidden="true"></span>Loopflow <span style="font-weight:400;color:var(--muted)">/ Work model</span></header>
<h1>How work fits together</h1><p class="intro">Follow one launch from a standing Wave to the work that ships it. Switch teams to see which parts belong in Linear.</p>
<nav class="tabs" aria-label="Choose a scenario"><button aria-pressed="true">Solo company</button><button aria-pressed="false">Small startup</button><button aria-pressed="false">Team in a large org</button></nav>
<article id="scene" aria-live="polite"></article><footer>Proposed model · Illustrative work and issue identifiers</footer></main>
<script>
const data=[
{title:'One founder, several streams of work',intro:'You tend Billing over time. Its launch conversation can run independent Tasks, receive their results, and bring you back when the release needs a decision.',scope:'Your company',owner:'You conduct the launch',people:['Worker A','Worker B'],context:'Your plan',right:'No tracker connected',why:'The work tree, plan and Wave memory can travel on Loopflow’s Git refs. Your next checkout can read them without a product-branch commit.',close:'You check the rollout from the launch conversation and close Annual plans. Billing stays open with the pricing decision in its memory.'},
{title:'A startup shipping one launch together',intro:'Engineering and product both use Loopflow. The launch has independently shippable outcomes and a release date people follow in Linear, so the team connects it to a Project.',scope:'Startup workspace',owner:'Maya conducts the launch',people:['Alex','Jo'],context:'Team tracker',right:'Shared launch Project',why:'Maya sees both results in the parent conversation. Alex and Jo work from their own sessions. A pricing decision can go in Billing’s memory for the next launch.',close:'The team checks the production rollout, then closes the launch Wave and updates the linked Project. Billing continues.'},
{title:'One team inside a larger org',intro:'Your team owns its own Project inside a wider company rollout. Stakeholders follow your Project and issues in Linear as usual, while team memory above it and individual fan-out below it stay in Loopflow.',scope:'Your team’s workspace',owner:'Sam conducts delivery',people:['Ari','Lee'],context:'Organization tracker',right:'Team Project in org Initiative',why:'The org’s Initiative and Legal’s Project stay in Linear; Loopflow connects only to your team’s Project and its issues. Standing Billing memory above and Ari’s split under BIL-12 never clutter the company tracker.',close:'Sam verifies the launch, closes Launch annual plans, and marks the team’s Project complete. Finance closes the wider Initiative when Legal lands too.'}
];
const key=k=>k?'<span class="key">'+k+'</span>':'';
const node=(kind,name,detail='',k='')=>'<div class="node"><span class="kind">'+kind+'</span>'+key(k)+'<b>'+name+'</b>'+(detail?'<small>'+detail+'</small>':'')+'</div>';
const branch=x=>'<div class="branch">'+x+'</div>';
const children=(...x)=>'<div class="children">'+x.map(branch).join('')+'</div>';
function render(i){
 const s=data[i],startup=i===1,org=i===2,mapped=startup||org,launch=mapped?'Project':'';
 const migrate=org
  ?node('Task','Migrate prices',s.people[0],'BIL-12')+children('<div class="pair">'+node('Sub-task','Backfill invoices','Private to Ari')+node('Sub-task','Dry-run staging','Private to Ari')+'</div>')
  :node('Task','Migrate prices',s.people[0],startup?'BIL-12':'');
 const left=node('Standing Wave','Billing','Goal, memory and operating defaults')+children(node('Finite Wave','Launch annual plans',s.owner,launch)+children(
  org
   ?migrate
   :'<div class="pair">'+migrate+node('Task','Publish pricing page',s.people[1],startup?'BIL-13':'')+'</div>',
  ...(org?[node('Task','Publish pricing page',s.people[1],'BIL-13')]:[]),
  node('Task','Enable annual checkout','<span class="dep">Waits for the price migration to land</span>',mapped?'BIL-14':'')
 ));
 let right;
 if(!i)right='<div class="empty"><b>Loopflow on its own</b><p>File the work, run it, and pick it up again using the Git-backed plan and docs.</p></div>';
 if(startup)right=node('Project','Annual plans','One launch tracked across functions','Project')+children(node('Issue','Migrate prices','','BIL-12'),node('Issue','Publish pricing page','','BIL-13'),node('Issue','Enable annual checkout','Blocked by BIL-12','BIL-14'));
 if(org)right=node('Initiative','Company pricing rollout','Owned by Finance · outside Loopflow')+children(node('Team project','Annual plans','Owned by your team','Project')+children(node('Issue','Migrate prices','Assigned to Ari','BIL-12'),node('Issue','Publish pricing page','Assigned to Lee','BIL-13'),node('Issue','Enable annual checkout','Blocked by BIL-12','BIL-14')),node('Sibling project','Customer contract updates','Owned by Legal'));
 const mapnote=startup?'Matching tags connect each Wave or Task to its Linear item.':org?'Your team connects at its Project and issues. Ari’s split under BIL-12 stays local unless promoted to sub-issues.':'No external mapping is needed for a solo launch.';
 document.getElementById('scene').innerHTML='<div class="scene"><h2>'+s.title+'</h2><p>'+s.intro+'</p></div><div class="board"><section class="pane"><div class="panehead"><strong>Loopflow</strong><span>'+s.scope+'</span></div>'+left+'<p class="note">The first two Tasks can run in parallel. The third can start as soon as prices migrate.</p></section><section class="pane outside"><div class="panehead"><strong>Linear</strong><span>'+s.context+'</span></div>'+right+'<p class="note">'+mapnote+'</p></section></div><div class="foot"><section><h3>Who sees what</h3><p>'+s.why+'</p></section><section><h3>When the launch ends</h3><p>'+s.close+'</p></section></div>';
 document.querySelectorAll('nav button').forEach((b,j)=>b.setAttribute('aria-pressed',String(j===i)));
}
document.querySelectorAll('nav button').forEach((b,i)=>b.onclick=()=>render(i));render(0);
</script></body></html>
