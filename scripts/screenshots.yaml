# Two capture pipelines, one manifest.
#
#   uv run python scripts/capture_screenshots.py       # live product images for the site
#   uv run python scripts/generate_screenshots.py      # deterministic Wave-surface proof

# Public captures: the installed app against this repo's own registry.
website:
  - name: context-lab
    view: context-lab
    wave: product
    width: 1440
    height: 900
    delay: 8
    output: website/static/context-lab.png

  - name: wave-surface
    view: wave
    wave: product
    width: 1440
    height: 900
    delay: 8
    output: website/static/wave-surface.png

  - name: roadmap
    view: roadmap
    wave: product
    width: 1440
    height: 900
    delay: 8
    output: website/static/roadmap.png

# Stable Wave-surface proof, rendered offline from fixtures at both widths.
wave-proof:
  - name: wave-surface-selected-narrow
    mode: mock-waves
    width: 900
  - name: wave-surface-selected-wide
    mode: mock-waves
    width: 1440

  - name: wave-surface-child-narrow
    mode: mock-waves
    wave: cadenza
    width: 900
  - name: wave-surface-child-wide
    mode: mock-waves
    wave: cadenza
    width: 1440

  - name: wave-surface-loading-narrow
    mode: mock-waves
    detail_state: loading
    width: 900
  - name: wave-surface-loading-wide
    mode: mock-waves
    detail_state: loading
    width: 1440

  - name: wave-surface-error-narrow
    mode: mock-waves
    detail_state: error
    width: 900
  - name: wave-surface-error-wide
    mode: mock-waves
    detail_state: error
    width: 1440

  - name: wave-surface-empty-narrow
    mode: empty-workspaces
    width: 900
  - name: wave-surface-empty-wide
    mode: empty-workspaces
    width: 1440
