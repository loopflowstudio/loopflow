# One manifest drives both deterministic UI evidence and the live website.
#
#   uv run python scripts/refresh_website_screens.py
#   uv run python scripts/generate_screenshots.py --set wave-proof

screenshots:
  # Public captures. These always use the real registry and the promoted app.
  - name: context-lab
    type: live
    sets: [website]
    view: context-lab
    wave: product
    width: 1440
    height: 900
    delay: 8
    output: website/static/context-lab.png

  - name: wave-surface
    type: live
    sets: [website]
    view: wave
    wave: product
    width: 1440
    height: 900
    delay: 8
    output: website/static/wave-surface.png

  - name: roadmap
    type: live
    sets: [website]
    view: roadmap
    wave: product
    width: 1440
    height: 900
    delay: 8
    output: website/static/roadmap.png

  # Stable Wave-surface proof, rendered offline from fixtures at both widths.
  - name: wave-surface-selected-narrow
    type: uitest
    sets: [wave-proof]
    ui_test_mode: mock-waves
    width: 900
    delay: 2
  - name: wave-surface-selected-wide
    type: uitest
    sets: [wave-proof]
    ui_test_mode: mock-waves
    width: 1440
    delay: 2

  - name: wave-surface-child-narrow
    type: uitest
    sets: [wave-proof]
    ui_test_mode: mock-waves
    wave: cadenza
    width: 900
    delay: 2
  - name: wave-surface-child-wide
    type: uitest
    sets: [wave-proof]
    ui_test_mode: mock-waves
    wave: cadenza
    width: 1440
    delay: 2

  - name: wave-surface-loading-narrow
    type: uitest
    sets: [wave-proof]
    ui_test_mode: mock-waves
    ui_test_detail_state: loading
    width: 900
    delay: 2
  - name: wave-surface-loading-wide
    type: uitest
    sets: [wave-proof]
    ui_test_mode: mock-waves
    ui_test_detail_state: loading
    width: 1440
    delay: 2

  - name: wave-surface-error-narrow
    type: uitest
    sets: [wave-proof]
    ui_test_mode: mock-waves
    ui_test_detail_state: error
    width: 900
    delay: 2
  - name: wave-surface-error-wide
    type: uitest
    sets: [wave-proof]
    ui_test_mode: mock-waves
    ui_test_detail_state: error
    width: 1440
    delay: 2

  - name: wave-surface-empty-narrow
    type: uitest
    sets: [wave-proof]
    ui_test_mode: empty-workspaces
    width: 900
    delay: 2
  - name: wave-surface-empty-wide
    type: uitest
    sets: [wave-proof]
    ui_test_mode: empty-workspaces
    width: 1440
    delay: 2
