# Loopflow configuration

# Model to use (backend or backend:variant)
agent_model: claude:opus

# Context: files/directories to include by default
context: "."

# Exclude: patterns to ignore
exclude:
  - "*.lock"
  - "node_modules"
  - ".venv"

# Skip permission prompts; Codex bypasses sandbox (only use in trusted worktrees)
yolo: false

# Push commits to origin automatically
push: false

# Codebase summaries: LLM-generated overviews included in prompts
# Run `lfops summarize -a` to generate/refresh all configured summaries
# summaries:
#   - path: src
#     tokens: 16000
#     model: gemini

# Example pipelines
# pipelines:
#   ship:
#     tasks: [implement, rebase, polish, draft_commit]
#     pr: true
