include:
  - project.yml
name: LoopflowMobile
options:
  postGenCommand: ""
settings:
  base:
    # GhosttyKit's Simulator slice is arm64 only.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  LoopflowiOS:
    type: application
    platform: iOS
    sources:
      - path: LoopflowiOS
        excludes: [README.md]
      - path: LoopflowMac/ThirdPartyNotices/NOTICES.txt
        buildPhase: resources
      - path: ../third_party/notices/app-fonts.txt
        buildPhase: resources
    dependencies:
      - target: Loopflow
      # Package.swift's GhosttyKit pin; `swift package resolve` downloads it.
      - framework: .build/artifacts/swift/GhosttyKit/GhosttyKit.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreText.framework
      - sdk: IOSurface.framework
      - sdk: libc++.tbd
    postBuildScripts:
      - name: Stamp app build identity
        script: |
          set -eu
          export PATH="$HOME/.local/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          uv run --project "$SRCROOT/.." python "$SRCROOT/../scripts/bundle_version.py" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loopflow.ios.dev
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Loopflow
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the Machine address shown by Loopflow on your computer.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  LoopflowiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LoopflowiOSTests
      - path: ../rust/loopflow-execution/tests/fixtures/dto/server
        type: folder
        buildPhase: resources
    dependencies:
      - target: LoopflowiOS
      - package: ViewInspector
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LoopflowiOS:
    build:
      targets:
        LoopflowiOS: all
    test:
      targets: [LoopflowiOSTests]
