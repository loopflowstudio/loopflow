name: LoopflowSwift
options:
  bundleIdPrefix: com.loopflow
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  xcodeVersion: "15.0"
  postGenCommand: "mkdir -p LoopflowSwift.xcodeproj/project.xcworkspace/xcshareddata/swiftpm && cp Package.resolved LoopflowSwift.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector.git
    from: 0.10.0
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    minorVersion: 0.9.0

targets:
  Loopflow:
    type: framework
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Loopflow
        excludes:
          - Info.plist
          - Fonts
      - path: Loopflow/Fonts
        buildPhase: resources
        type: folder
    settings:
      base:
        INFOPLIST_FILE: Loopflow/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.loopflow.framework
        DEFINES_MODULE: YES
    dependencies:
      - package: WhisperKit

  LoopflowMac:
    type: application
    platform: macOS
    sources:
      - path: LoopflowMac
        excludes:
          - Info.plist
    dependencies:
      - target: Loopflow
      - package: WhisperKit
      # GhosttyKit is available via SPM binary target. For local development with
      # GhosttyKit, use `swift build` or add the framework manually after building
      # with: cd vendor/ghostty && zig build -Doptimize=ReleaseFast
      - sdk: Carbon.framework
      - sdk: QuartzCore.framework
      - sdk: Metal.framework
      - sdk: IOKit.framework
    settings:
      base:
        PRODUCT_NAME: Loopflow
        # Keep the Swift module named after the target so `import Loopflow` (the
        # framework) isn't swallowed as a self-import when the product is Loopflow.
        PRODUCT_MODULE_NAME: LoopflowMac
        INFOPLIST_FILE: LoopflowMac/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.loopflow.mac
        CODE_SIGN_ENTITLEMENTS: LoopflowMac/Loopflow.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@loader_path/../Frameworks"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        # GhosttyKit is disabled in Xcode project - use SPM build for full terminal support
        # To enable locally, build Ghostty and add GHOSTTY_ENABLED to compilation conditions

  LoopflowiOS:
    type: application
    platform: iOS
    sources:
      - path: LoopflowiOS
    dependencies:
      - target: Loopflow
      - package: WhisperKit
    settings:
      base:
        PRODUCT_NAME: Loopflow
        PRODUCT_MODULE_NAME: LoopflowiOS
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.loopflow.ios
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2V3M244HF2
        INFOPLIST_KEY_CFBundleDisplayName: Loopflow
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Loopflow uses the microphone for voice-to-text input."

  LoopflowTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LoopflowTests
    dependencies:
      - target: LoopflowMac
      - package: ViewInspector
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: LoopflowTestsPrincipal
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Loopflow.app/Contents/MacOS/Loopflow
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

  LoopflowUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: LoopflowUITests
    dependencies:
      - target: LoopflowMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LoopflowMac
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
