name: LoopflowSwift
options:
  bundleIdPrefix: com.loopflow
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector.git
    from: 0.10.0

targets:
  Concerto:
    type: application
    platform: macOS
    sources:
      - path: Concerto
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: Concerto/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.loopflow.concerto
        CODE_SIGN_STYLE: Automatic

  ConcertoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ConcertoTests
    dependencies:
      - target: Concerto
      - package: ViewInspector
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Concerto.app/Contents/MacOS/Concerto
