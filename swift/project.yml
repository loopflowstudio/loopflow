name: LoopflowSwift
options:
  bundleIdPrefix: com.loopflow
  deploymentTarget:
    macOS: "26.0"
    iOS: "18.0"
  xcodeVersion: "15.0"
  postGenCommand: "mkdir -p LoopflowSwift.xcodeproj/project.xcworkspace/xcshareddata/swiftpm && cp Package.resolved LoopflowSwift.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector.git
    from: 0.10.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.7.0

targets:
  Loopflow:
    type: framework
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Loopflow
        excludes:
          - Info.plist
          - Fonts
          - Themes
      - path: Loopflow/Fonts
        buildPhase: resources
        type: folder
      - path: Loopflow/Themes
        buildPhase: resources
        type: folder
    settings:
      base:
        INFOPLIST_FILE: Loopflow/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.loopflow.framework
        DEFINES_MODULE: YES
  LoopflowMac:
    type: application
    platform: macOS
    sources:
      - path: LoopflowMac
        excludes:
          - Info.plist
          - GhosttyResources
          - ThirdPartyNotices
      - path: LoopflowMac/GhosttyResources
        buildPhase: resources
        type: folder
      - path: LoopflowMac/ThirdPartyNotices
        buildPhase: resources
        type: folder
    dependencies:
      - target: Loopflow
      - package: Sparkle
    preBuildScripts:
      - name: Build Loopflow's Rust library
        script: |
          set -eu
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          release=""
          if [ "$CONFIGURATION" = "Release" ]; then release="--release"; fi
          /usr/bin/python3 "$SRCROOT/../scripts/loopflow-dev.py" ffi $release
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Bundle Loopflow control tools
        script: |
          set -eu
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          /usr/bin/python3 "$SRCROOT/../scripts/loopflow-dev.py" bundle-control-tools \
            --output "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH"
          uv run --project "$SRCROOT/.." python "$SRCROOT/../scripts/third_party.py" package \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          if [ "${CODE_SIGNING_ALLOWED:-NO}" = "YES" ]; then
            signing_identity="${EXPANDED_CODE_SIGN_IDENTITY:--}"
            for helper in lf; do
              /usr/bin/codesign --force --sign "$signing_identity" \
                "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/$helper"
            done
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: Loopflow
        # Keep the Swift module named after the target so `import Loopflow` (the
        # framework) isn't swallowed as a self-import when the product is Loopflow.
        PRODUCT_MODULE_NAME: LoopflowMac
        # LoopflowFFI: Loopflow's Rust library, as Package.swift links it.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/LoopflowFFI
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../target/debug
        OTHER_LDFLAGS:
          - "$(inherited)"
          - -framework
          - CoreServices
          - -framework
          - Security
          - -framework
          - SystemConfiguration
          - -liconv
          - -lproc
        INFOPLIST_FILE: LoopflowMac/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.loopflow.mac
        CODE_SIGN_ENTITLEMENTS: LoopflowMac/Loopflow.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@loader_path/../Frameworks"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
      configs:
        Release:
          LIBRARY_SEARCH_PATHS: $(SRCROOT)/../target/release
  LoopflowTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LoopflowTests
    dependencies:
      - target: LoopflowMac
      - package: ViewInspector
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: LoopflowTestsPrincipal
        # `@testable import LoopflowMac` loads the LoopflowFFI module it imports.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/LoopflowFFI
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Loopflow.app/Contents/MacOS/Loopflow
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

  LoopflowUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: LoopflowUITests
    dependencies:
      - target: LoopflowMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LoopflowMac
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
