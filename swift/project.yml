name: LoopflowSwift
options:
  bundleIdPrefix: com.loopflow
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector.git
    from: 0.10.0

targets:
  LoopflowCore:
    type: framework
    platform: macOS
    sources:
      - path: LoopflowCore
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: LoopflowCore/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.loopflow.core
        DEFINES_MODULE: YES

  Concerto:
    type: application
    platform: macOS
    sources:
      - path: Concerto
        excludes:
          - Info.plist
          - Fonts
    dependencies:
      - target: LoopflowCore
      # GhosttyKit is available via SPM binary target. For local development with
      # GhosttyKit, use `swift build` or add the framework manually after building
      # with: cd vendor/ghostty && zig build -Doptimize=ReleaseFast
      - sdk: Carbon.framework
      - sdk: QuartzCore.framework
      - sdk: Metal.framework
      - sdk: IOKit.framework
    settings:
      base:
        INFOPLIST_FILE: Concerto/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.loopflow.concerto
        CODE_SIGN_STYLE: Automatic
        # GhosttyKit is disabled in Xcode project - use SPM build for full terminal support
        # To enable locally, build Ghostty and add GHOSTTY_ENABLED to compilation conditions

  ConcertoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ConcertoTests
    dependencies:
      - target: Concerto
      - package: ViewInspector
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Concerto.app/Contents/MacOS/Concerto

  ConcertoUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: ConcertoUITests
    dependencies:
      - target: Concerto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Concerto
