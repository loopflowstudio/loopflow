# Loopflow Website Content
# Edit copy here—no need to touch main.py

homepage:
  hero:
    tagline: "Living software, conducted by you."
    subline: >-
      Waves are persistent agents that hold a goal, remember what they learn,
      and stay steerable. The organization is recursive — waves conduct
      projects, projects conduct tasks, agents launch agents — and nothing
      sits at the center.
    loopflow_download_url: "https://downloads.loopflow.studio/Loopflow-latest.dmg"

  screenshot:
    heading: "The Context Lab"
    image: "/static/context-lab.png"
    image_alt: "Context Lab showing what one agent received: contributing assets, prompt-ordered lanes, and trace addresses"
    caption: "Exactly what each agent was told — every run's context, drillable to evidence."

  pillars:
    heading: "What makes it alive"
    items:
      - title: "Agents conduct agents"
        description: >-
          `lf` is the API. A wave delegates work with `lf task run`, redirects
          it mid-turn with `lf task steer`, and proves the redirect landed
          with a receipt. The same verbs you type.
      - title: "The whole lifecycle, not just the code"
        description: >-
          Plans live in Linear. PRs publish, survive review, and land through
          the merge queue. CI failures get repaired; releases cut on a
          cadence; worktrees clean themselves up. Waves run the process
          around the code — building, deploying, and maintaining software,
          not just writing it.
      - title: "Self-organizing, all the way down"
        description: >-
          Waves supervise projects; projects supervise tasks; every part
          keeps its own journal, memory, and receipts. Coordination lives in
          the repo, Linear, and GitHub — there is nothing central to die.
      - title: "The whole orchestra on one screen"
        description: >-
          `lf roadmap` buckets every open task by what it needs from you.
          Trace what any agent was told, what it spent, and what it shipped.
          The Mac app renders the same JSON the CLI reads.

  building_blocks:
    heading: "Building blocks"
    items:
      - label: "A wave"
        filename: "wave/auth/GOAL.md"
        content: |
          ## Objective

          Unify authentication. Each wake, pick the next gap — duplicate
          token validation, session refresh, a slow startup path — direct
          the concrete Task that closes it, and record what shipped in
          memory.

          ## Measures

          - **Key Results**: one auth path across web and desktop.
          - **Quality**: auth startup under 200ms.
      - label: "A project"
        filename: "Linear · created via lf pm"
        content: |
          lf pm project create --wave auth \
            --title "Unified sign-in" \
            --definition "One auth path across
              web and desktop." \
            --kr "Over one week of real sign-ins,
              every flow rides the new path
              unattended — zero rescues."
      - label: "A task"
        filename: "terminal"
        content: |
          lf task start "Unify token validation" \
            --project unified-sign-in
          lf task steer AUTH-12 \
            "prefer the middleware approach"
          lf task receipt cmd_9f2 --until incorporated
          lf pr land -c
      - label: "A skill"
        filename: ".lf/skills/implement.md"
        content: |
          Turn the design doc into working code.

          ## Workflow
          1. Understand the design
          2. Implement data structures and functions
          3. Verify with tests and done-when checks

  install:
    heading: "Get Loopflow"
    note: "The Mac app bundles the CLI; every wave it runs is steerable from either."
    cli_label: "Or just the CLI (macOS or Linux):"
    command_display: |
      curl -fsSL https://loopflow.studio/install.sh | sh
      lf init
    command_copy: "curl -fsSL https://loopflow.studio/install.sh | sh && lf init"
