# Loopflow Website Content
# Edit copy here—no need to touch main.py

homepage:
  hero:
    tagline: "Loopflow is a software instrument."
    subline: >-
      Make software through agents, your way.
    description: >-
      Work closely with an agent, hand off a task, or coordinate several
      streams of work. Shape the workflow around how you want to build.
      Loopflow takes care of the branches, context, checks, and handoffs
      that keep it moving.
    loopflow_download_url: "https://downloads.loopflow.studio/Loopflow-latest.dmg"

  showcase:
    items:
      - image: "/static/wave-surface.png"
        image_alt: "A Wave with its objective, projects, tasks, and live conversation"
        caption: "A Wave: its goal, its work, and a conversation you can steer."

  getting_started:
    heading: "Start with a workflow. Make it yours."
    introduction: >-
      A workflow defines the steps agents take and the conversations you
      have along the way.
    items:
      - title: "Start with the defaults"
        description: >-
          Use a ready-made workflow to take a task from an idea to working
          software. You can start building before deciding how to
          customize the process.
      - title: "Capture your tasks"
        description: >-
          Write down the features, fixes, and questions you want to work
          on. Tasks live in Linear, organized into projects. Choose a
          task to start when you're ready.
      - title: "Come back for design and demo"
        description: >-
          The default workflow gives you follow-up conversations to shape
          the design and review a working demo. Agents build and check
          the work in between. Your feedback guides the next pass.
      - title: "Choose where you join in"
        description: >-
          Add, move, or remove conversations to choose when you're involved
          and what you work through together. Select a workflow for each
          task, or set a default for a project. For projects you want to
          run autonomously, remove the planned conversations while keeping
          automated checks in place.
    links:
      - label: "Start your first task"
        href: "/docs/getting-started#build-features"
      - label: "Customize a workflow"
        href: "/docs/authoring#flows"

  independence:
    heading: "Choose your models. Own your process."
    text: >-
      Loopflow's job is to make your way of working dependable. We have
      no stake in which model you choose. Use your own agent accounts,
      run on your own machines, and keep your skills, workflows, and
      memory in files you can read, change, and version. Loopflow is
      open source.

  features:
    heading: "Features"
    introduction: "The pieces of your agent workflow, working together."
    items:
      - title: "Worktree & Git management"
        summary: "Give each task its own place to work."
        description: >-
          A worktree is a separate working copy of your project. Loopflow
          creates or reuses one for each Task and keeps track of its branch
          and pull requests. Several tasks can move forward at once. When
          it's time to bring changes together, Loopflow handles syncing,
          delivery, and cleanup.
        href: "/architecture/delivery"
        link_label: "Worktrees and delivery"
      - title: "CI & PR review"
        summary: "Check the work. Give it another pass."
        description: >-
          Loopflow prepares changes for review and can walk you through
          the result. Review feedback feeds another round of implementation.
          Once a Task's pull request is handed off for landing, the CI
          watcher can start a repair when required checks fail.
        href: "/docs/authoring#loopflows"
        link_label: "Review workflows"
      - title: "Project management"
        summary: "Keep the plan connected to the work."
        description: >-
          Projects and Tasks live in Linear. Loopflow connects each Task
          to its working copy, conversations, workflow, and pull requests.
          See what's moving, what's waiting, and what needs a decision.
          Waves hold longer-running goals and memory as plans change.
        href: "/docs/waves"
        link_label: "Tasks and Waves"
      - title: "Credential forwarding"
        summary: "Your accounts, on another machine."
        description: >-
          Start work over SSH using accounts from your laptop. For Claude
          and Codex, Loopflow supplies a short-lived access token when
          needed, without copying your saved login. Background work that
          continues after disconnecting uses credentials installed remotely.
        href: "/docs/security#understand-account-authority-over-ssh"
        link_label: "Remote access"
      - title: "Customizable skills & workflows"
        summary: "Write down how you work. Change any step."
        description: >-
          A skill is a text file containing instructions. A workflow
          connects skills, commands, and conversations—including loops for
          another attempt. Loopflow supplies a library for designing,
          building, debugging, reviewing, and shipping. Those files are
          yours to edit.
        href: "/docs/authoring"
        link_label: "Skills and workflows"
      - title: "Memory & context"
        summary: "Leave useful notes for the next round."
        description: >-
          Working notes stay with the current change. Longer-lived goals
          and lessons live in readable, editable files. Loopflow brings
          the relevant material into later work, with controls for
          inspecting and budgeting the context it sends to the agent.
        href: "/docs/waves#nested-waves"
        link_label: "Memory and context"
    connection:
      heading: "The connections are part of the product, too."
      text: >-
        A Task in your plan gets a working copy. Its workflow brings in
        the relevant instructions and memory, builds the change, and brings
        you in at the steps you've chosen. Feedback can send it through
        another pass. When the
        pull request is handed off for landing, CI repair returns to that
        Task's checkout. Lessons can be saved for the next task.

  scale:
    heading: "Develop your company's way of working with agents."
    text: >-
      Give people a shared language and toolset for trying ideas,
      comparing approaches, and keeping what works. A useful instruction
      becomes a shared skill. A successful sequence becomes a workflow.
      Teams can review and improve those files together, choosing the
      agents and level of involvement that suit the work.

  building_blocks:
    heading: "Every step is a file you can change"
    items:
      - label: "A skill"
        filename: ".lf/skills/implement.md"
        content: |
          Turn the design doc into working code.

          ## Workflow
          1. Understand the design
          2. Implement data structures and functions
          3. Verify with tests and done-when checks

      - label: "A flow"
        filename: ".lf/flows/feature.yaml"
        content: |
          - kickoff
          - step:
              id: review_plan
              name: review-design
              human: true
          - step:
              id: implement
              name: implement
          - compress
          - flow: refresh
          - step:
              id: decide
              name: loop-decide
              repeat:
                from: implement
          - pr-publish
          - step:
              id: review_demo
              name: demo
              human: true
      - label: "A task"
        filename: "terminal"
        content: |
          lf task create --run --wave auth \
            --title "Unify token validation"
          lf comment AUTH-12 \
            "prefer the middleware approach"
          lf task status AUTH-12 --json
          lf land -c
      - label: "A wave"
        filename: "wave/auth/GOAL.md"
        content: |
          ## Objective

          Unify authentication. Each wake, pick the next gap — duplicate
          token validation, session refresh, a slow startup path — direct
          the concrete Task that closes it, and record what shipped in
          memory.

          ## Process

          Read current Projects, KR proof, and Project-owned metrics. Route
          the most important gap to its owning Project; record only
          strategy-changing learning in memory.

  install:
    heading: "Get Loopflow"
    facts: >-
      Free and open source · Runs on your computer · Every step is a file
      you can change · Needs Claude Code or Codex, which have their own cost
    note: "The Mac app includes the command line tool."
    cli_label: "Or just the command line tool (macOS or Linux):"
    command_display: |
      curl -fsSL https://loopflow.studio/install.sh | sh
      lf init
    command_copy: "curl -fsSL https://loopflow.studio/install.sh | sh && lf init"
