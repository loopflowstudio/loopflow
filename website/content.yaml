# The company page and the short pages under the Company menu. Drafted with Jack
# Heart on 2026-10-08; copy beyond his quoted lines is draft.
studio:
  company:
    title: Loopflow Studio
    heading: We make three things.
    efforts:
    - name: Loopflow
      label: The tool we build with
      text: Loopflow is a software engineering CLI for your agents. Free and open source.
      status: Available today
      link:
        label: Loopflow ↗
        href: /
    - name: Etude
      label: What we sell
      text: 'Experiment orchestration, for doing science inside a company: state the hypothesis, run
        the experiment, read the evidence, change your mind.'
      status: Not yet available
      link:
        label: Etude ↗
        href: /etude
    - name: Fantasia
      label: The research that drives both
      text: 'Superhuman Magic: The Gathering bots. Building them is what drives the development of
        Loopflow and Etude.'
      status: In progress
      link:
        label: Fantasia ↗
        href: /fantasia
  fantasia:
    title: Fantasia
    label: Fantasia · Loopflow Studio
    heading: 'Superhuman Magic: The Gathering bots.'
    lede: 'An AI-assisted Pro Tour testing house: serious practice, visible disagreement, rapid experiments,
      and the fun of discovering something together.'
    points:
    - title: Today
      text: A person can play a one-on-one game against a trained bot, a search bot, or random play,
        and replay the finished game.
    - title: The aim
      text: Bots that play better than the best people.
    - title: Why Magic
      text: It is the lever for the other two. Building the bots shows us what Loopflow needs, and
        running their training shows us what Etude needs. Fantasia is Etude’s first user.
    status: In progress.
    link:
      label: Source ↗
      href: https://github.com/loopflowstudio/fantasia
  etude:
    title: Etude
    label: Etude · Loopflow Studio
    heading: Experiment orchestration.
    lede: We are building this.
  about:
    title: About
    label: About · Loopflow Studio
    heading: Jack Heart
    lede: Founder of Loopflow Studio.
# The homepage's body is home.html. This block holds what other pages share with
