# Loopflow Website Content
# Edit copy here—no need to touch main.py

homepage:
  hero:
    tagline: "Coding agents that work in a team and build over time."
    loopflow_download_url: "https://downloads.loopflow.studio/Loopflow-latest.dmg"

  video:
    poster: "/static/loopflow-main.png"
    src: null

  install:
    command_display: |
      curl -fsSL https://loopflow.studio/install.sh | sh
      lf init
    command_copy: "curl -fsSL https://loopflow.studio/install.sh | sh && lf init"

  capabilities:
    heading: "Built for teams of agents, not one-shot chats."
    items:
      - title: "Persistent memory across runs"
        description: "Each wave keeps a memory its agent writes as it works — so it builds on what it learned, not just what you typed."
      - title: "Prompt files you can diff"
        description: "Skills, directions, and goals live in your repo, so prompt changes get reviewed like code."
      - title: "Delegation you can watch"
        description: "A wave agent coordinates; it dispatches workers that each open a PR you can attach to, steer, or ship."
      - title: "From manual to autonomous"
        description: "Run a wave by hand, or let it loop — picking work, reacting to merges, firing on a schedule."
      - title: "Human control at shipping time"
        description: "Agents do the work; you decide whether to ship, iterate, or branch."
      - title: "Works across surfaces"
        description: "The same wave runs in the terminal, headless automation, and Loopflow with context intact."

  building_blocks:
    heading: "Building blocks"
    items:
      - label: "A wave"
        filename: "wave/auth/GOAL.md"
        content: |
          ---
          workers: 2
          ---

          ## Objective

          Unify authentication. Each loop, pick the next gap — duplicate token
          validation, session refresh, a slow startup path — dispatch a worker
          to close it, and record what shipped in memory.

          ## Measures

          - **Key Results**: one auth path across web and desktop.
          - **Quality**: auth startup under 200ms.

          ## Process

          Use the build flow for implementation work; write a scratch design
          first when a change crosses storage, tokens, or public auth behavior.
      - label: "A skill"
        filename: ".lf/skills/implement.md"
        content: |
          Turn the design doc into working code.

          ## Workflow
          1. Understand the design
          2. Implement data structures and functions
          3. Verify with tests and done-when checks
      - label: "A direction"
        filename: ".lf/directions/craft.md"
        content: |
          Prioritize clarity over cleverness.

          - Match existing patterns in this codebase
          - Prefer explicit data flow to hidden magic
          - Ship complete milestones, not partial layers
      - label: "A flow"
        filename: ".lf/flows/ship-wave.yaml"
        content: |
          skills:
            - design
            - implement
            - review
            - polish

  products:
    heading: "Free and open source"
    loopflow:
      name: "Loopflow"
      note: "Mac and iOS"
      description: "Visual podium for running waves across branches and repos."
      image: "/static/loopflow-main.png"
      image_alt: "Loopflow showing active and idle waves"
      details:
        - "Stay creative — interactive sessions where you play the lead part, not approve permissions"
        - "Arrange the symphony — create, configure, and launch waves visually"
        - "Maintain focus — easily find where your attention is most needed"
    server:
      name: "Server"
      note: "CLI and daemon"
      description: "Manage prompts and context with the CLI. Run waves remotely with the daemon."
      details:
        - "lf — context management for waves, skills, directions, and memory"
        - "lfd — long-running daemon, natively or in containers"
        - "Authentication built in — WorkOS OAuth via Loopflow Studio"
      terminal_lines:
        - type: "command"
          content: "lf loop billing"
        - type: "output"
          content: "wave agent · reading GOAL.md + MEMORY.md"
        - type: "output"
          content: "dispatch · worker: build \"generate invoices\""
        - type: "output"
          content: "session billing-w3 · tmux attach -r -t billing-w3"
