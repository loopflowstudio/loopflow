# Homepage copy approved by Jack Heart, prototype 05, 2026-10-07.
# Edit copy here; main.py renders it.

homepage:
  navigation:
  - label: Flows
    href: '#flows'
  - label: Tasks
    href: '#tasks'
  - label: Mac app
    href: '#mac'
  - label: Why
    href: '#why'
  - label: Docs ↗
    href: /docs
  hero:
    label: Loopflow is a software instrument
    tagline: A command line for great software engineering.
    subline: A free, open-source podium for conducting your software orchestra, with native
      macOS and terminal interfaces.
    actions:
    - label: See it ↓
      href: '#flows'
    - label: Install ↓
      href: '#start'
    commands: |-
      $ lf skill design "Add CSV export"  # one session
      $ lf flow ship-api                   # a Flow: sessions in order
      $ lf flow list                      # the Flows you have
      $ lf task create --title "Add CSV export"
      $ lf task run EXP-12                # a task's next step
      $ lf task status EXP-12
      $ lf session list                   # every conversation
      $ lf wave status exports            # the plan
      $ lf pr land                        # merge it
  ownership:
    items:
    - title: Your models
      text: Claude Code, Codex, or OpenCode, on your own accounts.
    - title: Your machines
      text: Runs locally, and over SSH where you choose.
    - title: Your methods
      text: Skills and workflows are files in your repo (or use the built-ins). MIT licensed.
    - title: Your terminal
      text: lf is a command. Run it in the terminal you already use.
  flows:
    label: In the terminal
    heading: Stay in flow while you work with agents.
    introduction: 'A session is one conversation with an agent. Good work takes several: a plan,
      a build, a check, another pass. A Flow is a file that runs those sessions in order: each
      step is its own session, with a commit between them. lf runs the Flow in whatever terminal
      you are in.'
    example:
      label: 'Example loopflow:'
      steps:
      - name: kickoff
        detail: writes a design note
        you: false
      - name: review-design
        detail: a conversation with you
        you: true
      - name: implement
        detail: builds it
        you: false
      - name: gate
        detail: runs the checks
        you: false
      - name: demo
        detail: a conversation with you
        you: true
      loop_to: implement
      loop_label: another pass
      exit_label: done
      exit_to: land
      caption: The filled steps are conversations with you.
      file: .lf/flows/feature.yaml
    commands: |-
      # .lf/flows/ship-api.yaml
      - implement
      - compress
      - gate

      # one session
      $ lf implement "Rate-limit the export endpoint"

      # the Flow: three sessions, in order
      $ lf flow ship-api "Rate-limit the export endpoint"
    parts:
    - title: Skills & workflows
      description: Instructions are Markdown and sequences are YAML, kept in your repository,
        or use the built-ins. Choose the steps, and which of them are conversations with you.
      link:
        label: Skills and workflows ↗
        href: /docs/authoring
    - title: Scale the autonomy
      description: Stay in one session and steer as you go, meet it at design and demo, or let
        it run. Choose one per task or per project.
      link:
        label: Write your own Flow ↗
        href: /docs/authoring#flows
    - title: Checks & review
      description: Checks run on each change. After a task’s pull request is handed off for
        landing, a failed required check can start a repair in the same task.
      link:
        label: Review workflows ↗
        href: /docs/authoring#loopflows
  tasks:
    label: Around the sessions
    heading: An organizing system for all your work.
    introduction: Whether you are one person or a large company. Four things, each inside the
      one before, kept in the same records the terminal and the Mac app read.
    items:
    - label: Wave
      title: A goal
      text: A lasting objective, with its plan and its memory. Reviewed notes carry goals and
        lessons into later sessions, so you do not rebuild context by hand.
      commands: |-
        $ lf --wave exports : "Review the goal"
        $ lf wave status exports
      link:
        label: Tasks and Waves ↗
        href: /docs/waves
    - label: Project
      title: The plan
      text: 'What the Wave is doing now: its tasks, its key results, and the workflow its tasks
        follow.'
      commands: |-
        $ lf task create --wave exports \
             --title "Add CSV export"
    - label: Task
      title: One outcome
      text: Each task gets its own working copy, branch, and pull request. Its sessions stay
        with it. Return to a task and its work is where you left it.
      commands: |-
        $ lf task run EXP-12
        $ lf task status EXP-12
      link:
        label: Worktrees and delivery ↗
        href: /architecture/delivery
    - label: Workflow
      title: Your part in it
      text: A workflow joins them. It names the points where you take part in a task’s conversation
        and the Flow that runs between each. A Flow is a file, so a team can review how it works
        with agents the way it reviews code.
      commands: |-
        # .lf/workflows/feature.yaml
        nodes:
          design: review-design
          demo: demo
        edges:
          - { from: start,  to: design, flow: task-design }
          - { from: design, to: demo,   flow: pursue }
          - { from: demo,   to: demo,   flow: pursue }
          - { from: demo,   to: end,    flow: ship }
      link:
        label: Write a workflow ↗
        href: /docs/authoring#workflows
  mac:
    label: On your Mac
    heading: Your sessions, organized around the work.
    introduction: Loopflow for Mac files each conversation with the task it belongs to. Go from
      the plan to a task’s terminal to what it shipped.
    capture:
      image: /static/wave-surface.png
      image_alt: Loopflow for Mac showing a goal, its key results, and ten tasks with their
        status
      width: 2880
      height: 1800
      caption: Actual capture, unedited. The Mac app includes the command line tool; the command
        line tool does not need the Mac app.
  why:
    label: Why it exists
    claim: To empower any human being to build with endless scale.
    lead: With great agents comes a need for great software process.
    paragraphs:
    - Agents make it possible for one engineer to build what used to take a team. They make
      it just as easy to bury yourself in a mess. The more you zoom out, the more you need to
      zoom in to counterbalance.
    - The emphasis of the Loopflow product is around the work done by you. Its purpose is to
      make your time more effective, to help you mentally organize around the work happening
      with your agents.
  install:
    label: Install
    heading: Start playing.
    commands: |-
      # macOS or Linux, with Claude Code, Codex, or OpenCode installed
      $ curl -fsSL https://loopflow.studio/install.sh | sh
      $ lf init
    links:
    - label: Getting started ↗
      href: /docs/getting-started
    - label: Source ↗
      href: https://github.com/loopflowstudio/loopflow
    download_label: Download for Mac
    download_url: https://downloads.loopflow.studio/Loopflow-latest.dmg
  footer:
    text: Loopflow · An open-source software instrument.
    links:
    - label: Get started ↗
      href: /docs/getting-started
    - label: Source ↗
      href: https://github.com/loopflowstudio/loopflow
